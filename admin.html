<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المتجر - الإدارة السحابية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #219653; }
        #login-box { text-align: center; margin-top: 50px; }
        #admin-content { display: none; }
        .error { color: red; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول الإدارة</h2>
        <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور السرية">
        <button onclick="checkLogin()" style="margin-top: 15px;">دخول</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- لوحة التحكم الحقيقية -->
    <div id="admin-content" class="container">
        <h2>لوحة تحكم المتجر السحابي 🛠️</h2>
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="prod-name" placeholder="مثال: ساعة ذكية Ultra">
        </div>
        <div class="form-group">
            <label>السعر (دج):</label>
            <input type="number" id="prod-price" placeholder="مثال: 4500">
        </div>
        <div class="form-group">
            <label>صورة المنتج (من الهاتف مباشرة):</label>
            <input type="file" id="prod-image-file" accept="image/*">
        </div>
        <div class="form-group">
            <label>وصف المنتج:</label>
            <textarea id="prod-desc" rows="3" placeholder="تفاصيل المنتج ومزاياه..."></textarea>
        </div>
        <button onclick="addProduct()">إضافة المنتج للسحابة ➕</button>
    </div>

    <!-- إعدادات Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", // استبدلها بكودك السحابي إن لم يتم حفظه تلقائياً
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        window.checkLogin = function() {
            const pass = document.getElementById('admin-pass').value;
            if(pass === 'dzstore2026') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                document.getElementById('login-error').innerText = 'كلمة المرور غير صحيحة!';
            }
        }

        window.addProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const desc = document.getElementById('prod-desc').value;
            const imageFile = document.getElementById('prod-image-file').files[0];

            if(!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
                return;
            }

            let imageUrl = '';
            
            try {
                if(imageFile) {
                    alert('جاري رفع الصورة للسحابة...');
                    const storageRef = ref(storage, 'products/' + Date.now() + '_' + imageFile.name);
                    const snapshot = await uploadBytes(storageRef, imageFile);
                    imageUrl = await getDownloadURL(snapshot.ref);
                }

                await addDoc(collection(db, "products"), {
                    name: name,
                    price: Number(price),
                    desc: desc,
                    imageUrl: imageUrl,
                    createdAt: new Date()
                });

                alert('تمت إضافة المنتج بنجاح وتخزينه سحابياً! 🚀');
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-image-file').value = '';
            } catch (error) {
                console.error("خطأ أثناء الإضافة: ", error);
                alert('حدث خطأ أثناء رفع المنتج، تأكد من إعدادات Storage.');
            }
        }
    </script>
</body>
</html>
