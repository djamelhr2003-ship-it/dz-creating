<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم | إدارة المتجر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#090d0b;--card:rgba(255,255,255,.045);--tx:#f5f2ea;--mu:#9ba79f;--accent:#d9b65c;--danger:#ef4444;--border:rgba(255,255,255,.1)}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;margin:0;padding:20px}
.container{max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--border);padding-bottom:15px}
h2{margin:0;color:var(--accent)}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px;backdrop-filter:blur(10px)}
.form-group{margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;color:var(--mu);font-size:.9rem}
.form-control{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--tx);font-family:inherit;box-sizing:border-box}
.form-control:focus{outline:none;border-color:var(--accent)}
.btn{background:linear-gradient(90deg,#d9b65c,#f2d98c);color:#111;border:0;padding:10px 20px;font-weight:800;border-radius:8px;cursor:pointer;font-family:inherit}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--border);font-size:.9rem}
th{color:var(--accent)}
.back-link{color:var(--mu);text-decoration:none;font-size:.9rem;border:1px solid var(--border);padding:6px 12px;border-radius:8px}
.back-link:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<div class="container">
  <header>
    <h2>🔐 لوحة تحكم فريق العمل</h2>
    <a href="index.html" class="back-link">← العودة للمتجر</a>
  </header>

  <div class="box">
    <h3>إضافة منتج جديد للمتجر</h3>
    <div class="form-group">
      <label>اسم المنتج:</label>
      <input type="text" id="pName" class="form-control" placeholder="مثال: ساعة ذكية">
    </div>
    <div class="form-group">
      <label>السعر (دج):</label>
      <input type="number" id="pPrice" class="form-control" placeholder="مثال: 4500">
    </div>
    <div class="form-group">
      <label>وصف مختصر:</label>
      <input type="text" id="pDesc" class="form-control" placeholder="مواصفات المنتج...">
    </div>
    <button class="btn" onclick="addNewProduct()">إضافة المنتج ➕</button>
  </div>

  <div class="box">
    <h3>📦 طلبات الزبائن الواردة</h3>
    <table>
      <thead>
        <tr>
          <th>الزبون</th>
          <th>الهاتف</th>
          <th>الولاية</th>
          <th>المنتج</th>
          <th>السعر</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody"></tbody>
    </table>
  </div>
</div>

<script>
function addNewProduct() {
  let name = document.getElementById("pName").value.trim();
  let price = Number(document.getElementById("pPrice").value);
  let desc = document.getElementById("pDesc").value.trim();

  if(!name || !price) {
    alert("يرجى إدخال اسم المنتج والسعر على الأقل!");
    return;
  }

  let products = JSON.parse(localStorage.getItem("store_products")) || [];
  products.push({id: Date.now(), name: name, price: price, desc: desc});
  localStorage.setItem("store_products", JSON.stringify(products));

  alert("تمت إضافة المنتج بنجاح!");
  document.getElementById("pName").value = "";
  document.getElementById("pPrice").value = "";
  document.getElementById("pDesc").value = "";
}

function loadOrders() {
  let orders = JSON.parse(localStorage.getItem("store_orders")) || [];
  let tbody = document.getElementById("ordersTableBody");
  
  if(orders.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--mu);">لا توجد طلبات جديدة حتى الآن.</td></tr>`;
    return;
  }

  let html = "";
  orders.reverse().forEach(o => {
    html += `
      <tr>
        <td><b>${o.client}</b></td>
        <td>${o.phone}</td>
        <td>${o.wilaya}</td>
        <td>${o.product}</td>
        <td style="color:var(--accent);font-weight:bold;">${o.price.toLocaleString()} دج</td>
        <td style="color:var(--mu);font-size:.8rem;">${o.date}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

loadOrders();
</script>

</body>
</html>
