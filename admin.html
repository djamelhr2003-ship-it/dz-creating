<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة - متجري</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .btn-store { background: #232f3e; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 6px; font-weight: bold; }
        
        #login-box { text-align: center; max-width: 400px; margin: 50px auto; }
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-left: 45px; }
        .toggle-password { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; }
        
        #admin-content { display: none; }
        .tabs-nav { display: flex; gap: 3px; margin-bottom: 20px; flex-wrap: wrap; background: #e2e8f0; padding: 6px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px 4px; background: transparent; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #475569; min-width: 70px; text-align: center; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول مع زر العين -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول لوحة التحكم 🔐</h2>
        <div class="form-group"><label>اسم المستخدم:</label><input type="text" id="login-username" value="admin"></div>
        <div class="form-group">
            <label>كلمة المرور:</label>
            <div class="password-container">
                <input type="password" id="login-pass" value="123456">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>
        <button onclick="checkLogin()" style="background:#ffd814; color:#0f1111; width:100%; padding:12px;">دخول 🚀</button>
        <a href="index.html" class="btn-store" style="margin-top:10px;">🛍️ العودة للمتجر</a>
        <div id="login-error" style="color:red; margin-top:10px; text-align:center;"></div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-content">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; background: #232f3e; color: white;">
            <h2 style="margin: 0; color: white;">لوحة التحكم</h2>
            <button onclick="sessionStorage.clear(); location.reload();" style="background:#c0392b;">خروج</button>
        </div>

        <div class="container" style="padding: 10px;">
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('add-product-tab', event)">➕ إضافة منتج</button>
                <button class="tab-btn" onclick="switchTab('settings-tab', event)">⚙️ الإعدادات</button>
            </div>
        </div>

        <!-- تبويب إضافة منتج مع توابع الصنف (الألوان والمقاسات) -->
        <div id="add-product-tab" class="tab-content active">
            <div class="container">
                <h2>إضافة منتج جديد مع خصائصه والتوابع ➕</h2>
                <div class="form-group"><label>اسم المنتج:</label><input type="text" id="prod-name"></div>
                <div class="form-group"><label>سعر البيع (دج):</label><input type="number" id="prod-price"></div>
                <div class="form-group"><label>التصنيف:</label>
                    <select id="prod-category" onchange="checkCategoryType()">
                        <option value="إلكترونيات">إلكترونيات</option>
                        <option value="ملابس">ملابس</option>
                        <option value="أحذية">أحذية</option>
                        <option value="عام">عام</option>
                    </select>
                </div>
                
                <!-- التوابع الديناميكية (تظهر عند اختيار ملابس أو أحذية مثلاً) -->
                <div id="variant-section" style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:15px;">
                    <h4 style="margin:0 0 10px 0; color:#2563eb;">🎨 التوابع والخصائص الخاصة للصنف:</h4>
                    <div class="form-group"><label>الألوان المتاحة (افصل بينها بفاصلة ,):</label><input type="text" id="prod-colors" placeholder="أحمر, أزرق, أسود"></div>
                    <div class="form-group"><label>المقاسات المتاحة (افصل بينها بفاصلة ,):</label><input type="text" id="prod-sizes" placeholder="S, M, L, XL أو 40, 41, 42"></div>
                </div>

                <div class="form-group"><label>رابط صورة المنتج:</label><input type="text" id="prod-img" placeholder="https://..."></div>
                <div class="form-group"><label>وصف المنتج:</label><textarea id="prod-desc" placeholder="تفاصيل المنتج..."></textarea></div>
                <button onclick="addProduct()">نشر المنتج للمتجر 🚀</button>
            </div>
        </div>

        <!-- تبويب الإعدادات (تغيير اسم المتجر) -->
        <div id="settings-tab" class="tab-content">
            <div class="container" style="max-width:500px;">
                <h2>⚙️ إعدادات المتجر العامة</h2>
                <div class="form-group">
                    <label>اسم المتجر الجديد:</label>
                    <input type="text" id="setting-store-name" placeholder="اكتب اسم متجرك هنا...">
                </div>
                <button onclick="saveStoreSettings()" style="width:100%;">حفظ إعدادات المتجر 💾</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.togglePasswordVisibility = function() {
            let passInput = document.getElementById('login-pass');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        }

        window.checkLogin = function() {
            if(document.getElementById('login-username').value.trim() === "admin" && document.getElementById('login-pass').value.trim() === "123456") {
                sessionStorage.setItem('logged', 'true');
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            } else {
                document.getElementById('login-error').innerText = 'خطأ في اسم المستخدم أو كلمة المرور!';
            }
        }

        window.switchTab = function(tabId, event) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // حفظ اسم المتجر في الذاكرة ليظهر في المتجر
        window.saveStoreSettings = function() {
            let newName = document.getElementById('setting-store-name').value.trim();
            if(!newName) { alert('الرجاء إدخال اسم المتجر!'); return; }
            localStorage.setItem('dz_store_name', newName);
            alert('تم حفظ اسم المتجر بنجاح! سيظهر الآن في ترويسة المتجر.');
        }

        window.addProduct = async function() {
            let name = document.getElementById('prod-name').value.trim();
            let price = Number(document.getElementById('prod-price').value) || 0;
            let category = document.getElementById('prod-category').value;
            let img = document.getElementById('prod-img').value.trim();
            let description = document.getElementById('prod-desc').value.trim();

            let colorsArr = document.getElementById('prod-colors').value.split(',').map(s => s.trim()).filter(Boolean);
            let sizesArr = document.getElementById('prod-sizes').value.split(',').map(s => s.trim()).filter(Boolean);

            if(!name || !price) { alert('الرجاء إدخال اسم المنتج والسعر!'); return; }

            try {
                await addDoc(collection(db, "products"), {
                    name, price, category, description,
                    imageUrls: img ? [img] : [],
                    variants: { colors: colorsArr, sizes: sizesArr },
                    createdAt: new Date()
                });
                alert('تم إضافة المنتج وتوابعه بنجاح للمتجر!');
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-img').value = '';
                document.getElementById('prod-desc').value = '';
            } catch(e) {
                alert('فشل في نشر المنتج.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if(sessionStorage.getItem('logged') === 'true') {
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
            }
        });
    </script>
</body>
</html>
