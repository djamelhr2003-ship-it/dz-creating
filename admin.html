<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة التحكم السحابية | إدارة المتجر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0f0e;--card:#131a17;--tx:#f5f2ea;--mu:#9ba79f;--accent:#d9b65c;--danger:#ef4444;--success:#22c55e;--border:rgba(255,255,255,.08)}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;margin:0;padding:20px;box-sizing:border-box}
*, *:before, *:after{box-sizing:inherit}
.container{max-width:1100px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;border-bottom:1px solid var(--border);padding-bottom:15px}
h2{margin:0;color:var(--accent)}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:25px;margin-bottom:25px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-bottom:15px}
.form-group label{display:block;margin-bottom:5px;color:var(--mu);font-size:0.85rem}
.form-control{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--tx);font-family:inherit}
.form-control:focus{outline:none;border-color:var(--accent)}
select.form-control option{background:#131a17;color:#fff}
.btn{background:linear-gradient(90deg,#d9b65c,#f2d98c);color:#111;border:0;padding:12px 20px;font-weight:800;border-radius:8px;cursor:pointer;font-family:inherit}
.btn-danger{background:var(--danger);color:#fff;padding:6px 12px;font-size:0.8rem}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{padding:12px;text-align:right;border-bottom:1px solid var(--border);font-size:0.88rem}
th{color:var(--accent)}
.back-link{color:var(--mu);text-decoration:none;font-size:0.85rem;border:1px solid var(--border);padding:6px 14px;border-radius:8px}
.back-link:hover{color:var(--accent);border-color:var(--accent)}

#loginOverlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: var(--bg); z-index: 9999; display: flex;
  justify-content: center; align-items: center;
}
.login-box {
  background: var(--card); border: 1px solid var(--border);
  padding: 40px; border-radius: 20px; text-align: center; width: 100%; max-width: 380px;
}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="login-box">
    <h3 style="color:var(--accent);margin-top:0;">🔐 لوحة تحكم الفريق</h3>
    <p style="color:var(--mu);font-size:0.85rem;margin-bottom:20px;">أدخل كلمة المرور السرية:</p>
    <input type="password" id="adminPasswordInput" class="form-control" placeholder="كلمة المرور" style="margin-bottom:15px;text-align:center;">
    <button class="btn" style="width:100%;" onclick="checkPassword()">دخول 🚀</button>
    <br><br>
    <a href="index.html" style="color:var(--mu);font-size:0.8rem;text-decoration:none;">← العودة للمتجر</a>
  </div>
</div>

<div class="container" id="adminMainContent" style="display:none;">
  <header>
    <h2>🔐 لوحة التحكم السحابية للفريق</h2>
    <a href="index.html" class="back-link">← العودة للمتجر</a>
  </header>

  <div class="box">
    <h3 style="margin-top:0;color:var(--accent);">إضافة منتج جديد سحابياً</h3>
    <div class="form-grid">
      <div class="form-group">
        <label>اسم المنتج:</label>
        <input type="text" id="pName" class="form-control" placeholder="مثال: ساعة ذكية">
      </div>
      <div class="form-group">
        <label>السعر (دج):</label>
        <input type="number" id="pPrice" class="form-control" placeholder="4500">
      </div>
      <div class="form-group">
        <label>التصنيف:</label>
        <select id="pCategory" class="form-control">
          <option value="إلكترونيات">إلكترونيات</option>
          <option value="منزل">أدوات منزلية</option>
          <option value="إكسسوارات">إكسسوارات</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:15px;">
      <label>وصف المنتج:</label>
      <input type="text" id="pDesc" class="form-control" placeholder="تفاصيل المنتج...">
    </div>
    <button class="btn" onclick="addNewProduct()">إضافة المنتج ➕</button>
  </div>

  <div class="box">
    <h3 style="margin-top:0;color:var(--accent);">📦 المنتجات في القاعدة السحابية</h3>
    <table>
      <thead>
        <tr>
          <th>المنتج</th>
          <th>التصنيف</th>
          <th>السعر</th>
          <th>إجراء</th>
        </tr>
      </thead>
      <tbody id="adminProductsTable"></tbody>
    </table>
  </div>

  <div class="box">
    <h3 style="margin-top:0;color:var(--accent);">🚀 طلبات الزبائن الفورية</h3>
    <table>
      <thead>
        <tr>
          <th>الزبون</th>
          <th>الهاتف</th>
          <th>الولاية والعنوان</th>
          <th>المنتجات والكمية</th>
          <th>الإجمالي</th>
          <th>التاريخ</th>
        </tr>
      </thead>
      <tbody id="ordersTableBody"></tbody>
    </table>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDdJY7mI1DOMKh7zTJs_Ve3d4Xp1YBdMYI",
    authDomain: "creater-ecom.firebaseapp.com",
    projectId: "creater-ecom",
    storageBucket: "creater-ecom.firebasestorage.app",
    messagingSenderId: "893449950593",
    appId: "1:893449950593:web:22c5f6f220ea809efb8480",
    measurementId: "G-MR5XLYXV0Q"
  };

  const app = initializeApp(firebaseConfig);
  window.db = getFirestore(app);
</script>

<script>
const ADMIN_SECRET_PASS = "dzstore2026";

function checkPassword() {
  let val = document.getElementById("adminPasswordInput").value.trim();
  if(val === ADMIN_SECRET_PASS) {
    document.getElementById("loginOverlay").style.display = "none";
    document.getElementById("adminMainContent").style.display = "block";
    loadAdminData();
  } else {
    alert("كلمة المرور خاطئة!");
  }
}

async function loadAdminData() {
  if(!window.db) {
    setTimeout(loadAdminData, 500);
    return;
  }
  const { collection, getDocs, deleteDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
  
  // تحميل المنتجات
  let pTable = document.getElementById("adminProductsTable");
  try {
    let pSnap = await getDocs(collection(window.db, "products"));
    let pHtml = "";
    pSnap.forEach(d => {
      let p = d.data();
      pHtml += `
        <tr>
          <td><b>${p.name}</b></td>
          <td>${p.category || 'عام'}</td>
          <td style="color:var(--accent);">${Number(p.price).toLocaleString()} دج</td>
          <td><button class="btn-danger" onclick="deleteProduct('${d.id}')">حذف</button></td>
        </tr>
      `;
    });
    pTable.innerHTML = pHtml || `<tr><td colspan="4" style="text-align:center;color:var(--mu);">لا توجد منتجات سحابية.</td></tr>`;
  } catch(e) { console.error(e); }

  // تحميل الطلبات
  let oTable = document.getElementById("ordersTableBody");
  try {
    let oSnap = await getDocs(collection(window.db, "orders"));
    let oHtml = "";
    oSnap.forEach(d => {
      let o = d.data();
      oHtml += `
        <tr>
          <td><b>${o.client}</b></td>
          <td>${o.phone}</td>
          <td>${o.wilaya} - ${o.address}</td>
          <td>${o.product}</td>
          <td style="color:var(--accent);font-weight:bold;">${Number(o.price).toLocaleString()} دج</td>
          <td style="color:var(--mu);font-size:0.8rem;">${o.date}</td>
        </tr>
      `;
    });
    oTable.innerHTML = oHtml || `<tr><td colspan="6" style="text-align:center;color:var(--mu);">لا توجد طلبات واردة حالياً.</td></tr>`;
  } catch(e) { console.error(e); }
}

async function addNewProduct() {
  let name = document.getElementById("pName").value.trim();
  let price = Number(document.getElementById("pPrice").value);
  let category = document.getElementById("pCategory").value;
  let desc = document.getElementById("pDesc").value.trim();

  if(!name || !price) {
    alert("الرجاء إدخال اسم المنتج والسعر!");
    return;
  }

  try {
    const { collection, addDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    await addDoc(collection(window.db, "products"), { name, price, category, desc });
    alert("تمت إضافة المنتج بنجاح إلى السحاب!");
    document.getElementById("pName").value = "";
    document.getElementById("pPrice").value = "";
    document.getElementById("pDesc").value = "";
    loadAdminData();
  } catch(e) {
    alert("حدث خطأ أثناء الإضافة.");
    console.error(e);
  }
}

async function deleteProduct(id) {
  if(!confirm("هل أنت متأكد من الحذف؟")) return;
  try {
    const { doc, deleteDoc } = await import("https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js");
    await deleteDoc(doc(window.db, "products", id));
    loadAdminData();
  } catch(e) {
    console.error(e);
  }
}
window.deleteProduct = deleteProduct;
</script>

</body>
</html>
