<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الشاملة - متجري العالمي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; }
        .btn-danger { background: #c0392b; }
        .btn-store { background: #232f3e; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 6px; font-weight: bold; }
        #login-box { text-align: center; max-width: 400px; margin: 50px auto; }
        #admin-content { display: none; }
        .tabs-nav { display: flex; gap: 3px; margin-bottom: 20px; flex-wrap: wrap; background: #e2e8f0; padding: 6px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px 4px; background: transparent; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #475569; min-width: 70px; font-size: 11px; text-align: center; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .orders-grid-compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .order-mini-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-card { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="centerModal" style="z-index: 5000;">
        <div class="modal-card" style="text-align: center; max-width: 400px; border: 2px solid #2563eb;">
            <h3 id="modalTitle" style="color: #2563eb; margin-top:0;">⚠️ تنبيه النظام</h3>
            <p id="modalMessage" style="color: #475569; font-size: 15px; line-height: 1.6;"></p>
            <button onclick="closeCenterModal()" style="margin-top: 15px; background: #2563eb; width: 100%;">فهمت ✅</button>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول لوحة التحكم 🔐</h2>
        <div class="form-group"><label>اسم المستخدم:</label><input type="text" id="login-username" placeholder="djamel hr"></div>
        <div class="form-group"><label>كلمة المرور:</label><input type="password" id="login-pass" placeholder="Djamel2003"></div>
        <button onclick="checkLogin()" style="background:#ffd814; border:1px solid #fcd200; color:#0f1111; width:100%; padding:12px; font-weight:bold;">دخول للنظام 🚀</button>
        <a href="index.html" class="btn-store" style="background:#232f3e; margin-top:10px;">🛍️ العودة للمتجر</a>
        <div id="login-error" style="color:red; margin-top:10px; text-align:center;"></div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-content">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; background: #232f3e; color: white;">
            <h2 style="margin: 0; color: white;">لوحة التحكم - <span id="welcome-role"></span></h2>
            <button onclick="logout()" class="btn-danger" style="width: auto; padding: 8px 15px;">خروج</button>
        </div>

        <div class="container" style="padding: 10px;">
            <div class="tabs-nav">
                <button class="tab-btn active" onclick="switchTab('orders-tab', event)">⏳ الطلبات</button>
                <button class="tab-btn" onclick="switchTab('add-product-tab', event)">➕ إضافة منتج مع أصناف وعروض</button>
                <button class="tab-btn" onclick="switchTab('manage-products-tab', event)">🏷️ المنتجات</button>
            </div>
        </div>

        <div id="orders-tab" class="tab-content active"><div class="container"><h2>إدارة طلبات COD ⏳</h2><div id="orders-list-new" class="orders-grid-compact">جاري التحميل...</div></div></div>

        <!-- تبويب إضافة منتج مع التصنيفات والعروض -->
        <div id="add-product-tab" class="tab-content">
            <div class="container">
                <h2>إضافة منتج وتصنيفه مع العروض ➕</h2>
                <div class="form-group"><label>اسم المنتج الأساسي:</label><input type="text" id="prod-name"></div>
                <div class="form-group"><label>سعر الشراء:</label><input type="number" id="prod-buy-price"></div>
                <div class="form-group"><label>سعر البيع الأساسي (دج):</label><input type="number" id="prod-price"></div>
                
                <div class="form-group">
                    <label>اختر الصنف / القسم:</label>
                    <select id="prod-category">
                        <option value="الكل">عام / رئيسي</option>
                        <option value="ساعات اليد">ساعات اليد ⌚</option>
                        <option value="الملابس">الملابس 👕</option>
                        <option value="الإلكترونيات">الإلكترونيات 📱</option>
                        <option value="الأحذية">الأحذية 👟</option>
                        <option value="أكسسوارات">أكسسوارات 🕶️</option>
                    </select>
                </div>

                <div class="form-group"><label>روابط الصور (فصل بينها بفواصل):</label><textarea id="prod-imgs" style="height:60px;" placeholder="https://..."></textarea></div>
                <div class="form-group"><label>رابط الفيديو:</label><input type="text" id="prod-video" placeholder="https://..."></div>
                
                <hr style="margin:20px 0;">
                <h3>🔥 قسم العروض والتخفيضات الخاصة</h3>
                <div class="form-group"><label><input type="checkbox" id="enable-offers"> <b>تفعيل وإظهار العروض للزبائن</b></label></div>
                
                <div id="offers-container">
                    <div class="offer-row" style="background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:10px;">
                        <div class="form-group"><label>عنوان أو وصف العرض:</label><input type="text" class="offer-title" placeholder="عرض خاص..."></div>
                        <div class="form-group"><label>السعر القديم (مشطوب بالأحمر ❌):</label><input type="number" class="offer-old-price" placeholder="مثال: 3500"></div>
                        <div class="form-group"><label>سعر العرض الجديد (صح بالأخضر ✔️):</label><input type="number" class="offer-new-price" placeholder="مثال: 2500"></div>
                    </div>
                </div>
                <button type="button" onclick="addOfferField()" class="btn-secondary" style="background:#3b82f6; margin-bottom:15px;">➕ إضافة عرض آخر</button>

                <div class="form-group"><label>الوصف:</label><textarea id="prod-desc"></textarea></div>
                <button onclick="addProduct()">نشر المنتج والتصنيف 🚀</button>
            </div>
        </div>

        <div id="manage-products-tab" class="tab-content"><div class="container"><h2>🏷️ إدارة وتعديل المنتجات</h2><div id="products-list">جاري التحميل...</div></div></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDdJY7mI1DON...", authDomain: "creater-ecom.firebaseapp.com", projectId: "creater-ecom", storageBucket: "creater-ecom.appspot.com", messagingSenderId: "893449950593", appId: "1:893449950593:web:..." };
        const db = getFirestore(app);

        window.showAlert = (t, m) => { document.getElementById('modalTitle').innerText = t; document.getElementById('modalMessage').innerText = m; document.getElementById('centerModal').style.display = 'flex'; }
        window.closeCenterModal = () => document.getElementById('centerModal').style.display = 'none';

        window.checkLogin = () => {
            let u = document.getElementById('login-username').value.trim();
            let p = document.getElementById('login-pass').value.trim();
            if(u === 'djamel hr' && p === 'Djamel2003') {
                sessionStorage.setItem('logged', u);
                document.getElementById('login-box').style.display = 'none';
                document.getElementById('admin-content').style.display = 'block';
                loadProducts(); loadOrders();
            } else { alert('خطأ في البيانات'); }
        }

        window.switchTab = (id, e) => {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(e) e.currentTarget.classList.add('active');
        }

        window.addOfferField = () => {
            let container = document.getElementById('offers-container');
            let div = document.createElement('div');
            div.className = 'offer-row';
            div.style = 'background:#f8fafc; padding:15px; border-radius:8px; border:1px solid #cbd5e1; margin-bottom:10px;';
            div.innerHTML = `
                <div class="form-group"><label>عنوان أو وصف العرض:</label><input type="text" class="offer-title" placeholder="عرض خاص..."></div>
                <div class="form-group"><label>السعر القديم (مشطوب بالأحمر ❌):</label><input type="number" class="offer-old-price" placeholder="مثال: 3500"></div>
                <div class="form-group"><label>سعر العرض الجديد (صح بالأخضر ✔️):</label><input type="number" class="offer-new-price" placeholder="مثال: 2500"></div>
                <button type="button" onclick="this.parentElement.remove()" class="btn-danger" style="padding:4px 8px; font-size:11px;">حذف هذا العرض</button>
            `;
            container.appendChild(div);
        }

        window.addProduct = async () => {
            let name = document.getElementById('prod-name').value.trim();
            let buyPrice = Number(document.getElementById('prod-buy-price').value) || 0;
            let price = Number(document.getElementById('prod-price').value) || 0;
            let category = document.getElementById('prod-category').value;
            let videoUrl = document.getElementById('prod-video').value.trim();
            let description = document.getElementById('prod-desc').value.trim();
            let imageUrls = document.getElementById('prod-imgs').value.split(',').map(s => s.trim()).filter(Boolean);
            
            let enableOffers = document.getElementById('enable-offers').checked;
            let offers = [];
            if(enableOffers) {
                document.querySelectorAll('.offer-row').forEach(row => {
                    let title = row.querySelector('.offer-title').value.trim();
                    let oldPrice = Number(row.querySelector('.offer-old-price').value) || 0;
                    let newPrice = Number(row.querySelector('.offer-new-price').value) || 0;
                    if(title && newPrice) offers.push({ title, oldPrice, newPrice });
                });
            }

            if(!name || !price) { showAlert('تنبيه', 'أدخل اسم المنتج والسعر!'); return; }

            await addDoc(collection(db, "products"), { name, buyPrice, price, category, imageUrls, videoUrl, description, enableOffers, offers, createdAt: new Date() });
            showAlert('نجاح', 'تم نشر المنتج والتصنيف بنجاح!');
            loadProducts();
        }

        async function loadProducts() {
            let snap = await getDocs(collection(db, "products"));
            let list = document.getElementById('products-list');
            list.innerHTML = '';
            snap.forEach(d => {
                let p = d.data();
                list.innerHTML += `<div style="background:#f8fafc; padding:10px; border-radius:6px; margin-bottom:8px; display:flex; justify-content:space-between;"><span><b>${p.name}</b> [${p.category || 'عام'}] - ${p.price} دج</span><button onclick="deleteDoc(doc(db, 'products', '${d.id}'));loadProducts();" class="btn-danger" style="padding:4px 8px;">حذف</button></div>`;
            });
        }

        async function loadOrders() {
            let snap = await getDocs(collection(db, "orders"));
            let list = document.getElementById('orders-list-new');
            list.innerHTML = '';
            snap.forEach(d => {
                let o = d.data();
                list.innerHTML += `<div class="order-mini-card"><div><h4>👤 ${o.fullName}</h4><p>📞 ${o.phone}</p><p style="color:red; font-weight:bold;">${o.finalTotal} دج (${o.deliveryType})</p></div></div>`;
            });
        }
        window.logout = () => { sessionStorage.clear(); location.reload(); }
    </script>
</body>
</html>
