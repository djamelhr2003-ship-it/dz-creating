<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المتجر - جودة 1080p</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; margin-top: 10px; }
        .btn-danger { background: #c0392b; }
        #login-box { text-align: center; margin-top: 50px; max-width: 400px; }
        #admin-content { display: none; }
        .error { color: red; font-size: 14px; margin-top: 5px; }
        .success { color: green; font-size: 14px; margin-top: 5px; }
        .product-row, .order-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #eee; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: #eef2f7; padding: 8px 12px; border-radius: 5px; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول الفريق 🔐</h2>
        <div class="form-group" style="text-align: right;">
            <label>اسم المستخدم:</label>
            <input type="text" id="login-username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>كلمة المرور:</label>
            <input type="password" id="login-pass" placeholder="أدخل كلمة المرور">
        </div>
        <button onclick="checkLogin()">دخول للنظام</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-content">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white;">
            <h2 style="margin: 0; color: white;">لوحة التحكم - <span id="welcome-role"></span></h2>
            <button onclick="logout()" class="btn-danger" style="width: auto; padding: 8px 15px;">تسجيل الخروج</button>
        </div>

        <!-- قسم إضافة المنتجات -->
        <div class="container">
            <h2>إضافة منتج جديد (صور + فيديو بجودة 1080p) ➕</h2>
            <div class="form-group">
                <label>اسم المنتج:</label>
                <input type="text" id="prod-name" placeholder="مثال: ساعة ذكية Ultra">
            </div>
            <div class="form-group">
                <label>السعر (دج):</label>
                <input type="number" id="prod-price" placeholder="مثال: 5500">
            </div>
            <div class="form-group">
                <label>صور المنتج (اختر عدة صور):</label>
                <input type="file" id="prod-image-files" accept="image/*" multiple>
            </div>
            <div class="form-group">
                <label>فيديو تعريفي (جودة 1080p - أقل من 30 ثانية):</label>
                <input type="file" id="prod-video-file" accept="video/mp4,video/quicktime">
                <small style="color: #666;">يدعم ملفات MP4 بدقة 1080p لتوضيح تفاصيل المنتج.</small>
            </div>
            <div class="form-group">
                <label>وصف المنتج:</label>
                <textarea id="prod-desc" rows="2" placeholder="تفاصيل المنتج..."></textarea>
            </div>
            <button onclick="addProduct()">نشر المنتج في المتجر 🚀</button>
        </div>

        <!-- إدارة المنتجات والأسعار -->
        <div class="container">
            <h2>قائمة المنتجات وتعديل الأسعار 🏷️</h2>
            <div id="products-list">جاري تحميل المنتجات...</div>
        </div>

        <!-- متابعة الطلبات -->
        <div class="container">
            <h2>متابعة طلبات الزبائن 📦</h2>
            <div id="orders-list">جاري تحميل الطلبات...</div>
        </div>

        <!-- إدارة حسابات الفريق (للأدمن الرئيسي) -->
        <div class="container" id="admin-management-section" style="display: none; background: #eef9f2;">
            <h2>إدارة حسابات فريق العمل 👥</h2>
            <div class="form-group">
                <label>اسم مستخدم العضو الجديد:</label>
                <input type="text" id="new-staff-user" placeholder="مثال: staff1">
            </div>
            <div class="form-group">
                <label>كلمة المرور:</label>
                <input type="password" id="new-staff-pass" placeholder="كلمة المرور">
            </div>
            <button class="btn-secondary" onclick="addNewStaff()">إنشاء حساب للعضو ➕</button>
            <div id="staff-msg" class="success"></div>
            
            <h3 style="margin-top: 20px; text-align: right;">الحسابات الحالية:</h3>
            <div id="staff-list">جاري التحميل...</div>
        </div>
    </div>

    <!-- إعدادات Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUser = null;

        window.checkLogin = async function() {
            const username = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errorBox = document.getElementById('login-error');

            if(!username || !pass) {
                errorBox.innerText = "الرجاء إدخال اسم المستخدم وكلمة المرور!";
                return;
            }

            if(username === "admin" && pass === "dzstore2026") {
                currentUser = { username: "admin", role: "Super Admin" };
                initDashboard();
                return;
            }

            try {
                const userDocRef = doc(db, "staffUsers", username);
                const userSnap = await getDoc(userDocRef);

                if(userSnap.exists() && userSnap.data().password === pass) {
                    currentUser = { username: username, role: "فريق العمل (Staff)" };
                    initDashboard();
                } else {
                    errorBox.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                }
            } catch (e) {
                errorBox.innerText = "خطأ في الاتصال بقاعدة البيانات.";
            }
        }

        function initDashboard() {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            document.getElementById('welcome-role').innerText = `${currentUser.username} (${currentUser.role})`;

            if(currentUser.username === "admin") {
                document.getElementById('admin-management-section').style.display = 'block';
                loadStaffList();
            }

            loadProductsManagement();
            loadOrders();
        }

        window.logout = function() { location.reload(); }

        window.addProduct = async function() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const desc = document.getElementById('prod-desc').value;
            const imageFiles = document.getElementById('prod-image-files').files;
            const videoFile = document.getElementById('prod-video-file').files[0];

            if(!name || !price) {
                alert('الرجاء إدخال اسم المنتج والسعر على الأقل!');
                return;
            }

            try {
                let imageUrls = [];
                let videoUrl = '';

                if(imageFiles.length > 0) {
                    alert(`جاري رفع الصور إلى السحابة...`);
                    for (let i = 0; i < imageFiles.length; i++) {
                        const file = imageFiles[i];
                        const storageRef = ref(storage, 'products/' + Date.now() + '_img_' + i + '_' + file.name);
                        const snapshot = await uploadBytes(storageRef, file);
                        const url = await getDownloadURL(snapshot.ref);
                        imageUrls.push(url);
                    }
                }

                if(videoFile) {
                    alert('جاري رفع فيديو 1080p إلى السحابة (قد يستغرق بضع ثوانٍ)...');
                    const videoRef = ref(storage, 'products/' + Date.now() + '_vid_1080p_' + videoFile.name);
                    const vidSnapshot = await uploadBytes(videoRef, videoFile);
                    videoUrl = await getDownloadURL(vidSnapshot.ref);
                }

                await addDoc(collection(db, "products"), {
                    name, 
                    price: Number(price), 
                    desc, 
                    imageUrls, 
                    videoUrl, 
                    createdAt: new Date()
                });

                alert('تمت إضافة المنتج والفيديو بجودة عالية بنجاح! 🚀');
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-image-files').value = '';
                document.getElementById('prod-video-file').value = '';
                loadProductsManagement();
            } catch (e) {
                console.error(e);
                alert('حدث خطأ أثناء رفع الملفات.');
            }
        }

        async function loadProductsManagement() {
            const container = document.getElementById('products-list');
            container.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const prod = docItem.data();
                    const id = docItem.id;
                    const row = document.createElement('div');
                    row.className = 'product-row';
                    row.innerHTML = `
                        <span><b>${prod.name}</b></span>
                        <div style="display: flex; gap: 5px; align-items: center;">
                            <input type="number" id="price-${id}" value="${prod.price}" style="width: 90px; padding: 5px;">
                            <button onclick="updatePrice('${id}')" style="padding: 6px 10px; width: auto;">تعديل السعر</button>
                            <button onclick="deleteProduct('${id}')" class="btn-danger" style="padding: 6px 10px; width: auto;">حذف</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            } catch(e) {
                container.innerHTML = '<p style="color:red;">خطأ في تحميل المنتجات.</p>';
            }
        }

        window.updatePrice = async function(id) {
            const newPrice = document.getElementById(`price-${id}`).value;
            if(!newPrice) return;
            try {
                await updateDoc(doc(db, "products", id), { price: Number(newPrice) });
                alert('تم تحديث السعر بنجاح! 💰');
                loadProductsManagement();
            } catch(e) { alert('فشل تحديث السعر.'); }
        }

        window.deleteProduct = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    loadProductsManagement();
                } catch(e) { alert('فشل الحذف.'); }
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-list');
            container.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p>لا توجد طلبات جديدة.</p>';
                    return;
                }
                querySnapshot.forEach((docItem) => {
                    const order = docItem.data();
                    const row = document.createElement('div');
                    row.className = 'order-row';
                    row.innerHTML = `<div><strong>الزبون:</strong> ${order.fullName} | <strong>الهاتف:</strong> ${order.phone} | <strong>المنتج:</strong> ${order.productName} (${order.price} دج)</div>`;
                    container.appendChild(row);
                });
            } catch(e) { container.innerHTML = '<p>لا توجد طلبات.</p>'; }
        }

        window.addNewStaff = async function() {
            const username = document.getElementById('new-staff-user').value.trim();
            const pass = document.getElementById('new-staff-pass').value.trim();
            const msg = document.getElementById('staff-msg');
            if(!username || !pass) { alert('أدخل اسم المستخدم وكلمة المرور!'); return; }
            try {
                await setDoc(doc(db, "staffUsers", username), { password: pass });
                msg.innerText = `تمت إضافة العضو (${username}) بنجاح!`;
                document.getElementById('new-staff-user').value = '';
                document.getElementById('new-staff-pass').value = '';
                loadStaffList();
            } catch(e) { alert('خطأ في إضافة الحساب.'); }
        }

        async function loadStaffList() {
            const listDiv = document.getElementById('staff-list');
            try {
                const snap = await getDocs(collection(db, "staffUsers"));
                listDiv.innerHTML = '';
                snap.forEach(d => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<span>👤 <b>${d.id}</b></span>`;
                    listDiv.appendChild(row);
                });
            } catch(e) { listDiv.innerHTML = ''; }
        }
    </script>
</body>
</html>
