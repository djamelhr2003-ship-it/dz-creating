<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المتجر - الروابط المباشرة المجانية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { background: #27ae60; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; margin-top: 10px; }
        .btn-danger { background: #c0392b; }
        .btn-warning { background: #e67e22; color: white; }
        #login-box { text-align: center; margin-top: 50px; max-width: 400px; }
        #admin-content { display: none; }
        .error { color: red; font-size: 14px; margin-top: 5px; }
        .success { color: green; font-size: 14px; margin-top: 5px; }
        .product-row, .order-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border: 1px solid #eee; flex-wrap: wrap; gap: 10px; }
        .user-row { display: flex; justify-content: space-between; align-items: center; background: #eef2f7; padding: 10px; border-radius: 5px; margin-bottom: 8px; }
        .low-stock-alert { color: #c0392b; font-weight: bold; background: #fadbd8; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; background: #bdc3c7; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #333; }
        .tab-btn.active { background: #2c3e50; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول الفريق 🔐</h2>
        <div class="form-group" style="text-align: right;">
            <label>اسم المستخدم:</label>
            <input type="text" id="login-username" placeholder="أدخل اسم المستخدم">
        </div>
        <div class="form-group" style="text-align: right;">
            <label>كلمة المرور:</label>
            <input type="password" id="login-pass" placeholder="أدخل كلمة المرور">
        </div>
        <button onclick="checkLogin()">دخول للنظام</button>
        <div id="login-error" class="error"></div>
    </div>

    <!-- لوحة التحكم الرئيسية -->
    <div id="admin-content">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white;">
            <h2 style="margin: 0; color: white;">لوحة التحكم - <span id="welcome-role"></span></h2>
            <button onclick="logout()" class="btn-danger" style="width: auto; padding: 8px 15px;">تسجيل الخروج</button>
        </div>

        <div class="container" style="padding: 10px; background: transparent; box-shadow: none;">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('store-tab')">📦 إدارة المنتجات والمخزون والطلبات</button>
                <button class="tab-btn" onclick="switchTab('settings-tab')">⚙️ إعدادات كلمة المرور</button>
                <button class="tab-btn" id="admin-tab-btn" style="display:none;" onclick="switchTab('admin-tab')">👥 إدارة الأعضاء (للأدمن فقط)</button>
            </div>
        </div>

        <div id="store-tab" class="tab-content active">
            <div class="container">
                <h2>إضافة منتج جديد والمخزون (بالروابط) ➕</h2>
                <div class="form-group">
                    <label>اسم المنتج:</label>
                    <input type="text" id="prod-name" placeholder="مثال: ساعة ذكية Ultra">
                </div>
                <div class="form-group">
                    <label>السعر (دج):</label>
                    <input type="number" id="prod-price" placeholder="مثال: 5500">
                </div>
                <div class="form-group">
                    <label>الكمية المتوفرة في المخزون (Stock):</label>
                    <input type="number" id="prod-stock" placeholder="مثال: 10">
                </div>
                <div class="form-group">
                    <label>روابط الصور (افصل بينها بفواصل أو ضع رابطاً واحداً):</label>
                    <input type="text" id="prod-image-urls" placeholder="https://example.com/img1.jpg, https://example.com/img2.jpg">
                </div>
                <div class="form-group">
                    <label>رابط الفيديو التعريفي (اختياري - يوتيوب أو رابط مباشر):</label>
                    <input type="text" id="prod-video-url" placeholder="https://www.youtube.com/embed/...">
                </div>
                <div class="form-group">
                    <label>وصف المنتج:</label>
                    <textarea id="prod-desc" rows="2" placeholder="تفاصيل المنتج..."></textarea>
                </div>
                <button onclick="addProduct()">نشر المنتج في المتجر 🚀</button>
            </div>

            <div class="container">
                <h2>قائمة المنتجات وتعديل الأسعار والمخزون 🏷️</h2>
                <div id="products-list">جاري تحميل المنتجات...</div>
            </div>

            <div class="container">
                <h2>متابعة وتأكيد طلبات الزبائن 📦</h2>
                <div id="orders-list">جاري تحميل الطلبات...</div>
            </div>
        </div>

        <div id="settings-tab" class="tab-content">
            <div class="container">
                <h2>تغيير كلمة المرور الشخصية 🔑</h2>
                <div class="form-group">
                    <label>كلمة المرور الجديدة:</label>
                    <input type="password" id="my-new-pass" placeholder="أدخل كلمة المرور الجديدة">
                </div>
                <button class="btn-secondary" onclick="updateMyPassword()">تحديث كلمة المرور</button>
                <div id="my-pass-msg" class="success"></div>
            </div>
        </div>

        <div id="admin-tab" class="tab-content">
            <div class="container" style="background: #eef9f2;">
                <h2>إدارة حسابات فريق العمل 👥</h2>
                <div class="form-group">
                    <label>اسم مستخدم العضو الجديد:</label>
                    <input type="text" id="new-staff-user" placeholder="مثال: staff1">
                </div>
                <div class="form-group">
                    <label>كلمة المرور المبدئية:</label>
                    <input type="password" id="new-staff-pass" placeholder="كلمة المرور">
                </div>
                <button class="btn-secondary" onclick="addNewStaff()">إنشاء حساب للعضو ➕</button>
                <div id="staff-msg" class="success"></div>
                
                <h3 style="margin-top: 20px; text-align: right;">قائمة أعضاء الفريق:</h3>
                <div id="staff-list">جاري التحميل...</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = sessionStorage.getItem('ecom_logged_user');
            const savedRole = sessionStorage.getItem('ecom_logged_role');
            if(savedUser && savedRole) {
                initDashboardDirect(savedUser, savedRole);
            }
        });

        window.switchTab = function(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        window.checkLogin = async function() {
            const username = document.getElementById('login-username').value.trim();
            const pass = document.getElementById('login-pass').value.trim();
            const errorBox = document.getElementById('login-error');

            if(!username || !pass) {
                errorBox.innerText = "الرجاء إدخال اسم المستخدم وكلمة المرور!";
                return;
            }

            if(username === "admin" && pass === "dzstore2026") {
                sessionStorage.setItem('ecom_logged_user', 'admin');
                sessionStorage.setItem('ecom_logged_role', 'Super Admin');
                initDashboardDirect('admin', 'Super Admin');
                return;
            }

            try {
                const userDocRef = doc(db, "staffUsers", username);
                const userSnap = await getDoc(userDocRef);

                if(userSnap.exists() && userSnap.data().password === pass) {
                    sessionStorage.setItem('ecom_logged_user', username);
                    sessionStorage.setItem('ecom_logged_role', 'فريق العمل (Staff)');
                    initDashboardDirect(username, 'فريق العمل (Staff)');
                } else {
                    errorBox.innerText = "اسم المستخدم أو كلمة المرور غير صحيحة!";
                }
            } catch (e) {
                errorBox.innerText = "خطأ في الاتصال بقاعدة البيانات.";
            }
        }

        function initDashboardDirect(username, role) {
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-content').style.display = 'block';
            document.getElementById('welcome-role').innerText = `${username} (${role})`;

            if(username === "admin") {
                document.getElementById('admin-tab-btn').style.display = 'block';
                loadStaffList();
            }

            loadProductsManagement();
            loadOrders();
        }

        window.logout = function() {
            sessionStorage.clear();
            location.reload();
        }

        window.updateMyPassword = async function() {
            const currentUser = sessionStorage.getItem('ecom_logged_user');
            const newPass = document.getElementById('my-new-pass').value.trim();
            const msgBox = document.getElementById('my-pass-msg');
            msgBox.innerText = "";

            if(!newPass || newPass.length < 4) {
                alert('الرجاء إدخال كلمة مرور تتكون من 4 خانات على الأقل!');
                return;
            }

            try {
                if(currentUser === "admin") {
                    alert('كلمة مرور الأدمن الرئيسي يتم التحكم بها عبر إعدادات النظام.');
                } else {
                    await updateDoc(doc(db, "staffUsers", currentUser), { password: newPass });
                    msgBox.innerText = "تم تحديث كلمة المرور الخاصة بك بنجاح! 🔑";
                    document.getElementById('my-new-pass').value = '';
                }
            } catch(e) {
                alert('حدث خطأ أثناء التحديث.');
            }
        }

        window.addProduct = async function() {
            const name = document.getElementById('prod-name').value.trim();
            const price = document.getElementById('prod-price').value.trim();
            const stock = document.getElementById('prod-stock').value.trim();
            const desc = document.getElementById('prod-desc').value.trim();
            const urlsInput = document.getElementById('prod-image-urls').value.trim();
            const videoUrl = document.getElementById('prod-video-url').value.trim();

            if(!name || !price || !stock) {
                alert('الرجاء إدخال اسم المنتج، السعر، وكمية المخزون!');
                return;
            }

            // تحويل الروابط المدخلة إلى مصفوفة (منفصلة بفواصل)
            let imageUrls = urlsInput ? urlsInput.split(',').map(u => u.trim()).filter(u => u.length > 0) : [];

            try {
                await addDoc(collection(db, "products"), {
                    name, 
                    price: Number(price), 
                    stock: Number(stock), 
                    desc, 
                    imageUrls, 
                    videoUrl, 
                    createdAt: new Date()
                });

                alert('تمت إضافة المنتج والمخزون بنجاح إلى المتجر! 🚀');
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                document.getElementById('prod-stock').value = '';
                document.getElementById('prod-desc').value = '';
                document.getElementById('prod-image-urls').value = '';
                document.getElementById('prod-video-url').value = '';
                loadProductsManagement();
            } catch (e) {
                alert('خطأ أثناء نشر المنتج في قاعدة البيانات.');
            }
        }

        async function loadProductsManagement() {
            const container = document.getElementById('products-list');
            container.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p>لا توجد منتجات حالياً.</p>';
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const prod = docItem.data();
                    const id = docItem.id;
                    const stockVal = prod.stock !== undefined ? prod.stock : 0;
                    
                    let stockAlertHtml = '';
                    if(stockVal <= 5) {
                        stockAlertHtml = `<span class="low-stock-alert">⚠️ تنبيه: باقي ${stockVal} حبات فقط!</span>`;
                    }

                    const row = document.createElement('div');
                    row.className = 'product-row';
                    row.innerHTML = `
                        <div>
                            <b>${prod.name}</b> ${stockAlertHtml}<br>
                            <small>المخزون الحالي الدقيق: <b>${stockVal}</b></small>
                        </div>
                        <div style="display: flex; gap: 5px; align-items: center; flex-wrap: wrap;">
                            السعر: <input type="number" id="price-${id}" value="${prod.price}" style="width: 80px; padding: 5px;">
                            <button onclick="updatePrice('${id}')" style="padding: 6px 10px; width: auto;">تعديل السعر</button>
                            الكمية: <input type="number" id="stock-${id}" value="${stockVal}" style="width: 70px; padding: 5px;">
                            <button onclick="updateStock('${id}')" class="btn-warning" style="padding: 6px 10px; width: auto;">تحديث المخزون</button>
                            <button onclick="deleteProduct('${id}')" class="btn-danger" style="padding: 6px 10px; width: auto;">حذف</button>
                        </div>
                    `;
                    container.appendChild(row);
                });
            } catch(e) {
                container.innerHTML = '<p style="color:red;">خطأ في تحميل المنتجات.</p>';
            }
        }

        window.updatePrice = async function(id) {
            const newPrice = document.getElementById(`price-${id}`).value;
            if(!newPrice) return;
            try {
                await updateDoc(doc(db, "products", id), { price: Number(newPrice) });
                alert('تم تحديث السعر بنجاح! 💰');
                loadProductsManagement();
            } catch(e) { alert('فشل تحديث السعر.'); }
        }

        window.updateStock = async function(id) {
            const newStock = document.getElementById(`stock-${id}`).value;
            if(newStock === '') return;
            try {
                await updateDoc(doc(db, "products", id), { stock: Number(newStock) });
                alert('تم تحديث المخزون بنجاح! 📦');
                loadProductsManagement();
            } catch(e) { alert('فشل تحديث المخزون.'); }
        }

        window.deleteProduct = async function(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                try {
                    await deleteDoc(doc(db, "products", id));
                    loadProductsManagement();
                } catch(e) { alert('فشل الحذف.'); }
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-list');
            container.innerHTML = 'جاري التحميل...';
            try {
                const querySnapshot = await getDocs(collection(db, "orders"));
                container.innerHTML = '';
                if(querySnapshot.empty) {
                    container.innerHTML = '<p>لا توجد طلبات جديدة.</p>';
                    return;
                }
                querySnapshot.forEach((docItem) => {
                    const order = docItem.data();
                    const orderId = docItem.id;
                    const status = order.status || 'قيد الانتظار ⏳';
                    const statusColor = status.includes('مؤكد') ? 'green' : '#e67e22';
                    const quantity = order.quantity || 1;

                    let actionButtonHtml = `<button onclick="confirmOrder('${orderId}', '${order.productName}', ${quantity})" style="background: #27ae60; padding: 8px 12px; width: auto; font-size: 14px;">تأكيد الطلب ✅</button>`;
                    if(status.includes('مؤكد')) {
                        actionButtonHtml = `<span style="color: green; font-weight: bold;">تم التأكيد والخصم</span>`;
                    }

                    const row = document.createElement('div');
                    row.className = 'order-row';
                    row.innerHTML = `
                        <div>
                            <strong>الزبون:</strong> ${order.fullName} | <strong>الهاتف:</strong> ${order.phone} | <strong>الولاية:</strong> ${order.wilaya}<br>
                            <strong>المنتج:</strong> ${order.productName} | <strong>الكمية المطلوبة:</strong> <span style="color: #e74c3c; font-weight: bold;">${quantity} حبات</span><br>
                            الحالة: <span style="color: ${statusColor}; font-weight: bold;">${status}</span>
                        </div>
                        <div>
                            ${actionButtonHtml}
                        </div>
                    `;
                    container.appendChild(row);
                });
            } catch(e) { container.innerHTML = '<p>لا توجد طلبات.</p>'; }
        }

        window.confirmOrder = async function(orderId, productName, quantity) {
            try {
                const productsRef = collection(db, "products");
                const q = query(productsRef, where("name", "==", productName));
                const querySnapshot = await getDocs(q);

                if(!querySnapshot.empty) {
                    const productDoc = querySnapshot.docs[0];
                    const productData = productDoc.data();
                    const currentStock = productData.stock !== undefined ? productData.stock : 10;

                    if(currentStock < quantity) {
                        alert(`عذراً، الكمية في المخزون (${currentStock}) أقل من الكمية المطلوبة (${quantity})! لا يمكن تأكيد الطلب.`);
                        return;
                    }

                    const newStock = currentStock - quantity;
                    await updateDoc(doc(db, "products", productDoc.id), { stock: newStock });
                }

                await updateDoc(doc(db, "orders", orderId), { status: 'مؤكد من الفريق ✅' });
                
                alert(`تم تأكيد الطلب بنجاح وخصم (${quantity}) حبات من المخزون تلقائياً! 📉📦`);
                loadOrders();
                loadProductsManagement();
            } catch(e) {
                console.error(e);
                alert('حدث خطأ أثناء تأكيد الطلب وخصم المخزون.');
            }
        }

        window.addNewStaff = async function() {
            const username = document.getElementById('new-staff-user').value.trim();
            const pass = document.getElementById('new-staff-pass').value.trim();
            const msg = document.getElementById('staff-msg');
            if(!username || !pass) { alert('أدخل اسم المستخدم وكلمة المرور!'); return; }
            try {
                await setDoc(doc(db, "staffUsers", username), { password: pass });
                msg.innerText = `تمت إضافة الحساب (${username}) بنجاح!`;
                document.getElementById('new-staff-user').value = '';
                document.getElementById('new-staff-pass').value = '';
                loadStaffList();
            } catch(e) { alert('خطأ في إضافة الحساب.'); }
        }

        async function loadStaffList() {
            const listDiv = document.getElementById('staff-list');
            try {
                const snap = await getDocs(collection(db, "staffUsers"));
                listDiv.innerHTML = '';
                if(snap.empty) {
                    listDiv.innerHTML = '<p>لا توجد أعضاء إضافيون حالياً.</p>';
                    return;
                }
                snap.forEach(d => {
                    const row = document.createElement('div');
                    row.className = 'user-row';
                    row.innerHTML = `<span>👤 اسم العضو: <b>${d.id}</b></span> <button onclick="deleteStaff('${d.id}')" class="btn-danger" style="width: auto; padding: 4px 10px; font-size: 14px;">حذف الحساب</button>`;
                    listDiv.appendChild(row);
                });
            } catch(e) { listDiv.innerHTML = ''; }
        }

        window.deleteStaff = async function(username) {
            if(confirm(`هل تريد حقاً حذف حساب العضو (${username})؟`)) {
                try {
                    await deleteDoc(doc(db, "staffUsers", username));
                    alert('تم حذف الحساب بنجاح.');
                    loadStaffList();
                } catch(e) { alert('فشل الحذف.'); }
            }
        }
    </script>
</body>
</html>
