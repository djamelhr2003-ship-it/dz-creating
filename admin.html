<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لوحة التحكم الشاملة - متجري العالمي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        h2, h3 { color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; outline: none; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: bold; }
        button:hover { background: #219653; }
        .btn-secondary { background: #2980b9; }
        .btn-danger { background: #c0392b; }
        .btn-warning { background: #e67e22; color: white; }
        .btn-store { background: #232f3e; color: white; text-decoration: none; display: block; text-align: center; padding: 12px; border-radius: 6px; font-weight: bold; }
        
        #login-box { text-align: center; max-width: 400px; margin: 50px auto; }
        .password-container { position: relative; width: 100%; }
        .password-container input { padding-left: 45px; }
        .toggle-password { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 18px; }
        
        #admin-content { display: none; }
        
        .tabs-nav { display: flex; gap: 3px; margin-bottom: 20px; flex-wrap: wrap; background: #e2e8f0; padding: 6px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px 4px; background: transparent; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; color: #475569; min-width: 70px; transition: all 0.2s; font-size: 11px; text-align: center; }
        .tab-btn.active { background: #2c3e50; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .orders-grid-compact { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
        .order-mini-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 12px; cursor: pointer; transition: all 0.2s; display: flex; gap: 12px; align-items: center; }
        .order-mini-card:hover { transform: translateY(-2px); border-color: #2563eb; background: #f1f5f9; }
        .order-mini-card.fake-warning { border-color: #ef4444; background: #fef2f2; }
        .order-mini-thumb { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; background: #eee; flex-shrink: 0; }
        
        .wilaya-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        .wilaya-table th, .wilaya-table td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        .wilaya-table th { background: #1e293b; color: white; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-card { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 550px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: linear-gradient(135deg, #2c3e50, #1e293b); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-card h4 { margin: 0 0 8px 0; font-size: 14px; color: #94a3b8; }
        .stat-card span { font-size: 24px; font-weight: bold; color: #38bdf8; }

        .staff-status-card { background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-left: 6px; }
        .online { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .offline { background: #ef4444; }
    </style>
</head>
<body>

    <div class="modal-overlay" id="centerModal" style="z-index: 4000;">
        <div class="modal-card" style="text-align: center; max-width: 400px;">
            <h3 id="modalTitle" style="color: #2563eb; margin-top:0;">⚠️ تنبيه النظام</h3>
            <p id="modalMessage" style="color: #475569; font-size: 15px; line-height: 1.6;"></p>
            <button onclick="closeCenterModal()" style="margin-top: 15px; background: #ef4444; width: 100%;">فهمت 🚨</button>
        </div>
    </div>

    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <h3 style="margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">📋 تفاصيل الطلب ومعلومات التوصيل الكاملة</h3>
            <div id="orderDetailsContent" style="font-size: 14px; line-height: 1.8; color: #1e293b; margin-bottom: 20px;"></div>
            <div id="orderModalActions" style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end;"></div>
            <button onclick="closeOrderModal()" class="btn-secondary" style="margin-top: 15px; width: 100%; background: #64748b;">إغلاق النافذة ❌</button>
        </div>
    </div>

    <div class="modal-overlay" id="staffPortalModal">
        <div class="modal-card" style="max-width: 650px;">
            <h3 style="margin-top: 0; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; color:#7c3aed;">🚪 بوابة نشاط الموظف</h3>
            <div id="staffPortalContent" style="font-size: 14px; line-height: 1.8; color: #1e293b;">جاري التحميل...</div>
            <button onclick="document.getElementById('staffPortalModal').style.display='none'" class="btn-secondary" style="margin-top: 20px; width: 100%; background: #64748b;">إغلاق البوابة ❌</button>
        </div>
    </div>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box" class="container">
        <h2>تسجيل دخول لوحة التحكم 🔐</h2>
        <div class="form-group" style="text-align: right;"><label>اسم المستخدم:</label><input type="text" id="login-username" placeholder="djamel hr"></div>
        <div class="form-group" style="text-align: right;">
            <label>كلمة المرور:</label>
            <div class="password-container">
                <input type="password" id="login-pass" placeholder="Djamel2003">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>
        <button onclick="checkLogin()" style="background:#ffd814; border:1px solid #fcd200; color:#0f1111; width:100%; padding:12px; font-weight:bold;">دخول للنظام 🚀</button>
        <a href="index.html" class="btn-store" style="background:#232f3e; margin-top:10px;">🛍️ العودة إلى المتجر الرئيسي</a>
