<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - متجري العالمي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #131921; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #ffd814; border: 1px solid #fcd200; color: #0f1111; width: 100%; padding: 12px; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; }
        button:hover { background: #f7ca00; }
        .btn-store { background: #232f3e; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 6px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container" id="login-box">
        <h2>تسجيل دخول لوحة التحكم 🔐</h2>
        <div class="form-group"><label>اسم المستخدم:</label><input type="text" id="login-username" placeholder="admin"></div>
        <div class="form-group"><label>كلمة المرور:</label><input type="password" id="login-pass" placeholder="dzstore2026"></div>
        <button onclick="checkAdminLogin()">دخول للنظام 🚀</button>
        <a href="index.html" class="btn-store">🛍️ العودة إلى المتجر الرئيسي</a>
        <div id="login-error" style="color:red; margin-top:10px; text-align:center;"></div>
    </div>

    <script>
        window.checkAdminLogin = function() {
            let adminUser = localStorage.getItem('dz_admin_user') || 'admin';
            let adminPass = localStorage.getItem('dz_admin_pass') || 'dzstore2026';

            let u = document.getElementById('login-username').value.trim();
            let p = document.getElementById('login-pass').value.trim();

            if (u === adminUser && p === adminPass) {
                localStorage.setItem('ecom_logged_user', 'admin');
                alert('تم تسجيل الدخول بنجاح! (ملاحظة: يمكنك توجيه هذا الزر لفتح تبويبات التحكم الخاصة بك مباشرة)');
                // يمكنك توجيه الصفحة أو فتح واجهة التحكم الخاصة بك هنا
            } else {
                document.getElementById('login-error').innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة!';
            }
        }
    </script>
</body>
</html>
