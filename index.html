<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المتجر الجزائري | تسوق أونلاين</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#090d0b;--card:rgba(255,255,255,.045);--tx:#f5f2ea;--mu:#9ba79f;--accent:#d9b65c;--border:rgba(255,255,255,.1)}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;margin:0;padding:0}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(9,13,11,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;backdrop-filter:blur(10px)}
header h1{margin:0;color:var(--accent);font-size:1.4rem}
.hero{text-align:center;padding:40px 20px;background:radial-gradient(circle at center,rgba(217,182,92,.08),transparent 70%)}
.hero h2{font-size:2.2rem;margin:0 0 10px;color:var(--accent)}
.container{max-width:1200px;margin:auto;padding:20px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;backdrop-filter:blur(10px);transition:.3s}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card h3{margin:15px 0 8px;font-size:1.2rem}
.desc{color:var(--mu);font-size:.85rem;margin-bottom:15px;min-height:40px}
.price{color:var(--accent);font-weight:800;font-size:1.3rem;margin-bottom:15px}
.btn{background:linear-gradient(90deg,#d9b65c,#f2d98c);color:#111;border:0;padding:12px;font-weight:800;border-radius:10px;cursor:pointer;width:100%;font-family:inherit;transition:.2s}
.btn:hover{opacity:.9}
.admin-link{color:var(--mu);text-decoration:none;font-size:.85rem;border:1px solid var(--border);padding:6px 12px;border-radius:8px;transition:.2s}
.admin-link:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<header>
  <h1>متجري الرقمي 🇩🇿</h1>
  <a href="admin.html" class="admin-link">🔐 لوحة التحكم</a>
</header>

<div class="hero">
  <h2>أفضل المنتجات بأسعار تنافسية</h2>
  <p>اطلب الآن والدفع عند الاستلام لجميع ولايات الوطن 🚚</p>
</div>

<div class="container">
  <div class="grid" id="storeGrid">
    <!-- المنتجات تُعرض هنا ديناميكياً -->
  </div>
</div>

<script>
// محرك قاعدة البيانات المحلية للمتجر
const DB = {
  getProducts: function() {
    let saved = localStorage.getItem("store_products");
    if(saved) {
      return JSON.parse(saved);
    } else {
      let defaults = [
        {id: 1, name: "ساعة ذكية Ultra", price: 4500, desc: "شاشة عالية الدقة، تدعم المكالمات والرياضة."},
        {id: 2, name: "سماعات بلوتوث لاسلكية", price: 2800, desc: "صوت نقي ستيريو مع بطارية تدوم طويلاً."},
        {id: 3, name: "حامل هاتف للسيارة ذكي", price: 1600, desc: "ثبات قوي وقابل للتعديل بسهولة."}
      ];
      localStorage.setItem("store_products", JSON.stringify(defaults));
      return defaults;
    }
  },
  saveOrder: function(order) {
    let orders = JSON.parse(localStorage.getItem("store_orders")) || [];
    order.id = Date.now();
    order.date = new Date().toLocaleString('ar-DZ');
    order.status = "جديد";
    orders.push(order);
    localStorage.setItem("store_orders", JSON.stringify(orders));
  }
};

function renderStore() {
  let products = DB.getProducts();
  let html = "";
  products.forEach(function(p) {
    html += `
      <div class="card">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="price">${p.price.toLocaleString()} دج</div>
        <button class="btn" onclick="makeOrder('${p.name}', ${p.price})">اطلب الآن 🛒</button>
      </div>
    `;
  });
  document.getElementById("storeGrid").innerHTML = html;
}

function makeOrder(name, price) {
  let clientName = prompt(`أدخل اسمك الكامل لطلب "${name}" (${price} دج):`);
  if(!clientName) return;
  let phone = prompt("أدخل رقم هاتفك النقال:");
  if(!phone) return;
  let wilaya = prompt("أدخل ولايتك (مثلاً: 05 باتنة):");
  if(!wilaya) return;

  DB.saveOrder({product: name, price: price, client: clientName, phone: phone, wilaya: wilaya});
  alert(`مرحباً بك يا ${clientName}! تم تسجيل طلبك بنجاح وسنتصل بك قريباً للتأكيد.`);
}

renderStore();
</script>

</body>
</html>
