<!-- تصميم المستطيلات الذهبية المصفرة للعروض في صفحة المتجر -->
<style>
    .gold-offer-box {
        background: linear-gradient(135deg, #fef9c3, #fef08a);
        border: 2px solid #eab308;
        border-radius: 10px;
        padding: 12px 15px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        cursor: pointer;
        transition: 0.2s;
    }
    .gold-offer-box:hover {
        box-shadow: 0 4px 12px rgba(234, 179, 8, 0.3);
    }
    .crossed-old-price {
        position: relative;
        color: #64748b;
        font-weight: bold;
        font-size: 14px;
        margin-left: 10px;
    }
    .crossed-old-price::after {
        content: "";
        position: absolute;
        top: 50%;
        left: 0;
        width: 100%;
        height: 2px;
        background-color: #ef4444; /* خط أحمر كبير */
        transform: translateY(-50%);
    }
    .new-offer-price {
        color: #16a34a;
        font-weight: bold;
        font-size: 16px;
    }
</style>

<!-- شفرة الجافاسكريبت داخل المتجر لتطبيق العروض وتحديث السعر التلقائي -->
<script>
    // دالة عرض عروض المنتج عند فتحه للطلب
    function renderProductOffers(product) {
        let container = document.getElementById('product-offers-container');
        if(!container) return;
        
        if(!product.enableOffers || !product.offers || product.offers.length === 0) {
            container.innerHTML = '';
            return;
        }

        let html = '<h4 style="margin-bottom:8px; color:#b45309;">🔥 العروض الذهبية المتاحة (اختر عرضاً):</h4>';
        
        // خيار السعر الأساسي العادي
        html += `
            <label class="gold-offer-box">
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="radio" name="selectedOffer" value="base" checked onchange="updateTotalPrice(${product.price}, 0)">
                    <span><b>السعر العادي الأساسي</b></span>
                </div>
                <span class="new-offer-price">${product.price} دج</span>
            </label>
        `;

        // حلقة التكرار لإضافة المستطيلات الذهبية المصفرة لكل عرض
        product.offers.forEach((offer, index) => {
            html += `
                <label class="gold-offer-box">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <input type="radio" name="selectedOffer" value="${index}" onchange="updateTotalPrice(${offer.newPrice}, ${index})">
                        <span><b>${offer.title}</b> ✅</span>
                    </div>
                    <div>
                        <span class="crossed-old-price">${offer.oldPrice} دج</span>
                        <span class="new-offer-price">${offer.newPrice} دج ✅</span>
                    </div>
                </label>
            `;
        });

        container.innerHTML = html;
    }

    // دالة تحديث السعر الإجمالي في خانة الدفع عند اختيار الزبون العرض
    function updateTotalPrice(pricePerUnit, offerIndex) {
        let quantityInput = document.getElementById('order-quantity');
        let qty = quantityInput ? Number(quantityInput.value) || 1 : 1;
        let finalTotal = pricePerUnit * qty;
        
        // تحديث العنصر في واجهة الزبون
        document.getElementById('display-product-price').innerText = pricePerUnit + ' دج';
        document.getElementById('display-final-total').innerText = finalTotal + ' دج';
        window.currentSelectedOfferPrice = pricePerUnit; // حفظ السعر للاستخدام عند إرسال الطلب
    }
</script>
