<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="store-title-tag">متجري العالمي</title>
    <style>
        :root { --primary: #131921; --secondary: #232f3e; --accent: #febd69; --success: #007600; --danger: #b12704; --bg: #eaeded; --card-bg: #ffffff; --border: #d5d9d9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #0f1111; }
        header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; gap: 10px; flex-wrap: wrap; }
        .logo { font-size: 22px; font-weight: bold; cursor: pointer; color: white; }
        .logo span { color: var(--accent); }
        .header-search-bar { flex: 2; display: flex; max-width: 650px; background: white; border-radius: 8px; overflow: hidden; }
        .header-search-bar input { flex: 1; padding: 10px 15px; border: none; outline: none; }
        .header-search-btn { background: var(--accent); border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
        .header-actions { display: flex; gap: 15px; align-items: center; }
        .admin-btn { background: #f59e0b; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; }
        
        .container { max-width: 1250px; margin: auto; padding: 25px 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .product-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; cursor: pointer; transition: 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .product-img-wrap { width: 100%; height: 200px; background: #fff; display: flex; align-items: center; justify-content: center; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 15px; font-weight: 600; margin: 0 0 6px 0; }
        .new-price { color: var(--danger); font-weight: bold; font-size: 18px; }

        #product-detail-view { display: none; background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .detail-grid { display: grid; grid-template-columns: 1fr 1.2fr 350px; gap: 30px; align-items: start; }
        @media(max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
        .detail-img-container { text-align: center; background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
        .detail-main-img { max-width: 100%; height: 350px; object-fit: contain; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 15px; box-sizing: border-box; backdrop-filter: blur(3px); }
        .modal-card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="backToHome()">🛍️ <span id="header-store-name">متجري</span> <span>العالمي</span></div>
        <div class="header-search-bar">
            <input type="text" id="global-search-input" placeholder="ابحث عن منتج..." onkeyup="triggerSearch()">
            <button class="header-search-btn" onclick="triggerSearch()">🔍</button>
        </div>
        <div class="header-actions">
            <a href="admin.html" class="admin-btn">🔐 لوحة التحكم</a>
        </div>
    </header>

    <div class="container">
        <div id="home-view">
            <h2 style="margin-top:0;">🔥 المنتجات والعروض المميزة</h2>
            <div id="store-products-grid" class="products-grid">جاري التحميل...</div>
        </div>

        <!-- صفحة تفاصيل المنتج مع تقييمات الزبائن الصغيرة -->
        <div id="product-detail-view">
            <button onclick="backToHome()" style="background:#232f3e; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer; margin-bottom:20px;">← العودة للقائمة</button>
            <div id="detail-content-area"></div>
        </div>
    </div>

    <!-- نافذة إتمام الطلب الشاملة (58 ولاية) -->
    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card" id="checkout-modal-body">
            <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:10px;">📋 إتمام الطلب ومعلومات التوصيل (58 ولاية)</h3>
            <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname" placeholder="الاسم واللقب..."></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="order-phone" placeholder="07xxxxxxxx"></div>
            <div class="form-group">
                <label>الولاية:</label>
                <select id="order-wilaya" onchange="updateTotal()">
                    <option value="05|باتنة" selected>05 - باتنة</option><option value="16|الجزائر">16 - الجزائر العاصمة</option>
                    <option value="31|وهران">31 - وهران</option><option value="25|قسنطينة">25 - قسنطينة</option><option value="02|الشلف">02 - الشلف</option>
                </select>
            </div>
            <div class="form-group"><label>العنوان التفصيلي / البلدية:</label><input type="text" id="order-commune" placeholder="البلدية أو الحي..."></div>
            <div class="form-group">
                <label>نوع التوصيل:</label>
                <select id="order-delivery-type" onchange="updateTotal()">
                    <option value="home">توصيل للمنزل 🏠</option>
                    <option value="desk">توصيل للمكتب (Stop-Desk) 🏢</option>
                </select>
            </div>
            <div style="background:#f1f5f9; padding:12px; border-radius:8px; margin-bottom:15px; font-size:14px; line-height:1.6;">
                📦 المنتج: <b id="summary-product-name">-</b><br>
                💵 السعر: <b id="summary-product-price">0 دج</b><br>
                🚚 التوصيل: <b id="summary-shipping-price">0 دج</b><br>
                <hr style="border:0; border-top:1px solid #cbd5e1; margin:6px 0;">
                💰 <b>المجموع الكلي:</b> <span id="checkout-final-total" style="color:var(--danger); font-weight:bold; font-size:18px;">0</span> دج
            </div>
            <button onclick="submitOrder()" style="background:#ffd814; border:1px solid #fcd200; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">تأكيد وإرسال الطلب 🚀</button>
            <button onclick="document.getElementById('checkoutModal').style.display='none'" style="background:#64748b; color:white; border:none; width:100%; padding:10px; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:8px;">إلغاء</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], selectedProductForDetail = null;

        window.addEventListener('DOMContentLoaded', () => {
            let savedName = localStorage.getItem('dz_store_name');
            if(savedName) document.getElementById('header-store-name').innerText = savedName;
            loadProducts();
        });

        async function loadProducts() {
            const snap = await getDocs(collection(db, "products"));
            allProducts = [];
            snap.forEach(d => allProducts.push({ id: d.id, ...d.data() }));
            renderGrid(allProducts);
        }

        function renderGrid(products) {
            let grid = document.getElementById('store-products-grid');
            grid.innerHTML = '';
            if(products.length === 0) { grid.innerHTML = '<p>لا توجد منتجات.</p>'; return; }
            products.forEach(p => {
                let img = p.imageUrls?.[0] || 'https://via.placeholder.com/200';
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <div class="product-img-wrap"><img src="${img}" class="product-img"></div>
                        <div class="product-body">
                            <h3 class="product-title">${p.name}</h3>
                            <div class="new-price">${p.price} دج</div>
                            <button onclick="event.stopPropagation(); openCheckoutForProduct('${p.id}')" style="background:#ffd814; border:none; padding:8px; border-radius:6px; font-weight:bold; margin-top:10px; cursor:pointer;">شراء سريع ⚡</button>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductDetail = async function(id) {
            let docSnap = await getDoc(doc(db, "products", id));
            if(!docSnap.exists()) return;
            selectedProductForDetail = { id: docSnap.id, ...docSnap.data() };
            let p = selectedProductForDetail;

            let variantsHtml = '';
            if(p.variants) {
                if(p.variants.colors?.length > 0) variantsHtml += `<div class="form-group"><label>اختر اللون:</label><select id="selected-color">${p.variants.colors.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>`;
                if(p.variants.sizes?.length > 0) variantsHtml += `<div class="form-group"><label>اختر المقاس:</label><select id="selected-size">${p.variants.sizes.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>`;
            }

            document.getElementById('detail-content-area').innerHTML = `
                <div class="detail-grid">
                    <div class="detail-img-container"><img src="${p.imageUrls?.[0]||''}" class="detail-main-img"></div>
                    <div>
                        <h1>${p.name}</h1>
                        <div style="font-size:24px; color:var(--danger); font-weight:bold; margin:15px 0;">${p.price} دج</div>
                        ${variantsHtml}
                        <p style="line-height:1.8; color:#333;">${p.description || 'لا يوجد وصف.'}</p>
                        
                        <div style="margin-top:25px; border-top:1px solid var(--border); padding-top:15px;">
                            <h3 style="font-size:16px; margin-bottom:10px;">💬 تقييمات وتعليقات الزبائن</h3>
                            <div id="product-reviews-container" style="font-size:13px; color:#444; margin-bottom:15px;">لا توجد تعليقات بعد. كن أول من يقيّم!</div>
                            
                            <div style="background:#f8f9fa; padding:12px; border-radius:8px; border:1px solid var(--border);">
                                <h4 style="margin:0 0 8px 0; font-size:13px;">أضف تقييمك وتعليقك:</h4>
                                <div class="form-group" style="margin-bottom:8px;">
                                    <select id="review-stars" style="padding:6px; font-size:12px;">
                                        <option value="5">⭐⭐⭐⭐⭐ (ممتاز)</option><option value="4">⭐⭐⭐⭐ (جيد جداً)</option><option value="3">⭐⭐⭐ (متوسط)</option><option value="2">⭐⭐ (ضعيف)</option><option value="1">⭐ (سيء)</option>
                                    </select>
                                </div>
                                <div class="form-group" style="margin-bottom:8px;"><input type="text" id="review-author" placeholder="اسمك الكريم..." style="padding:6px; font-size:12px;"></div>
                                <div class="form-group" style="margin-bottom:8px;"><textarea id="review-text" placeholder="اكتب تعليقاً صغيراً..." style="padding:6px; font-size:12px; height:50px;"></textarea></div>
                                <button onclick="submitProductReview()" style="background:#ffd814; border:none; padding:6px 12px; border-radius:4px; font-weight:bold; cursor:pointer; font-size:12px;">إرسال التعليق 🚀</button>
                            </div>
                        </div>
                    </div>
                    <div>
                        <div style="background:#f8f9fa; border:1px solid var(--border); padding:20px; border-radius:12px;">
                            <div style="font-size:22px; color:var(--danger); font-weight:bold; margin-bottom:15px;">${p.price} دج</div>
                            <button onclick="openCheckoutForProduct('${p.id}')" style="background:#ffa41c; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">شراء الآن ⚡</button>
                        </div>
                    </div>
                </div>
            `;
            renderProductReviews(p.reviews);
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('product-detail-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.submitProductReview = async function() {
            if(!selectedProductForDetail) return;
            let name = document.getElementById('review-author').value.trim() || 'زبون زائر';
            let comment = document.getElementById('review-text').value.trim();
            let stars = document.getElementById('review-stars').value;
            if(!comment) { alert('أدخل نص التعليق!'); return; }

            let reviewObj = { name, comment, stars, date: new Date().toLocaleDateString('ar-DZ') };
            try {
                await updateDoc(doc(db, "products", selectedProductForDetail.id), { reviews: arrayUnion(reviewObj) });
                alert('شكراً لك! تم إضافة تعليقك بنجاح.');
                document.getElementById('review-text').value = '';
                document.getElementById('review-author').value = '';
                selectedProductForDetail.reviews = selectedProductForDetail.reviews || [];
                selectedProductForDetail.reviews.push(reviewObj);
                renderProductReviews(selectedProductForDetail.reviews);
            } catch(e) { alert('فشل إرسال التعليق.'); }
        }

        function renderProductReviews(reviews) {
            let container = document.getElementById('product-reviews-container');
            if(!reviews || reviews.length === 0) { container.innerHTML = 'لا توجد تعليقات بعد.'; return; }
            container.innerHTML = reviews.map(r => `
                <div style="background:#fff; padding:8px; border-radius:6px; border:1px solid #e2e8f0; margin-bottom:6px; font-size:12px;">
                    <div style="display:flex; justify-content:space-between; color:#64748b; margin-bottom:2px;">
                        <span><b>${r.name}</b> (${'⭐'.repeat(r.stars)})</span><span>${r.date || ''}</span>
                    </div>
                    <div style="color:#0f1111;">${r.comment}</div>
                </div>
            `).join('');
        }

        window.openCheckoutForProduct = function(id) {
            selectedProductForDetail = allProducts.find(p => p.id === id);
            if(!selectedProductForDetail) return;
            document.getElementById('summary-product-name').innerText = selectedProductForDetail.name;
            document.getElementById('summary-product-price').innerText = selectedProductForDetail.price + ' دج';
            updateTotal();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        window.updateTotal = function() {
            if(!selectedProductForDetail) return;
            let deliveryType = document.getElementById('order-delivery-type').value;
            let shippingFee = deliveryType === 'home' ? 750 : 450;
            let total = selectedProductForDetail.price + shippingFee;
            document.getElementById('summary-shipping-price').innerText = shippingFee + ' دج';
            document.getElementById('checkout-final-total').innerText = total;
        }

        window.submitOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilayaFull = document.getElementById('order-wilaya').value.split('|')[1];
            let commune = document.getElementById('order-commune').value.trim();
            let deliveryTypeVal = document.getElementById('order-delivery-type').value;
            let finalTotal = Number(document.getElementById('checkout-final-total').innerText);

            if(!fullName || !phone || !commune) { alert('أدخل كامل معلومات التوصيل!'); return; }

            let orderData = {
                fullName, phone, wilaya: wilayaFull, commune,
                deliveryType: deliveryTypeVal === 'home' ? 'توصيل للمنزل 🏠' : 'توصيل للمكتب 🏢',
                finalTotal, productName: selectedProductForDetail.name, quantity: 1,
                status: 'جديد ⏳', createdAt: new Date()
            };

            await addDoc(collection(db, "orders"), orderData);
            document.getElementById('checkout-modal-body').innerHTML = `
                <div style="text-align: center; padding: 15px 0;">
                    <div style="font-size: 50px; margin-bottom: 10px;">🎉</div>
                    <h2 style="color: var(--success); margin-bottom: 10px;">تم إرسال طلبك بنجاح!</h2>
                    <p style="color: #555; font-size: 14px; margin-bottom: 20px;">شكراً لتسوقك معنا، <b>${fullName}</b>. سنتصل بك قريباً.</p>
                    <button onclick="location.reload()" style="background: #ffd814; border:none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 10px;">تسوق من جديد 🛍️</button>
                    <button onclick="document.getElementById('checkoutModal').style.display='none'" style="background: #64748b; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer;">إغلاق النافذة ❌</button>
                </div>
            `;
        }

        window.backToHome = function() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }
        window.triggerSearch = function() {
            let q = document.getElementById('global-search-input').value.toLowerCase();
            renderGrid(allProducts.filter(p => p.name.toLowerCase().includes(q)));
        }
    </script>
</body>
</html>
