<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الجزائري - السحابي</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 10px; color: #333; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-card img { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; background: #eee; }
        .price { color: #e74c3c; font-weight: bold; font-size: 18px; margin: 10px 0; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; }
        button:hover { background: #219653; }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ متجر الجزائر السحابي</h1>
        <p>توصيل متوفر لجميع ولايات الوطن 🇩🇿 والدفع عند الاستلام</p>
    </header>

    <div class="products-grid" id="products-container">
        <p style="text-align: center; grid-column: 1 / -1;">جاري تحميل المنتجات من السحابة...</p>
    </div>

    <!-- Firebase SDK لعرض المنتجات -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">لا توجد منتجات مضافة حالياً. افتح لوحة التحكم لإضافة أول منتج!</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const prod = doc.data();
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${prod.imageUrl || 'https://via.placeholder.com/150'}" alt="${prod.name}">
                        <h3>${prod.name}</h3>
                        <p>${prod.desc || ''}</p>
                        <div class="price">${prod.price} دج</div>
                        <button onclick="alert('تم إرسال طلبك بنجاح! سنتصل بك للتأكيد.')">اطلب الآن 🛒</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("خطأ في جلب المنتجات: ", error);
                container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: red;">فشل في تحميل المنتجات من السحابة.</p>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
