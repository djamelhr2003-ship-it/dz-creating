<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجري العالمي - تسوق أفضل المنتجات والعروض</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #333; }
        .header { background: #232f3e; color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 18px; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .cart-btn, .menu-toggle-btn { background: #d97706; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; }
        .menu-toggle-btn { background: #374151; font-size: 16px; }

        .side-drawer { position: fixed; top: 0; right: -280px; width: 280px; height: 100%; background: #232f3e; color: white; z-index: 4000; transition: 0.3s ease; box-shadow: -5px 0 15px rgba(0,0,0,0.3); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
        .side-drawer.open { right: 0; }
        .drawer-close { background: #ef4444; border: none; color: white; padding: 8px; border-radius: 6px; cursor: pointer; font-weight: bold; text-align: center; }
        .drawer-link { background: #374151; color: white; text-decoration: none; padding: 12px; border-radius: 6px; font-weight: bold; text-align: center; display: block; font-size: 14px; }
        .drawer-link.whatsapp { background: #25d366; }

        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; z-index: 3500; }

        .categories-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: #e2e8f0; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; white-space: nowrap; color: #475569; font-size: 13px; }
        .cat-btn.active { background: #2563eb; color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.04); transition: 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; background: #eee; cursor: pointer; }
        .product-title { font-size: 15px; font-weight: bold; margin: 8px 0 4px 0; color: #1e293b; cursor: pointer; }
        .product-price { color: #e11d48; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 8px; }
        .btn-cart { background: #f59e0b; color: white; border: none; flex: 1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-buy { background: #2563eb; color: white; border: none; flex: 1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .qty-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; background: #f1f5f9; padding: 6px; border-radius: 6px; }
        .qty-btn { background: #cbd5e1; border: none; width: 30px; height: 30px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 14px; }

        .rating-stars { color: #f59e0b; font-size: 18px; margin-bottom: 5px; }
        .review-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start; }
        .variant-pill { display: inline-block; padding: 6px 12px; border: 1px solid #cbd5e1; border-radius: 6px; margin: 3px; cursor: pointer; font-size: 13px; background: #f8fafc; }
        .variant-pill.selected { background: #2563eb; color: white; border-color: #2563eb; }

        /* معرض الصور المصغرة وزوم الصور */
        .media-gallery { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
        .gallery-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid #cbd5e1; cursor: pointer; flex-shrink: 0; }
        .gallery-thumb.active { border-color: #2563eb; }
        .main-media-view { width: 100%; height: 240px; object-fit: contain; border-radius: 8px; background: #000; cursor: zoom-in; margin-bottom: 10px; }

        /* نافذة زوم الصورة الكبيرة */
        .zoom-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 5000; cursor: zoom-out; }
        .zoom-modal img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="header">
        <div style="display:flex; align-items:center; gap:10px;">
            <button class="menu-toggle-btn" onclick="toggleDrawer()">☰</button>
            <h1 onclick="location.reload()" style="cursor:pointer;">🛍️ متجري العالمي (COD)</h1>
        </div>
        <div class="nav-links">
            <button class="cart-btn" onclick="openCartModal()">🛒 سلة الشراء (<span id="cart-count">0</span>)</button>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="side-drawer" id="sideDrawer">
        <h3 style="margin-top:0; border-bottom:1px solid #374151; padding-bottom:10px;">📌 القائمة الرئيسية</h3>
        <a href="admin.html" class="drawer-link">🔐 تسجيل دخول الأدمن</a>
        <a href="#" id="whatsapp-support-link" target="_blank" class="drawer-link whatsapp">💬 الدعم عبر واتساب</a>
        <button class="drawer-close" onclick="toggleDrawer()">إغلاق ❌</button>
    </div>

    <div class="categories-nav" id="categories-container">
        <button class="cat-btn active" onclick="filterCategory('الكل', event)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('ساعات اليد', event)">ساعات اليد ⌚</button>
        <button class="cat-btn" onclick="filterCategory('الملابس', event)">الملابس 👕</button>
        <button class="cat-btn" onclick="filterCategory('الإلكترونيات', event)">الإلكترونيات 📱</button>
        <button class="cat-btn" onclick="filterCategory('الأحذية', event)">الأحذية 👟</button>
        <button class="cat-btn" onclick="filterCategory('أكسسوارات', event)">أكسسوارات 🕶️</button>
    </div>

    <div class="products-grid" id="store-products-grid">
        <p style="text-align:center; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
    </div>

    <!-- نافذة زوم الصورة -->
    <div class="zoom-modal" id="zoomModal" onclick="this.style.display='none'">
        <img id="zoomModalImg" src="">
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal-overlay" id="productDetailsModal">
        <div class="modal-card">
            <div id="modal-product-content"></div>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid #e2e8f0;">
            <h4 style="color:#1e293b; margin-bottom:10px;">⭐ التعليقات والتقييمات:</h4>
            <div id="reviews-list-container" style="margin-bottom:15px;"></div>

            <!-- نموذج التعليق يظهر فقط لمن أتم طلباً مسبقاً -->
            <div id="review-form-wrapper" style="display:none; background:#f8fafc; padding:12px; border-radius:8px; border:1px solid #e2e8f0; margin-top:10px;">
                <h4 style="margin:0 0 8px 0; font-size:13px; color:#1e293b;">أضف تقييمك ورسالتك حول هذا المنتج:</h4>
                <div class="form-group" style="margin-bottom:8px;"><input type="text" id="review-user-name" placeholder="اسمك الكريم"></div>
                <div class="form-group" style="margin-bottom:8px;">
                    <select id="review-user-rating">
                        <option value="5">⭐⭐⭐⭐⭐ (ممتاز)</option>
                        <option value="4">⭐⭐⭐⭐ (جيد جداً)</option>
                        <option value="3">⭐⭐⭐ (متوسط)</option>
                        <option value="2">⭐⭐ (ضعيف)</option>
                        <option value="1">⭐ (سيء)</option>
                    </select>
                </div>
                <div class="form-group" style="margin-bottom:8px;"><textarea id="review-user-comment" placeholder="اكتب تعليقك هنا..." style="height:50px;"></textarea></div>
                <button onclick="submitUserReview()" style="background:#2563eb; color:white; width:100%; padding:8px; border:none; border-radius:6px; font-weight:bold; cursor:pointer; font-size:13px;">إرسال التعليق 💬</button>
            </div>
            <p id="review-locked-msg" style="font-size:12px; color:#c0392b; text-align:center; margin-top:10px;">⚠️ خانة التعليقات والتقييمات تفتح تلقائياً بعد إتمام أي عملية شراء ناجحة في المتجر.</p>

            <button onclick="document.getElementById('productDetailsModal').style.display='none'" style="margin-top:15px; width:100%; background:#64748b; padding:10px; color:white; border:none; border-radius:6px; cursor:pointer;">إغلاق التبويب ❌</button>
        </div>
    </div>

    <!-- نافذة السلة الكبيرة والتفاعلية -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-card" id="cart-modal-card-content">
            <h3 style="margin-top:0; color:#1e293b;">🛒 محتويات سلة الشراء</h3>
            <div id="cart-items-list" style="margin-bottom: 15px; max-height: 250px; overflow-y: auto;"></div>
            
            <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; font-size:14px; display:flex; justify-content:space-between; align-items:center;">
                <span>المجموع الجزئي:</span> <b id="cart-subtotal-price" style="color:#1e293b;">0 دج</b>
            </div>

            <div style="display:flex; gap:10px;">
                <button onclick="document.getElementById('cartModal').style.display='none'" style="background:#64748b; flex:1; padding:10px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">مواصلة التسوق 🛍️</button>
                <button onclick="proceedToCheckoutForm()" style="background:#16a34a; flex:1; padding:10px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">إتمام الطلب 🚀</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDdJY7mI1DON...", authDomain: "creater-ecom.firebaseapp.com", projectId: "creater-ecom", storageBucket: "creater-ecom.appspot.com", messagingSenderId: "893449950593", appId: "1:893449950593:web:..." };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], cart = [], currentOpenedProduct = null, currentSelectedPrice = 0, currentQty = 1;
        let selectedColor = '', selectedSize = '';
        let lastCreatedOrderId = null; // لحفظ معرف الطلب الأخير لإمكانية إلغائه

        window.addEventListener('DOMContentLoaded', () => {
            setupWhatsappSupport();
            fetchStoreProducts();
            checkUserHasOrdered();
        });

        window.toggleDrawer = function() {
            let drawer = document.getElementById('sideDrawer');
            let overlay = document.getElementById('drawerOverlay');
            if(drawer.classList.contains('open')) {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
            } else {
                drawer.classList.add('open');
                overlay.style.display = 'block';
            }
        }

        function setupWhatsappSupport() {
            let supportPhone = localStorage.getItem('dz_whatsapp_support') || '213700000000';
            let waLink = document.getElementById('whatsapp-support-link');
            if(waLink) waLink.href = `https://wa.me/${supportPhone}?text=مرحباً، أريد الاستفسار عن منتج في المتجر.`;
        }

        function checkUserHasOrdered() {
            let hasOrdered = localStorage.getItem('dz_user_has_ordered') === 'true';
            let formWrapper = document.getElementById('review-form-wrapper');
            let lockedMsg = document.getElementById('review-locked-msg');
            if(formWrapper && lockedMsg) {
                if(hasOrdered) {
                    formWrapper.style.display = 'block';
                    lockedMsg.style.display = 'none';
                } else {
                    formWrapper.style.display = 'none';
                    lockedMsg.style.display = 'block';
                }
            }
        }

        async function fetchStoreProducts() {
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                snap.forEach(d => {
                    const p = { id: d.id, ...d.data() };
                    if(p.status !== 'مهملات') allProducts.push(p);
                });
                renderProducts(allProducts);
            } catch(e) {}
        }

        window.filterCategory = function(cat, event) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(cat === 'الكل') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === cat));
        }

        function renderProducts(products) {
            let grid = document.getElementById('store-products-grid');
            if(products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد منتجات متاحة حالياً.</p>';
                return;
            }
            grid.innerHTML = '';
            products.forEach(p => {
                let img = p.imageUrls?.[0] || 'https://via.placeholder.com/200';
                let stockVal = p.stock !== undefined ? p.stock : 10;
                grid.innerHTML += `
                    <div class="product-card">
                        <div>
                            <img src="${img}" class="product-img" onclick='openProductDetails(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
                            <h3 class="product-title" onclick='openProductDetails(${JSON.stringify(p).replace(/'/g, "&apos;")})'>${p.name}</h3>
                            <p class="product-price">${p.price} دج</p>
                        </div>
                        <div>
                            <p style="font-size:11px; color:${stockVal > 0 ? 'green':'red'}; margin-bottom:6px;">${stockVal > 0 ? '📦 متوفر' : '❌ نفذت الكمية'}</p>
                            <div class="btn-group">
                                <button onclick='addToCartDirect(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-cart" ${stockVal <= 0 ? 'disabled':''}>أضف للسلة 🛒</button>
                                <button onclick='buyNowDirect(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-buy" ${stockVal <= 0 ? 'disabled':''}>اطلب الآن ⚡</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductDetails = function(product) {
            currentOpenedProduct = product;
            currentSelectedPrice = product.price;
            currentQty = 1;
            selectedColor = '';
            selectedSize = '';

            let images = product.imageUrls && product.imageUrls.length > 0 ? product.imageUrls : ['https://via.placeholder.com/200'];
            let videoUrl = product.videoUrl || '';
            let firstMedia = images[0];

            let mediaGalleryHtml = `<div class="media-gallery" id="media-gallery-container">`;
            images.forEach((img, index) => {
                mediaGalleryHtml += `<img src="${img}" class="gallery-thumb ${index === 0 ? 'active':''}" onclick="setMainMedia('${img}', this)">`;
            });
            if(videoUrl) {
                mediaGalleryHtml += `<video src="${videoUrl}" class="gallery-thumb" onclick="setMainVideo('${videoUrl}', this)" style="background:#000;" muted></video>`;
            }
            mediaGalleryHtml += `</div>`;

            let variantsHtml = '';
            if(product.category === 'الملابس' && product.variants && product.variants.length > 0) {
                let colors = [...new Set(product.variants.map(v => v.color))];
                let sizes = [...new Set(product.variants.map(v => v.size))];

                variantsHtml += '<div style="margin:10px 0;">';
                if(colors.length > 0) {
                    variantsHtml += '<label style="font-size:12px; margin-bottom:5px;">اختر اللون:</label><div id="color-pills-container">';
                    colors.forEach(c => { variantsHtml += `<span class="variant-pill" onclick="selectColor('${c}')">${c}</span>`; });
                    variantsHtml += '</div>';
                }
                if(sizes.length > 0) {
                    variantsHtml += '<label style="font-size:12px; margin:8px 0 5px 0;">اختر المقاس:</label><div id="size-pills-container">';
                    sizes.forEach(s => { variantsHtml += `<span class="variant-pill" onclick="selectSize('${s}')">${s}</span>`; });
                    variantsHtml += '</div>';
                }
                variantsHtml += '</div>';
            }

            let contentHtml = `
                <div>
                    <div id="main-media-display-area">
                        <img src="${firstMedia}" class="main-media-view" id="active-main-img" onclick="openZoomModal(this.src)">
                    </div>
                    ${mediaGalleryHtml}
                    <h2 style="margin:5px 0 5px 0; color:#1e293b;">${product.name}</h2>
                    <p style="color:#e11d48; font-weight:bold; font-size:20px; margin:0 0 10px 0;" id="modal-display-price">${product.price} دج</p>
                    <p style="font-size:13px; color:#555; line-height:1.5;">${product.description || 'لا يوجد وصف متاح.'}</p>
                </div>
                ${variantsHtml}
                <div class="qty-container">
                    <span>الكمية:</span>
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <b id="modal-qty-val" style="font-size:16px;">1</b>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
                <div style="margin-bottom:10px; font-size:15px;">المجموع الجزئي: <b id="modal-total-price" style="color:#e11d48;">${product.price} دج</b></div>
                <div style="display:flex; gap:10px;">
                    <button onclick="addCurrentToCartFromModal()" style="background:#f59e0b; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">أضف للسلة 🛒</button>
                    <button onclick="buyCurrentNowModal()" style="background:#16a34a; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">اطلب الآن 🚀</button>
                </div>
            `;

            document.getElementById('modal-product-content').innerHTML = contentHtml;
            renderReviews(product.id);
            checkUserHasOrdered();
            document.getElementById('productDetailsModal').style.display = 'flex';
        }

        window.setMainMedia = function(url, thumbEl) {
            document.querySelectorAll('.gallery-thumb').forEach(el => el.classList.remove('active'));
            thumbEl.classList.add('active');
            document.getElementById('main-media-display-area').innerHTML = `<img src="${url}" class="main-media-view" id="active-main-img" onclick="openZoomModal(this.src)">`;
        }

        window.setMainVideo = function(videoUrl, thumbEl) {
            document.querySelectorAll('.gallery-thumb').forEach(el => el.classList.remove('active'));
            thumbEl.classList.add('active');
            document.getElementById('main-media-display-area').innerHTML = `<video src="${videoUrl}" class="main-media-view" controls autoplay style="background:#000;"></video>`;
        }

        window.openZoomModal = function(src) {
            document.getElementById('zoomModalImg').src = src;
            document.getElementById('zoomModal').style.display = 'flex';
        }

        window.selectColor = function(color) {
            selectedColor = color;
            document.querySelectorAll('#color-pills-container .variant-pill').forEach(el => {
                el.classList.remove('selected');
                if(el.innerText === color) el.classList.add('selected');
            });
        }

        window.selectSize = function(size) {
            selectedSize = size;
            document.querySelectorAll('#size-pills-container .variant-pill').forEach(el => {
                el.classList.remove('selected');
                if(el.innerText === size) el.classList.add('selected');
            });
        }

        window.changeQty = function(delta) {
            currentQty += delta;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('modal-qty-val').innerText = currentQty;
            updateModalTotal();
        }

        window.updateModalTotal = function() {
            let total = currentSelectedPrice * currentQty;
            document.getElementById('modal-display-price').innerText = currentSelectedPrice + ' دج';
            document.getElementById('modal-total-price').innerText = total + ' دج';
        }

        window.addToCartDirect = function(product) {
            cart.push({ id: product.id, productName: product.name, price: product.price, quantity: 1, color: '', size: '', imageUrl: product.imageUrls?.[0] || '' });
            document.getElementById('cart-count').innerText = cart.length;
            alert(`تمت إضافة (${product.name}) إلى السلة بنجاح! 🛒`);
        }

        window.buyNowDirect = function(product) {
            cart = [{ id: product.id, productName: product.name, price: product.price, quantity: 1, color: '', size: '', imageUrl: product.imageUrls?.[0] || '' }];
            document.getElementById('cart-count').innerText = 1;
            openCartModal();
        }

        window.addCurrentToCartFromModal = function() {
            if(currentOpenedProduct.category === 'الملابس' && currentOpenedProduct.variants && currentOpenedProduct.variants.length > 0) {
                if(!selectedColor || !selectedSize) { alert('الرجاء اختيار اللون والمقاس أولاً!'); return; }
            }
            cart.push({ id: currentOpenedProduct.id, productName: currentOpenedProduct.name, price: currentSelectedPrice, quantity: currentQty, color: selectedColor, size: selectedSize, imageUrl: currentOpenedProduct.imageUrls?.[0] || '' });
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('productDetailsModal').style.display = 'none';
            alert('تمت إضافة المنتج إلى السلة بنجاح! 🛒');
        }

        window.buyCurrentNowModal = function() {
            if(currentOpenedProduct.category === 'الملابس' && currentOpenedProduct.variants && currentOpenedProduct.variants.length > 0) {
                if(!selectedColor || !selectedSize) { alert('الرجاء اختيار اللون والمقاس أولاً!'); return; }
            }
            cart = [{ id: currentOpenedProduct.id, productName: currentOpenedProduct.name, price: currentSelectedPrice, quantity: currentQty, color: selectedColor, size: selectedSize, imageUrl: currentOpenedProduct.imageUrls?.[0] || '' }];
            document.getElementById('cart-count').innerText = 1;
            document.getElementById('productDetailsModal').style.display = 'none';
            openCartModal();
        }

        window.openCartModal = function() {
            if(cart.length === 0) {
                alert('سلة الشراء فارغة حالياً!');
                return;
            }
            renderCartModalContent();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCartModalContent() {
            let container = document.getElementById('cart-items-list');
            let subtotal = 0;
            let html = '';
            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                subtotal += itemTotal;
                let variantInfo = (item.color || item.size) ? ` [اللون: ${item.color || '-'} | المقاس: ${item.size || '-'}]` : '';
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:10px; border-radius:6px; margin-bottom:8px; font-size:13px;">
                        <div style="display:flex; gap:10px; align-items:center;">
                            <img src="${item.imageUrl}" style="width:40px; height:40px; object-fit:cover; border-radius:4px;">
                            <div>
                                <b>${item.productName}</b>${variantInfo}<br>
                                <span style="color:#e11d48; font-weight:bold;">${item.price} دج × ${item.quantity} = ${itemTotal} دج</span>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" style="background:#ef4444; color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-size:12px;">حذف 🗑️</button>
                    </div>
                `;
            });
            container.innerHTML = html;
            document.getElementById('cart-subtotal-price').innerText = subtotal + ' دج';
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            if(cart.length === 0) {
                document.getElementById('cartModal').style.display = 'none';
            } else {
                renderCartModalContent();
            }
        }

            let cardModalContent = document.getElementById('cart-modal-card-content');
            cardModalContent.innerHTML = `
                <h3 style="margin-top:0; color:#1e293b;">🛒 إتمام الطلب (الدفع عند الاستلام)</h3>
                <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname" placeholder="أدخل اسمك الكامل"></div>

                        <option value="Annaba">23 - عنابة</option>

                        <option value="Constantine">25 - قسنطينة</option>

                        <option value="Khenchela">40 - خنشلة</option>
                        <option value="Souk Ahras">41 - سوق أهراس</option>
                        <option value="Tipaza">42 - تيبازة</option>

                        <option value="In Salah">53 - إن صالح</option>

                    </select>
                </div>
                <div class="form-group"><label>البلدية / العنوان بالتفصيل:</label><input type="text" id="order-commune" placeholder="اسم البلدية والحي"></div>
                <div class="form-group"><label>ملاحظات للطلب (اختياري):</label><textarea id="order-notes" placeholder="اكتب أي ملاحظة تخص التوصيل أو المنتج..." style="height:50px;"></textarea></div>
                <div class="form-group">
                    <label>نوع التوصيل:</label>
                    <select id="order-delivery-type" onchange="calcCheckoutTotal()">
                        <option value="توصيل للمنزل 🏠">توصيل للمنزل 🏠</option>
                        <option value="توصيل للمكتب 🏢">توصيل للمكتب (ستوب ديسك) 🏢</option>
                    </select>
                </div>

                <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; font-size:14px;">
                    <span>💰 المجموع الكلي النهائي (COD):</span> <b id="checkout-final-total" style="color:#e11d48; font-size:18px;">0 دج</b>
                </div>

                <button onclick="submitCartOrder()" style="background:#16a34a; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">تأكيد وإرسال الطلب نهائياً 🚀</button>
                <button onclick="openCartModal()" style="margin-top:8px; width:100%; background:#64748b; padding:10px; color:white; border:none; border-radius:6px; cursor:pointer;">العودة للسلة 🔙</button>

        window.calcCheckoutTotal = function() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let deliveryType = document.getElementById('order-delivery-type')?.value || '';
            let deliveryFee = deliveryType.includes('منزل') ? 600 : 400;
            let total = subtotal + deliveryFee;
            let totalEl = document.getElementById('checkout-final-total');
            if(totalEl) totalEl.innerText = total + ' دج';
        }

        window.submitCartOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilaya = document.getElementById('order-wilaya').value;
            let commune = document.getElementById('order-commune').value.trim();
            let customerNotes = document.getElementById('order-notes').value.trim();
            let deliveryType = document.getElementById('order-delivery-type').value;

            if(!fullName || !phone || !commune) {
                alert('الرجاء تعبئة الاسم، رقم الهاتف، والعنوان بالتفصيل!');
                return;
            }

            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let deliveryFee = deliveryType.includes('منزل') ? 600 : 400;
            let finalTotal = subtotal + deliveryFee;

            try {
                for(let item of cart) {
                    let docRef = await addDoc(collection(db, "orders"), {
                        productName: item.productName,
                        unitPrice: item.price,
                        quantity: item.quantity,
                        color: item.color || '',
                        size: item.size || '',
                        imageUrl: item.imageUrl || '',
                        fullName,
                        phone,
                        wilaya,
                        commune,
                        customerNotes,
                        deliveryType,
                        finalTotal,
                        status: 'جديد ⏳',
                        createdAt: new Date()
                    });
                    lastCreatedOrderId = docRef.id;
                }

                localStorage.setItem('dz_user_has_ordered', 'true');
                cart = [];
                document.getElementById('cart-count').innerText = '0';
                
                // نافذة نجاح الطلب مع إمكانية إلغاؤه فوراً أو الخروج
                let cardModalContent = document.getElementById('cart-modal-card-content');
                cardModalContent.innerHTML = `
                    <div style="text-align:center; padding:15px;">
                        <h3 style="color:#16a34a; margin-top:0;">🎉 تم إرسال طلبك بنجاح!</h3>
                        <p style="font-size:13px; color:#555; line-height:1.5;">سنتصل بك قريباً لتأكيد طلبك. شكراً لتسوقك معنا.</p>
                        <div style="display:flex; gap:10px; margin-top:20px;">
                            <button onclick="cancelMyLastOrder()" style="background:#ef4444; flex:1; padding:10px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">إلغاء هذا الطلب ❌</button>
                            <button onclick="document.getElementById('cartModal').style.display='none'; location.reload();" style="background:#2563eb; flex:1; padding:10px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">موافق / خروج ✅</button>
                        </div>
                    </div>
                `;

            } catch(e) {
                alert('فشل إرسال الطلب، حاول مرة أخرى.');
            }
        }

        window.cancelMyLastOrder = async function() {
            if(!lastCreatedOrderId) { alert('لا يوجد طلب نشط للإلغاء.'); return; }
            if(confirm('هل أنت متأكد أنك تريد إلغاء طلبك؟')) {
                try {
                    await updateDoc(doc(db, "orders", lastCreatedOrderId), { status: 'ملغى ❌' });
                    alert('تم إلغاء طلبك بنجاح.');
                    document.getElementById('cartModal').style.display = 'none';
                    location.reload();
                } catch(e) {
                    alert('حدث خطأ أثناء الإلغاء.');
                }
            }
        }

        window.renderReviews = function(productId) {
            let container = document.getElementById('reviews-list-container');
            if(!container) return;
            let reviewsKey = `dz_reviews_${productId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            let visibleReviews = reviews.filter(r => !r.hidden);

            if(visibleReviews.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#64748b;">لا توجد تعليقات ظاهرة بعد لهذا المنتج.</p>';
                return;
            }
            let html = '';
            reviews.forEach((r) => {
                if(r.hidden) return;
                let stars = '⭐'.repeat(Number(r.rating));
                html += `
                    <div class="review-box">
                        <div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:3px; gap:15px;">
                                <b>👤 ${r.name}</b>
                                <span style="font-size:11px; color:#64748b;">${r.date}</span>
                            </div>
                            <div class="rating-stars" style="font-size:13px;">${stars}</div>
                            <p style="margin:0; color:#333;">${r.comment}</p>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.submitUserReview = function() {
            if(!currentOpenedProduct) return;
            let name = document.getElementById('review-user-name').value.trim();
            let rating = document.getElementById('review-user-rating').value;
            let comment = document.getElementById('review-user-comment').value.trim();

            if(!name || !comment) {
                alert('الرجاء إدخال الاسم ومحتوى التعليق!');
                return;
            }

            let reviewsKey = `dz_reviews_${currentOpenedProduct.id}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            
            reviews.push({
                name,
                rating,
                comment,
                date: new Date().toLocaleDateString('ar-DZ'),
                hidden: false
            });

            localStorage.setItem(reviewsKey, JSON.stringify(reviews));
            document.getElementById('review-user-name').value = '';
            document.getElementById('review-user-comment').value = '';
            alert('تم إرسال تقييمك بنجاح! شكراً لك.');
            renderReviews(currentOpenedProduct.id);
        }
    </script>
