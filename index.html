<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجري العالمي - تسوق أفضل المنتجات والعروض</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f8fafc; margin: 0; padding: 15px; color: #333; }
        .header { background: #232f3e; color: white; padding: 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .header h1 { margin: 0; font-size: 18px; cursor: pointer; }
        .nav-links { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .admin-link, .cart-btn { background: #374151; color: white; text-decoration: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; }
        .cart-btn { background: #d97706; }
        .live-visitors-badge { background: #059669; color: white; padding: 6px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; display: flex; align-items: center; gap: 5px; }

        .categories-nav { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-btn { background: #e2e8f0; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; white-space: nowrap; color: #475569; font-size: 13px; }
        .cat-btn.active { background: #2563eb; color: white; }

        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer; transition: 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(0,0,0,0.08); }
        .product-img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; background: #eee; }
        .product-title { font-size: 15px; font-weight: bold; margin: 8px 0 4px 0; color: #1e293b; }
        .product-price { color: #e11d48; font-weight: bold; font-size: 16px; margin-bottom: 8px; }
        
        .btn-group { display: flex; gap: 6px; margin-top: 8px; }
        .btn-cart { background: #f59e0b; color: white; border: none; flex: 1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        .btn-buy { background: #2563eb; color: white; border: none; flex: 1; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; }
        
        .qty-container { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; background: #f1f5f9; padding: 6px; border-radius: 6px; }
        .qty-btn { background: #cbd5e1; border: none; width: 30px; height: 30px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 9px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; outline: none; font-size: 14px; }

        .gold-offer-box {
            background: linear-gradient(135deg, #fef9c3, #fef08a);
            border: 2px solid #eab308;
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .crossed-old-price { position: relative; color: #64748b; font-weight: bold; font-size: 13px; margin-left: 8px; }
        .crossed-old-price::after { content: ""; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background-color: #ef4444; transform: translateY(-50%); }
        .new-offer-price { color: #16a34a; font-weight: bold; font-size: 15px; }

        .rating-stars { color: #f59e0b; font-size: 18px; margin-bottom: 5px; }
        .review-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; display: flex; justify-content: space-between; align-items: flex-start; }
    </style>
</head>
<body>

    <div class="header">
        <h1 onclick="location.reload()">🛍️ متجري العالمي (COD)</h1>
        <div class="nav-links">
            <div class="live-visitors-badge">🟢 الزوار الآن: <span id="live-visitors-count">1</span></div>
            <button class="cart-btn" onclick="openCartModal()">🛒 سلة الشراء (<span id="cart-count">0</span>)</button>
            <a href="admin.html" class="admin-link">⚙️ لوحة التحكم</a>
        </div>
    </div>

    <!-- التصنيفات -->
    <div class="categories-nav" id="categories-container">
        <button class="cat-btn active" onclick="filterCategory('الكل', event)">الكل</button>
        <button class="cat-btn" onclick="filterCategory('ساعات اليد', event)">ساعات اليد ⌚</button>
        <button class="cat-btn" onclick="filterCategory('الملابس', event)">الملابس 👕</button>
        <button class="cat-btn" onclick="filterCategory('الإلكترونيات', event)">الإلكترونيات 📱</button>
        <button class="cat-btn" onclick="filterCategory('الأحذية', event)">الأحذية 👟</button>
        <button class="cat-btn" onclick="filterCategory('أكسسوارات', event)">أكسسوارات 🕶️</button>
    </div>

    <!-- شبكة المنتجات -->
    <div class="products-grid" id="store-products-grid">
        <p style="text-align:center; grid-column: 1/-1;">جاري تحميل المنتجات...</p>
    </div>

    <!-- نافذة تفاصيل المنتج والتعليقات -->
    <div class="modal-overlay" id="productDetailsModal">
        <div class="modal-card">
            <div id="modal-product-content"></div>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid #e2e8f0;">
            <h4 style="color:#1e293b; margin-bottom:10px;">📦 منتجات أخرى من نفس الصنف:</h4>
            <div class="products-grid" id="related-products-grid" style="grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));"></div>

            <hr style="margin:20px 0; border:0; border-top:1px solid #e2e8f0;">
            <h4 style="color:#1e293b; margin-bottom:10px;">⭐ التقييمات والتعليقات:</h4>
            <div id="reviews-list-container" style="margin-bottom:15px;"></div>

            <button onclick="document.getElementById('productDetailsModal').style.display='none'" style="margin-top:15px; width:100%; background:#64748b; padding:10px; color:white; border:none; border-radius:6px; cursor:pointer;">إغلاق التبويب ❌</button>
        </div>
    </div>

    <!-- نافذة سلة الشراء وإتمام الطلب -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-card" id="cart-modal-card-content">

            <div class="form-group">

                </select>
            </div>
            <div class="form-group"><label>البلدية / العنوان بالتفصيل:</label><input type="text" id="order-commune" placeholder="اسم البلدية والحي"></div>
            <div class="form-group">
                <label>نوع التوصيل:</label>
                <select id="order-delivery-type" onchange="calculateCartTotal()">
                    <option value="توصيل للمنزل 🏠">توصيل للمنزل 🏠</option>
                    <option value="توصيل للمكتب 🏢">توصيل للمكتب (ستوب ديسك) 🏢</option>
                </select>
            </div>

            <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; font-size:14px;">
                <span>💰 المجموع الكلي النهائي (COD):</span> <b id="cart-final-total" style="color:#e11d48; font-size:18px;">0 دج</b>
            </div>

            <button onclick="submitCartOrder()" style="background:#16a34a; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">تأكيد وإرسال الطلب نهائياً 🚀</button>
            <button onclick="document.getElementById('cartModal').style.display='none'" style="margin-top:8px; width:100%; background:#64748b; padding:10px; color:white; border:none; border-radius:6px; cursor:pointer;">إلغاء ❌</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyDdJY7mI1DON...", authDomain: "creater-ecom.firebaseapp.com", projectId: "creater-ecom", storageBucket: "creater-ecom.appspot.com", messagingSenderId: "893449950593", appId: "1:893449950593:web:..." };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], cart = [], currentOpenedProduct = null, currentSelectedPrice = 0, currentQty = 1;

        window.addEventListener('DOMContentLoaded', () => {
            trackVisitor();
            let savedName = localStorage.getItem('dz_user_name');
            let savedPhone = localStorage.getItem('dz_user_phone');
            if(savedName) document.getElementById('order-fullname').value = savedName;
            if(savedPhone) document.getElementById('order-phone').value = savedPhone;
            fetchStoreProducts();
        });

        // نظام تتبع الزوار (يومي، أسبوعي، شهري، ولحظي)
        function trackVisitor() {
            let today = new Date().toISOString().split('T')[0];
            let visitors = JSON.parse(localStorage.getItem('dz_store_visitors')) || { days: {}, weeks: {}, months: {} };
            
            let weekKey = getWeekKey(new Date());
            let monthKey = today.substring(0, 7);

            if(!visitors.days[today]) visitors.days[today] = 0;
            if(!visitors.weeks[weekKey]) visitors.weeks[weekKey] = 0;
            if(!visitors.months[monthKey]) visitors.months[monthKey] = 0;

            let sessionKey = `visited_${today}`;
            if(!sessionStorage.getItem(sessionKey)) {
                sessionStorage.setItem(sessionKey, 'true');
                visitors.days[today]++;
                visitors.weeks[weekKey]++;
                visitors.months[monthKey]++;
                localStorage.setItem('dz_store_visitors', JSON.stringify(visitors));
            }

            // الزوار المتواجدون الآن (وهمي حي يتذبذب واقعياً)
            let liveCount = Math.floor(Math.random() * 5) + 3;
            document.getElementById('live-visitors-count').innerText = liveCount;
        }

        function getWeekKey(d) {
            let date = new Date(d.getTime());
            date.setHours(0, 0, 0, 0);
            date.setDate(date.getDate() + 4 - (date.getDay() || 7));
            let yearStart = new Date(date.getFullYear(), 0, 1);
            let weekNo = Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
            return `${date.getFullYear()}-W${weekNo}`;
        }

        async function fetchStoreProducts() {
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                snap.forEach(d => {
                    const p = { id: d.id, ...d.data() };
                    if(p.status !== 'مهملات') allProducts.push(p);
                });
                renderProducts(allProducts);
            } catch(e) {
                document.getElementById('store-products-grid').innerHTML = '<p style="text-align:center; color:red;">تعذر تحميل المنتجات.</p>';
            }
        }

        window.filterCategory = function(cat, event) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.currentTarget.classList.add('active');
            if(cat === 'الكل') renderProducts(allProducts);
            else renderProducts(allProducts.filter(p => p.category === cat));
        }

        function renderProducts(products) {
            let grid = document.getElementById('store-products-grid');
            if(products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد منتجات متاحة حالياً.</p>';
                return;
            }
            grid.innerHTML = '';
            products.forEach(p => {
                let img = p.imageUrls?.[0] || 'https://via.placeholder.com/200';
                let stockVal = p.stock !== undefined ? p.stock : 10;
                grid.innerHTML += `
                    <div class="product-card">
                        <div onclick='openProductDetails(${JSON.stringify(p).replace(/'/g, "&apos;")})'>
                            <img src="${img}" class="product-img">
                            <h3 class="product-title">${p.name}</h3>
                            <p class="product-price">${p.price} دج</p>
                        </div>
                        <div>
                            <p style="font-size:11px; color:${stockVal > 0 ? 'green':'red'}; margin-bottom:6px;">${stockVal > 0 ? '📦 متوفر' : '❌ نفذت الكمية'}</p>
                            <div class="btn-group">
                                <button onclick='addToCartDirect(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-cart" ${stockVal <= 0 ? 'disabled':''}>أضف للسلة 🛒</button>
                                <button onclick='openProductDetails(${JSON.stringify(p).replace(/'/g, "&apos;")})' class="btn-buy" ${stockVal <= 0 ? 'disabled':''}>اطلب الآن ⚡</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.openProductDetails = function(product) {
            currentOpenedProduct = product;
            currentSelectedPrice = product.price;
            currentQty = 1;

            // تسجيل عدد مشاهدات المنتج لتحليل الأكثر مشاهدة
            let viewsMap = JSON.parse(localStorage.getItem('dz_product_views')) || {};
            viewsMap[product.name] = (viewsMap[product.name] || 0) + 1;
            localStorage.setItem('dz_product_views', JSON.stringify(viewsMap));

            let img = product.imageUrls?.[0] || 'https://via.placeholder.com/200';
            
            let offersHtml = '';
            if(product.enableOffers && product.offers && product.offers.length > 0) {
                offersHtml += '<h4 style="margin:10px 0 5px 0; color:#b45309; font-size:13px;">🔥 اختر أحد العروض الذهبية:</h4>';
                offersHtml += `
                    <label class="gold-offer-box">
                        <div style="display:flex; align-items:center; gap:8px;">
                            <input type="radio" name="modalOffer" value="base" checked onchange="currentSelectedPrice=${product.price}; updateModalTotal()">
                            <span><b>السعر العادي الأساسي</b></span>
                        </div>
                        <span class="new-offer-price">${product.price} دج</span>
                    </label>
                `;
                product.offers.forEach((offer, i) => {
                    offersHtml += `
                        <label class="gold-offer-box">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="radio" name="modalOffer" value="${i}" onchange="currentSelectedPrice=${offer.newPrice}; updateModalTotal()">
                                <span><b>${offer.title}</b> ✔️</span>
                            </div>
                            <div>
                                <span class="crossed-old-price">${offer.oldPrice} دج</span>
                                <span class="new-offer-price">${offer.newPrice} دج ✅</span>
                            </div>
                        </label>
                    `;
                });
            }

            let contentHtml = `
                <div style="display:flex; gap:15px; flex-wrap:wrap;">
                    <img src="${img}" style="width:180px; height:180px; object-fit:cover; border-radius:8px; background:#eee;">
                    <div style="flex:1;">
                        <h2 style="margin:0 0 5px 0; color:#1e293b;">${product.name}</h2>
                        <p style="color:#e11d48; font-weight:bold; font-size:20px; margin:0 0 10px 0;" id="modal-display-price">${product.price} دج</p>
                        <p style="font-size:13px; color:#555; line-height:1.5;">${product.description || 'لا يوجد وصف متاح.'}</p>
                    </div>
                </div>
                ${offersHtml}
                <div class="qty-container">
                    <span>الكمية:</span>
                    <button class="qty-btn" onclick="changeQty(-1)">-</button>
                    <b id="modal-qty-val" style="font-size:16px;">1</b>
                    <button class="qty-btn" onclick="changeQty(1)">+</button>
                </div>
                <div style="margin-bottom:10px; font-size:15px;">المجموع الجزئي: <b id="modal-total-price" style="color:#e11d48;">${product.price} دج</b></div>
                <div style="display:flex; gap:10px;">
                    <button onclick="addCurrentToCart()" style="background:#f59e0b; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">أضف للسلة 🛒</button>
                    <button onclick="buyCurrentNow()" style="background:#16a34a; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">اطلب الآن 🚀</button>
                </div>
            `;

            document.getElementById('modal-product-content').innerHTML = contentHtml;

            let relatedGrid = document.getElementById('related-products-grid');
            let related = allProducts.filter(p => p.category === product.category && p.id !== product.id);
            if(related.length === 0) {
                relatedGrid.innerHTML = '<p style="font-size:12px; color:#777;">لا توجد منتجات أخرى في هذا الصنف.</p>';
            } else {
                relatedGrid.innerHTML = '';
                related.forEach(rp => {
                    let rImg = rp.imageUrls?.[0] || 'https://via.placeholder.com/150';
                    relatedGrid.innerHTML += `
                        <div class="product-card" onclick='openProductDetails(${JSON.stringify(rp).replace(/'/g, "&apos;")})'>
                            <img src="${rImg}" style="width:100%; height:100px; object-fit:cover; border-radius:6px;">
                            <h5 style="margin:5px 0 2px 0; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${rp.name}</h5>
                            <span style="color:#e11d48; font-size:12px; font-weight:bold;">${rp.price} دج</span>
                        </div>
                    `;
                });
            }

            renderReviews(product.id);
            document.getElementById('productDetailsModal').style.display = 'flex';
        }

        window.changeQty = function(delta) {
            currentQty += delta;
            if(currentQty < 1) currentQty = 1;
            document.getElementById('modal-qty-val').innerText = currentQty;
            updateModalTotal();
        }

        window.updateModalTotal = function() {
            let total = currentSelectedPrice * currentQty;
            document.getElementById('modal-display-price').innerText = currentSelectedPrice + ' دج';
            document.getElementById('modal-total-price').innerText = total + ' دج';
        }

        window.addToCartDirect = function(product) {
            cart.push({ id: product.id, productName: product.name, price: product.price, quantity: 1 });
            document.getElementById('cart-count').innerText = cart.length;
            alert(`تمت إضافة (${product.name}) إلى السلة بنجاح! 🛒`);
        }

        window.addCurrentToCart = function() {
            cart.push({ id: currentOpenedProduct.id, productName: currentOpenedProduct.name, price: currentSelectedPrice, quantity: currentQty });
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('productDetailsModal').style.display = 'none';
            alert('تمت إضافة المنتج بجميع خصائصه إلى السلة بنجاح! 🛒');
        }

        window.buyCurrentNow = function() {
            cart = [{ id: currentOpenedProduct.id, productName: currentOpenedProduct.name, price: currentSelectedPrice, quantity: currentQty }];
            document.getElementById('cart-count').innerText = 1;
            document.getElementById('productDetailsModal').style.display = 'none';
            openCartModal();
        }

        window.openCartModal = function() {
            if(cart.length === 0) {
                alert('سلة الشراء فارغة حالياً!');
                return;
            }
            renderCartModalForm();
        }

        function renderCartModalForm() {
            let cardHtml = `
                <h3 style="margin-top:0; color:#1e293b;">🛒 سلة الشراء وإتمام الطلب (الدفع عند الاستلام)</h3>
                <div id="cart-items-list" style="margin-bottom: 15px; max-height: 200px; overflow-y: auto;"></div>

                <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname" placeholder="أدخل اسمك الكامل"></div>
                <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="order-phone" placeholder="07xxxxxxxx"></div>
                <div class="form-group">

                    <select id="order-wilaya" onchange="calculateCartTotal()">

                        <option value="Algiers">16 - الجزائر العاصمة</option>

                        <option value="Jijel">18 - جيجل</option>

                        <option value="Saïda">20 - سعيدة</option>
                        <option value="Skikda">21 - سكيكدة</option>
                        <option value="Sidi Bel Abbès">22 - سيدي بلعباس</option>
                        <option value="Annaba">23 - عنابة</option>
                        <option value="Guelma">24 - قالمة</option>
                        <option value="Constantine">25 - قسنطينة</option>
                        <option value="Médéa">26 - المدية</option>
                        <option value="Mostaganem">27 - مستغانم</option>
                        <option value="M'Sila">28 - المسيلة</option>
                        <option value="Mascara">29 - معسكر</option>
                        <option value="Ouargla">30 - ورقلة</option>
                        <option value="Oran">31 - وهران</option>
                        <option value="El Bayadh">32 - البيض</option>
                        <option value="Illizi">33 - إليزي</option>
                        <option value="Bordj Bou Arréridj">34 - برج بوعريريج</option>
                        <option value="Boumerdès">35 - بومرداس</option>
                        <option value="El Tarf">36 - الطارف</option>
                        <option value="Tindouf">37 - تندوف</option>
                        <option value="Tissemsilt">38 - تيسمسيلت</option>
                        <option value="El Oued">39 - الوادي</option>
                        <option value="Khenchela">40 - خنشلة</option>
                        <option value="Souk Ahras">41 - سوق أهراس</option>
                        <option value="Tipaza">42 - تيبازة</option>
                        <option value="Mila">43 - ميلة</option>
                        <option value="Aïn Defla">44 - عين الدفلى</option>
                        <option value="Naâma">45 - النعامة</option>
                        <option value="Aïn Témouchent">46 - عين تموشنت</option>
                        <option value="Ghardaïa">47 - غرداية</option>
                        <option value="Relizane">48 - غليزان</option>
                        <option value="Timimoun">49 - تيميمون</option>
                        <option value="Bordj Badji Mokhtar">50 - برج باجي مختار</option>
                        <option value="Ouled Djellal">51 - أولاد جلال</option>
                        <option value="Béni Abbès">52 - بني عباس</option>
                        <option value="In Salah">53 - إن صالح</option>
                        <option value="In Guezzam">54 - إن قزام</option>
                        <option value="Touggourt">55 - تقرت</option>
                        <option value="Djanet">56 - جانت</option>
                        <option value="El M'Ghair">57 - المغير</option>
                        <option value="El Meniaa">58 - المنيعة</option>
                    </select>
                </div>
                <div class="form-group"><label>البلدية / العنوان بالتفصيل:</label><input type="text" id="order-commune" placeholder="اسم البلدية والحي"></div>
                <div class="form-group">
                    <label>نوع التوصيل:</label>
                    <select id="order-delivery-type" onchange="calculateCartTotal()">
                        <option value="توصيل للمنزل 🏠">توصيل للمنزل 🏠</option>
                        <option value="توصيل للمكتب 🏢">توصيل للمكتب (ستوب ديسك) 🏢</option>
                    </select>
                </div>

                <div style="background:#f1f5f9; padding:10px; border-radius:6px; margin-bottom:15px; font-size:14px;">
                    <span>💰 المجموع الكلي النهائي (COD):</span> <b id="cart-final-total" style="color:#e11d48; font-size:18px;">0 دج</b>
                </div>

                <button onclick="submitCartOrder()" style="background:#16a34a; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">تأكيد وإرسال الطلب نهائياً 🚀</button>
                <button onclick="document.getElementById('cartModal').style.display='none'" style="margin-top:8px; width:100%; background:#64748b; padding:10px; color:white; border:none; border-radius:6px; cursor:pointer;">إلغاء ❌</button>
            `;
            document.getElementById('cart-modal-card-content').innerHTML = cardHtml;
            
            let savedName = localStorage.getItem('dz_user_name');
            let savedPhone = localStorage.getItem('dz_user_phone');
            if(savedName) document.getElementById('order-fullname').value = savedName;
            if(savedPhone) document.getElementById('order-phone').value = savedPhone;

            renderCartItems();
            calculateCartTotal();
            document.getElementById('cartModal').style.display = 'flex';
        }

        function renderCartItems() {
            let container = document.getElementById('cart-items-list');
            if(!container) return;
            let html = '';
            cart.forEach((item, index) => {
                html += `
                    <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px; border-radius:6px; margin-bottom:5px; font-size:13px;">
                        <span><b>${item.productName}</b> (×${item.quantity}) - ${item.price * item.quantity} دج</span>
                        <button onclick="removeFromCart(${index})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            if(cart.length === 0) {
                document.getElementById('cartModal').style.display = 'none';
            } else {
                renderCartItems();
                calculateCartTotal();
            }
        }

        window.calculateCartTotal = function() {
            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let deliveryType = document.getElementById('order-delivery-type')?.value || '';
            let deliveryFee = deliveryType.includes('منزل') ? 600 : 400;
            let total = subtotal + deliveryFee;
            let totalEl = document.getElementById('cart-final-total');
            if(totalEl) totalEl.innerText = total + ' دج';
        }

        window.submitCartOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilaya = document.getElementById('order-wilaya').value;
            let commune = document.getElementById('order-commune').value.trim();
            let deliveryType = document.getElementById('order-delivery-type').value;

            if(!fullName || !phone || !commune) {
                alert('الرجاء تعبئة الاسم، رقم الهاتف، والعنوان بالتفصيل!');
                return;
            }

            localStorage.setItem('dz_user_name', fullName);
            localStorage.setItem('dz_user_phone', phone);

            let subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            let deliveryFee = deliveryType.includes('منزل') ? 600 : 400;
            let finalTotal = subtotal + deliveryFee;

            let orderedItemsForReview = [...cart];

            try {
                for(let item of cart) {
                    await addDoc(collection(db, "orders"), {
                        productName: item.productName,
                        unitPrice: item.price,
                        quantity: item.quantity,
                        fullName,
                        phone,
                        wilaya,
                        commune,
                        deliveryType,
                        finalTotal,
                        status: 'جديد ⏳',
                        createdAt: new Date()
                    });
                }

                cart = [];
                document.getElementById('cart-count').innerText = '0';
                showOrderSuccessAndReviewModal(fullName, phone, orderedItemsForReview);

            } catch(e) {
                alert('فشل إرسال الطلب، حاول مرة أخرى.');
            }
        }

        function showOrderSuccessAndReviewModal(clientName, clientPhone, orderedItems) {
            let cardModalContent = document.getElementById('cart-modal-card-content');
            
            let reviewsHtml = '';
            orderedItems.forEach((item, idx) => {
                reviewsHtml += `
                    <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:12px; border-radius:8px; margin-bottom:12px;">
                        <p style="margin:0 0 8px 0; font-weight:bold; color:#1e293b;">📦 ${item.productName}</p>
                        <div class="form-group">
                            <label style="font-size:12px;">التقييم بالنجوم ⭐:</label>
                            <select id="success-rating-${idx}">
                                <option value="5">⭐⭐⭐⭐⭐ (ممتاز)</option>
                                <option value="4">⭐⭐⭐⭐ (جيد جداً)</option>
                                <option value="3">⭐⭐⭐ (متوسط)</option>
                                <option value="2">⭐⭐ (ضعيف)</option>
                                <option value="1">⭐ (سيء)</option>
                            </select>
                        </div>
                        <div class="form-group" style="margin-bottom:0;">
                            <textarea id="success-comment-${idx}" placeholder="اكتب تعليقك حول هذا المنتج..." style="height:50px; font-size:13px;"></textarea>
                        </div>
                    </div>
                `;
            });

            cardModalContent.innerHTML = `
                <div style="text-align:center;">
                    <h2 style="color:#16a34a; margin-top:0;">🎉 تم إرسال طلبك بنجاح يا ${clientName}!</h2>
                    <p style="color:#475569; font-size:14px; line-height:1.5;">سنتصل بك قريباً للتأكيد. نود معرفة رأيك وتقييمك للمنتجات:</p>
                </div>
                ${reviewsHtml}
                <button onclick='submitPostOrderReviews(${JSON.stringify(orderedItems).replace(/'/g, "&apos;")}, "${clientName}", "${clientPhone}")' style="background:#2563eb; width:100%; padding:12px; font-size:15px; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">إرسال التقييم 🚀</button>
            `;
        }

        window.submitPostOrderReviews = function(orderedItems, clientName, clientPhone) {
            let todayStr = new Date().toISOString().split('T')[0];
            let reviewLimitKey = `dz_review_limit_${clientPhone}_${todayStr}`;

            if(localStorage.getItem(reviewLimitKey)) {
                showThankYouMessage();
                return;
            }

            let hasSubmittedAny = false;
            orderedItems.forEach((item, idx) => {
                let rating = document.getElementById(`success-rating-${idx}`).value;
                let comment = document.getElementById(`success-comment-${idx}`).value.trim();

                if(comment && item.id) {
                    let reviewsKey = `dz_reviews_${item.id}`;
                    let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
                    reviews.push({ name: clientName, rating, comment, date: new Date().toLocaleDateString('ar-DZ'), hidden: false });
                    localStorage.setItem(reviewsKey, JSON.stringify(reviews));
                    hasSubmittedAny = true;
                }
            });

            if(hasSubmittedAny) {
                localStorage.setItem(reviewLimitKey, 'true');
            }

            showThankYouMessage();
        }

        function showThankYouMessage() {
            let cardModalContent = document.getElementById('cart-modal-card-content');
            cardModalContent.innerHTML = `
                <div style="text-align:center; padding: 20px 0;">
                    <h2 style="color:#16a34a; font-size:24px; margin-bottom:10px;">🙏 شكراً على طلبكم!</h2>
                    <p style="color:#475569; font-size:15px; margin-bottom:25px;">نحن ندرك قيمتكم ونسعد بخدمتكم دائماً.</p>
                    
                    <div style="display:flex; gap:10px;">
                        <button onclick="document.getElementById('cartModal').style.display='none'" style="background:#64748b; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">إلغاء / إغلاق ❌</button>
                        <button onclick="location.reload()" style="background:#2563eb; color:white; flex:1; padding:12px; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">التسوق من جديد 🛍️</button>
                    </div>
                </div>
            `;
        }

        window.renderReviews = function(productId) {
            let container = document.getElementById('reviews-list-container');
            if(!container) return;
            let reviewsKey = `dz_reviews_${productId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            let visibleReviews = reviews.filter(r => !r.hidden);

            if(visibleReviews.length === 0) {
                container.innerHTML = '<p style="font-size:12px; color:#64748b;">لا توجد تعليقات ظاهرة بعد لهذا المنتج.</p>';
                return;
            }
            let html = '';
            reviews.forEach((r, originalIndex) => {
                if(r.hidden) return;
                let stars = '⭐'.repeat(Number(r.rating));
                html += `
                    <div class="review-box">
                        <div>
                            <div style="display:flex; justify-content:space-between; margin-bottom:3px; gap:15px;">
                                <b>👤 ${r.name}</b>
                                <span style="font-size:11px; color:#64748b;">${r.date}</span>
                            </div>
                            <div class="rating-stars" style="font-size:13px;">${stars}</div>
                            <p style="margin:0; color:#333;">${r.comment}</p>
                        </div>
                        <button onclick="deleteProductReview('${productId}', ${originalIndex})" style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">حذف 🗑️</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        window.deleteProductReview = function(productId, index) {
            let reviewsKey = `dz_reviews_${productId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            reviews.splice(index, 1);
            localStorage.setItem(reviewsKey, JSON.stringify(reviews));
            renderReviews(productId);
            alert('تم حذف التعليق بنجاح!');
        }
    </script>
</body>
