<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="store-title-tag">متجري العالمي - Amazon Style</title>
    <style>
        :root { --primary: #131921; --secondary: #232f3e; --accent: #febd69; --accent-hover: #f3a847; --success: #007600; --danger: #b12704; --bg: #eaeded; --card-bg: #ffffff; --border: #d5d9d9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #0f1111; }
        
        header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 22px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; }
        .logo span { color: var(--accent); }
        
        .header-search-bar { flex: 2; display: flex; max-width: 650px; background: white; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
        .header-search-bar:focus-within { border-color: var(--accent); }
        .header-search-bar select { background: #f3f3f3; border: none; padding: 10px; font-size: 13px; color: #555; outline: none; border-left: 1px solid var(--border); cursor: pointer; }
        .header-search-bar input { flex: 1; padding: 10px 15px; border: none; font-size: 14px; outline: none; }
        .header-search-btn { background: var(--accent); border: none; padding: 0 20px; cursor: pointer; font-size: 16px; font-weight: bold; color: #111; }

        .header-actions { display: flex; gap: 15px; align-items: center; }
        .cart-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; transition: 0.2s; }
        .cart-btn:hover { border-color: white; }
        .admin-btn { background: #f59e0b; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; }

        .store-sub-nav { background: var(--secondary); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; color: white; font-size: 14px; }
        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .cat-chip { background: rgba(255,255,255,0.1); border: 1px solid transparent; padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; color: white; }
        .cat-chip.active, .cat-chip:hover { background: var(--accent); color: #111; font-weight: bold; }

        .filter-sort-group { display: flex; gap: 10px; align-items: center; }
        .filter-sort-group select { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; background: white; outline: none; cursor: pointer; }

        .container { max-width: 1250px; margin: auto; padding: 25px 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        
        .product-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .product-img-wrap { width: 100%; height: 200px; background: #fff; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 15px; font-weight: 600; margin: 0 0 6px 0; color: #0f1111; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-category { font-size: 12px; color: #565959; margin-bottom: 6px; }
        
        .stars-row { color: #ffa41c; font-size: 13px; margin-bottom: 6px; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .new-price { color: var(--danger); font-weight: bold; font-size: 18px; }
        
        .qty-selector { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; background: #f0f2f2; padding: 4px; border-radius: 6px; border: 1px solid #d5d9d9; }
        .qty-btn { background: white; border: 1px solid #d5d9d9; width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .qty-input { width: 35px; text-align: center; border: none; background: transparent; font-weight: bold; font-size: 13px; outline: none; }

        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-cart { background: #ffd814; border: 1px solid #fcd200; padding: 8px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 13px; color: #0f1111; transition: 0.2s; }
        .btn-cart:hover { background: #f7ca00; }
        .btn-buy { background: #ffa41c; border: 1px solid #ff8f00; color: #0f1111; padding: 8px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 13px; transition: 0.2s; }

        /* صفحة تفاصيل المنتج الكاملة */
        #product-detail-view { display: none; background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .detail-grid { display: grid; grid-template-columns: 1fr 1.2fr 350px; gap: 30px; align-items: start; }
        @media(max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
        
        .detail-img-container { text-align: center; background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
        .detail-main-img { max-width: 100%; height: 350px; object-fit: contain; }
        .detail-thumbnails { display: flex; gap: 10px; justify-content: center; margin-top: 15px; overflow-x: auto; }
        .detail-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; transition: 0.2s; }
        .detail-thumb.active { border-color: var(--accent); }

        .detail-info h1 { margin: 0 0 10px 0; font-size: 24px; color: #0f1111; }
        .detail-price { font-size: 26px; color: var(--danger); font-weight: bold; margin: 15px 0; }
        .detail-desc { font-size: 15px; line-height: 1.8; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }
        
        .variant-box { margin-bottom: 15px; background: #f0f2f2; padding: 12px; border-radius: 8px; }
        .variant-box label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 6px; }
        .variant-box select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--border); background: white; }

        .buybox-card { background: #f8f9fa; border: 1px solid var(--border); padding: 20px; border-radius: 12px; }

        .cart-drawer { position: fixed; top: 0; left: -400px; width: 380px; height: 100%; background: white; z-index: 3000; box-shadow: 5px 0 25px rgba(0,0,0,0.15); transition: left 0.3s ease; display: flex; flex-direction: column; }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-body { padding: 20px; flex: 1; overflow-y: auto; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: #f8fafc; }
        .cart-item { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .cart-item img { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; }

        .review-card { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; border: 1px solid var(--border); }
        .related-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
        .related-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; }
        .related-card img { width: 100%; height: 120px; object-fit: contain; border-radius: 6px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 15px; box-sizing: border-box; }
        .modal-card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="backToHome()">🛍️ <span id="header-store-name">متجري</span> <span>العالمي</span></div>
        <div class="header-search-bar">
            <select id="search-category-select" onchange="triggerAdvancedSearch()"><option value="الكل">كل الأقسام</option></select>
            <input type="text" id="global-search-input" placeholder="ابحث عن أي منتج، وصف، مميزات..." onkeyup="triggerAdvancedSearch()">
            <button class="header-search-btn" onclick="triggerAdvancedSearch()">🔍</button>
        </div>
        <div class="header-actions">
            <button class="cart-btn" onclick="toggleCartDrawer()">🛒 السلة (<span id="cart-count">0</span>)</button>
            <a href="admin.html" class="admin-btn">🔐 لوحة التحكم</a>
        </div>
    </header>

    <div class="store-sub-nav">
        <div class="categories-bar" id="categories-container"><div class="cat-chip active" onclick="filterByCategory('الكل', this)">الكل</div></div>
        <div class="filter-sort-group">
            <label style="color:white; margin:0; font-size:13px;">ترتيب حسب:</label>
            <select id="sort-products-select" onchange="sortProductsList()">
                <option value="default">الافتراضي</option>
                <option value="price-low">السعر: من الأرخص للأغلى</option>
                <option value="price-high">السعر: من الأغلى للأرخص</option>
                <option value="rating">التقييم الأعلى ⭐</option>
            </select>
        </div>
    </div>

    <div class="container">
        <div id="home-view">
            <h2 style="margin-top:0; font-size:22px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">🔥 المنتجات والعروض المميزة</h2>
            <div id="store-products-grid" class="products-grid">جاري تحميل المنتجات...</div>
        </div>

        <div id="product-detail-view">
            <button onclick="backToHome()" style="background:#232f3e; color:white; border:none; padding:8px 16px; border-radius:6px; font-weight:bold; cursor:pointer; margin-bottom:20px;">← العودة للقائمة</button>
            <div id="detail-content-area"></div>
        </div>
    </div>

    <div class="cart-drawer" id="cartDrawer">
        <div class="cart-header">
            <h3 style="margin:0;">🛒 سلة المشتريات</h3>
            <button onclick="toggleCartDrawer()" style="background:transparent; color:white; border:none; font-size:18px; cursor:pointer;">✕</button>
        </div>
        <div class="cart-body" id="cart-items-list">سلة المشتريات فارغة.</div>
        <div class="cart-footer">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px; font-size:16px; font-weight:bold;">
                <span>المجموع:</span>
                <span id="cart-total-price" style="color:var(--danger);">0 دج</span>
            </div>
            <button onclick="openCheckoutFromCart()" style="background:#ffd814; border:1px solid #fcd200; color:#0f1111; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:15px;">إتمام الطلب السريع 🚀</button>
        </div>
    </div>

    <div class="modal-overlay" id="checkoutModal">
        <div class="modal-card" id="checkout-modal-body">
            <h3 style="margin-top:0; border-bottom:1px solid var(--border); padding-bottom:10px;">📋 تأكيد الطلب ومعلومات التوصيل (58 ولاية)</h3>
            <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname"></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="order-phone"></div>
            <div class="form-group">
                <label>الولاية:</label>
                <select id="order-wilaya" onchange="updateShippingFees()">
                    <option value="16|الجزائر" selected>16 - الجزائر العاصمة</option>
                    <option value="02|الشلف">02 - الشلف</option>
                    <option value="31|وهران">31 - وهران</option>
                    <option value="25|قسنطينة">25 - قسنطينة</option>
                    <option value="05|باتنة">05 - باتنة</option>
                    <option value="19|سطيف">19 - سطيف</option>
                </select>
            </div>
            <div class="form-group"><label>العنوان التفصيلي / البلدية:</label><input type="text" id="order-commune"></div>
            <div class="form-group">
                <label>نوع التوصيل:</label>
                <select id="order-delivery-type" onchange="updateShippingFees()">
                    <option value="home">توصيل للمنزل 🏠</option>
                    <option value="desk">توصيل للمكتب (Stop-Desk) 🏢</option>
                </select>
            </div>
            <div style="background:#f1f5f9; padding:12px; border-radius:8px; margin-bottom:15px; font-size:15px;">
                📦 المنتجات: <b id="subtotal-display">0 دج</b> | 🚚 التوصيل: <b id="shipping-display">0 دج</b><br>
                <hr style="border:0; border-top:1px solid #cbd5e1; margin:6px 0;">
                💰 <b>المجموع الكلي:</b> <span id="checkout-final-total" style="color:var(--danger); font-weight:bold; font-size:18px;">0</span> دج
            </div>
            <button onclick="submitOrder()" style="background:#ffd814; border:1px solid #fcd200; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">تأكيد الطلب 🚀</button>
            <button onclick="document.getElementById('checkoutModal').style.display='none'" style="background:#64748b; color:white; border:none; width:100%; padding:10px; border-radius:8px; margin-top:8px; cursor:pointer;">إغلاق</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [], filteredProducts = [], cart = [], activeCategory = 'الكل', detailCurrentQty = 1, selectedProductForDetail = null, checkoutType = 'single';

        window.addEventListener('DOMContentLoaded', () => {
            let savedName = localStorage.getItem('dz_store_name');
            if(savedName) {
                document.getElementById('header-store-name').innerText = savedName;
                document.getElementById('store-title-tag').innerText = savedName + ' - المتجر';
            }
            loadStoreData();
        });

        async function loadStoreData() {
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                let categoriesSet = new Set(['الكل']);
                snap.forEach(d => {
                    const p = { id: d.id, ...d.data() };
                    allProducts.push(p);
                    if(p.category) categoriesSet.add(p.category);
                });
                filteredProducts = [...allProducts];
                let catContainer = document.getElementById('categories-container');
                let searchCatSelect = document.getElementById('search-category-select');
                catContainer.innerHTML = ''; searchCatSelect.innerHTML = '<option value="الكل">كل الأقسام</option>';
                categoriesSet.forEach(cat => {
                    let active = cat === 'الكل' ? 'active' : '';
                    catContainer.innerHTML += `<div class="cat-chip ${active}" onclick="filterByCategory('${cat}', this)">${cat}</div>`;
                    if(cat !== 'الكل') searchCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                });
                renderProducts(filteredProducts);
            } catch(e) {}
        }

        window.renderProducts = function(products) {
            const grid = document.getElementById('store-products-grid');
            grid.innerHTML = '';
            if(products.length === 0) { grid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">لا توجد منتجات.</p>'; return; }
            products.forEach(p => {
                let img = (p.imageUrls && p.imageUrls.length > 0) ? p.imageUrls[0] : 'https://via.placeholder.com/200';
                grid.innerHTML += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <div class="product-img-wrap"><img src="${img}" class="product-img"></div>
                        <div class="product-body">
                            <span class="product-category">${p.category || 'عام'}</span>
                            <h3 class="product-title">${p.name}</h3>
                            <div class="price-row"><span class="new-price">${p.price} دج</span></div>
                            <div class="qty-selector" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="changeCardQty('${p.id}', -1)">-</button>
                                <input type="text" id="card-qty-${p.id}" class="qty-input" value="1" readonly>
                                <button class="qty-btn" onclick="changeCardQty('${p.id}', 1)">+</button>
                            </div>
                            <div class="card-actions" onclick="event.stopPropagation()">
                                <button class="btn-cart" onclick="addCardToCart('${p.id}')">السلة 🛒</button>
                                <button class="btn-buy" onclick="buyNowDirect('${p.id}')">شراء ⚡</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.changeCardQty = function(id, delta) {
            let input = document.getElementById(`card-qty-${id}`);
            let val = Number(input.value) + delta;
            if(val < 1) val = 1;
            input.value = val;
        }

        window.addCardToCart = function(id) {
            let product = allProducts.find(p => p.id === id);
            let qty = Number(document.getElementById(`card-qty-${id}`).value) || 1;
            if(!product) return;
            let existing = cart.find(item => item.id === id);
            if(existing) existing.qty += qty; else cart.push({ ...product, qty });
            updateCartUI();
            alert('تمت الإضافة للسلة بنجاح!');
        }

        window.triggerAdvancedSearch = function() {
            let query = document.getElementById('global-search-input').value.toLowerCase().trim();
            let selectedCat = document.getElementById('search-category-select').value;
            filteredProducts = allProducts.filter(p => {
                let matchCat = (selectedCat === 'الكل' || p.category === selectedCat);
                if(activeCategory !== 'الكل' && p.category !== activeCategory) matchCat = false;
                if(!matchCat) return false;
                if(!query) return true;
                return p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
            });
            renderProducts(filteredProducts);
        }

        window.filterByCategory = function(category, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            activeCategory = category;
            document.getElementById('search-category-select').value = category;
            triggerAdvancedSearch();
        }

        window.openProductDetail = async function(id) {
            let docSnap = await getDoc(doc(db, "products", id));
            if(!docSnap.exists()) return;
            selectedProductForDetail = { id: docSnap.id, ...docSnap.data() };
            let p = selectedProductForDetail;
            detailCurrentQty = 1;

            let images = (p.imageUrls && p.imageUrls.length > 0) ? p.imageUrls : ['https://via.placeholder.com/350'];
            let thumbs = images.map((img, idx) => `<img src="${img}" class="detail-thumb ${idx===0?'active':''}" onclick="document.getElementById('main-detail-img').src='${img}'">`).join('');

            // التوابع المخصصة حسب الصنف (مثل الملابس: الألوان والمقاسات)
            let variantsHtml = '';
            if(p.variants) {
                if(p.variants.colors && p.variants.colors.length > 0) {
                    variantsHtml += `<div class="variant-box"><label>اختر اللون:</label><select id="selected-color">${p.variants.colors.map(c=>`<option value="${c}">${c}</option>`).join('')}</select></div>`;
                }
                if(p.variants.sizes && p.variants.sizes.length > 0) {
                    variantsHtml += `<div class="variant-box"><label>اختر المقاس:</label><select id="selected-size">${p.variants.sizes.map(s=>`<option value="${s}">${s}</option>`).join('')}</select></div>`;
                }
            }

            let detailHtml = `
                <div class="detail-grid">
                    <div>
                        <div class="detail-img-container"><img src="${images[0]}" id="main-detail-img" class="detail-main-img"></div>
                        <div class="detail-thumbnails">${thumbs}</div>
                    </div>
                    <div>
                        <h1>${p.name}</h1>
                        <p style="color:#007185;">التصنيف: <b>${p.category || 'عام'}</b></p>
                        <div class="detail-price">${p.price} دج</div>
                        ${variantsHtml}
                        <div class="detail-desc">${p.description || 'منتج أصلي عالي الجودة مع ضمان التوصيل.'}</div>
                    </div>
                    <div>
                        <div class="buybox-card">
                            <div style="font-size:22px; color:var(--danger); font-weight:bold; margin-bottom:15px;">${p.price} دج</div>
                            <div class="qty-selector" style="margin-bottom:15px;">
                                <button class="qty-btn" onclick="changeDetailQty(-1)">-</button>
                                <input type="text" id="detail-qty-input" class="qty-input" value="1" readonly>
                                <button class="qty-btn" onclick="changeDetailQty(1)">+</button>
                            </div>
                            <button onclick="addDetailItemToCart()" style="background:#ffd814; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:10px;">إضافة للسلة 🛒</button>
                            <button onclick="buyNowFromDetail()" style="background:#ffa41c; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">شراء الآن ⚡</button>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('detail-content-area').innerHTML = detailHtml;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('product-detail-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.changeDetailQty = function(delta) {
            detailCurrentQty += delta;
            if(detailCurrentQty < 1) detailCurrentQty = 1;
            document.getElementById('detail-qty-input').value = detailCurrentQty;
        }

        window.addDetailItemToCart = function() {
            if(!selectedProductForDetail) return;
            let existing = cart.find(item => item.id === selectedProductForDetail.id);
            if(existing) existing.qty += detailCurrentQty; else cart.push({ ...selectedProductForDetail, qty: detailCurrentQty });
            updateCartUI();
            alert('تمت الإضافة للسلة!');
        }

        window.buyNowDirect = function(id) {
            selectedProductForDetail = allProducts.find(item => item.id === id);
            detailCurrentQty = Number(document.getElementById(`card-qty-${id}`).value) || 1;
            checkoutType = 'single';
            openCheckoutModal();
        }

        window.buyNowFromDetail = function() {
            if(!selectedProductForDetail) return;
            checkoutType = 'single';
            openCheckoutModal();
        }

        window.openCheckoutFromCart = function() {
            if(cart.length === 0) { alert('السلة فارغة!'); return; }
            checkoutType = 'cart';
            toggleCartDrawer();
            openCheckoutModal();
        }

        window.toggleCartDrawer = function() { document.getElementById('cartDrawer').classList.toggle('open'); }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            let listDiv = document.getElementById('cart-items-list');
            let total = 0; listDiv.innerHTML = '';
            if(cart.length === 0) { listDiv.innerHTML = '<p style="text-align:center;">السلة فارغة.</p>'; document.getElementById('cart-total-price').innerText = '0 دج'; return; }
            cart.forEach((item, index) => {
                total += (item.price * item.qty);
                listDiv.innerHTML += `<div class="cart-item"><img src="${item.imageUrls?.[0]||''}" style="width:50px;height:50px;object-fit:cover;"><div style="flex:1;"><b>${item.name}</b><br>${item.price} دج × ${item.qty}</div><button onclick="cart.splice(${index},1);updateCartUI();" style="background:none;border:none;color:red;cursor:pointer;">✕</button></div>`;
            });
            document.getElementById('cart-total-price').innerText = total + ' دج';
        }

        window.openCheckoutModal = function() { updateShippingFees(); document.getElementById('checkoutModal').style.display = 'flex'; }

        window.updateShippingFees = function() {
            let subtotal = checkoutType === 'single' ? (selectedProductForDetail.price * detailCurrentQty) : cart.reduce((sum, i)=>sum+(i.price*i.qty),0);
            let shipping = document.getElementById('order-delivery-type').value === 'home' ? 600 : 400;
            document.getElementById('subtotal-display').innerText = subtotal + ' دج';
            document.getElementById('shipping-display').innerText = shipping + ' دج';
            document.getElementById('checkout-final-total').innerText = subtotal + shipping;
        }

        window.submitOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let commune = document.getElementById('order-commune').value.trim();
            if(!fullName || !phone || !commune) { alert('الرجاء إكمال بيانات التوصيل!'); return; }
            
            let orderData = {
                fullName, phone, commune,
                wilaya: document.getElementById('order-wilaya').value.split('|')[1],
                deliveryType: document.getElementById('order-delivery-type').value,
                finalTotal: Number(document.getElementById('checkout-final-total').innerText),
                productName: checkoutType === 'single' ? selectedProductForDetail.name : cart.map(i=>i.name).join(', '),
                quantity: checkoutType === 'single' ? detailCurrentQty : cart.reduce((s,i)=>s+i.qty,0),
                status: 'جديد ⏳', createdAt: new Date()
            };
            await addDoc(collection(db, "orders"), orderData);
            alert('تم إرسال الطلب بنجاح!');
            document.getElementById('checkoutModal').style.display = 'none';
        }

        window.backToHome = function() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
        }
    </script>
</body>
</html>
