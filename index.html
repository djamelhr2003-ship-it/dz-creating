<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متجرك العالمي | التسوق الذكي في الجزائر</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#0b0f0e;--card:#131a17;--card-hover:#192420;--tx:#f5f2ea;--mu:#9ba79f;--accent:#d9b65c;--border:rgba(255,255,255,.08);--danger:#ef4444;--success:#22c55e}
body{background:var(--bg);color:var(--tx);font-family:Cairo,sans-serif;margin:0;padding:0;box-sizing:border-box}
*, *:before, *:after{box-sizing:inherit}

.top-bar{background:var(--accent);color:#111;text-align:center;padding:8px;font-size:0.85rem;font-weight:800}
header{display:flex;justify-content:space-between;align-items:center;padding:15px 30px;background:rgba(11,15,14,.95);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
header h1{margin:0;color:var(--accent);font-size:1.4rem}
.nav-links{display:flex;gap:12px;align-items:center}
.btn-cart, .admin-link{background:var(--card);color:var(--tx);border:1px solid var(--border);padding:8px 14px;border-radius:10px;text-decoration:none;font-size:0.85rem;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px}
.btn-cart:hover, .admin-link:hover{border-color:var(--accent);color:var(--accent)}

.hero{text-align:center;padding:50px 20px;background:radial-gradient(circle at center,rgba(217,182,92,.07),transparent 70%)}
.hero h2{font-size:2.3rem;margin:0 0 10px;color:var(--accent)}
.hero p{color:var(--mu);margin:0}

.container{max-width:1200px;margin:auto;padding:20px}
.filters-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:15px;margin-bottom:30px}
.search-box{flex:1;min-width:250px;background:var(--card);border:1px solid var(--border);border-radius:30px;padding:10px 20px;display:flex;align-items:center}
.search-box input{background:none;border:0;color:var(--tx);width:100%;font-family:inherit;outline:none;font-size:0.95rem}
.categories{display:flex;gap:10px;overflow-x:auto;padding-bottom:5px}
.cat-btn{background:var(--card);border:1px solid var(--border);color:var(--mu);padding:8px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-size:0.85rem;white-space:nowrap;transition:.2s}
.cat-btn.active, .cat-btn:hover{background:var(--accent);color:#111;border-color:var(--accent);font-weight:bold}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s}
.card:hover{border-color:var(--accent);transform:translateY(-3px);background:var(--card-hover)}
.card h3{margin:10px 0 5px;font-size:1.15rem}
.desc{color:var(--mu);font-size:0.8rem;margin-bottom:15px;min-height:35px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.price{color:var(--accent);font-weight:800;font-size:1.25rem}
.badge{background:rgba(217,182,92,.1);color:var(--accent);padding:4px 8px;border-radius:6px;font-size:0.75rem}
.btn{background:linear-gradient(90deg,#d9b65c,#f2d98c);color:#111;border:0;padding:12px;font-weight:800;border-radius:10px;cursor:pointer;width:100%;font-family:inherit;transition:.2s}
.btn:hover{opacity:.9}

/* السلة المنبثقة (Drawer) */
.cart-drawer{position:fixed;top:0;left:-400px;width:380px;height:100%;background:#0e1412;border-left:1px solid var(--border);z-index:1000;transition:.3s;display:flex;flex-direction:column;box-shadow:-5px 0 25px rgba(0,0,0,0.5)}
.cart-drawer.open{left:0}
.cart-header{padding:20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.cart-body{flex:1;overflow-y:auto;padding:20px}
.cart-footer{padding:20px;border-top:1px solid var(--border);background:var(--card)}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:15px;border-bottom:1px solid var(--border);font-size:0.85rem}
.qty-controls{display:flex;gap:8px;align-items:center;margin-top:5px}
.qty-btn{background:var(--card);border:1px solid var(--border);color:var(--tx);width:24px;height:24px;border-radius:6px;cursor:pointer;font-weight:bold}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;z-index:900;backdrop-filter:blur(3px)}

/* مودال اتمام الطلب */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;justify-content:center;align-items:center;z-index:1100;padding:15px}
.modal-content{background:var(--card);border:1px solid var(--border);padding:30px;border-radius:20px;width:100%;max-width:480px;position:relative;box-sizing:border-box}
.close-modal{position:absolute;top:15px;left:20px;background:none;border:0;color:var(--mu);font-size:1.3rem;cursor:pointer}
.form-group{margin-bottom:15px;text-align:right}
.form-group label{display:block;margin-bottom:5px;color:var(--mu);font-size:0.85rem}
.form-control{width:100%;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;padding:10px;color:var(--tx);font-family:inherit;box-sizing:border-box}
.form-control:focus{outline:none;border-color:var(--accent)}
select.form-control option{background:#131a17;color:#fff}
</style>
</head>
<body>

<div class="top-bar">
  🔥 توصيل سريع ودفع عند الاستلام لـ 58 ولاية جزائرية 🇩🇿 ضمان جودة 100%
</div>

<header>
  <h1>متجرك العالمي 🛍️</h1>
  <div class="nav-links">
    <button class="btn-cart" onclick="toggleCart()">🛒 السلة (<span id="cartCount">0</span>)</button>
    <a href="admin.html" class="admin-link">🔐 لوحة التحكم</a>
  </div>
</header>

<div class="hero">
  <h2>تسوق بذكاء وبثقة تامة</h2>
  <p>أفضل المنتجات العالمية والمحلية بين يديك</p>
</div>

<div class="container">
  <div class="filters-bar">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="ابحث عن منتج، اسم، أو مواصفات..." oninput="filterProducts()">
    </div>
    <div class="categories" id="categoriesContainer">
      <button class="cat-btn active" onclick="filterCategory('الكل', this)">الكل</button>
      <button class="cat-btn" onclick="filterCategory('إلكترونيات', this)">📱 إلكترونيات</button>
      <button class="cat-btn" onclick="filterCategory('منزل', this)">🏠 أدوات منزلية</button>
      <button class="cat-btn" onclick="filterCategory('إكسسوارات', this)">⌚ إكسسوارات</button>
    </div>
  </div>

  <div class="grid" id="storeGrid"></div>
</div>

<!-- السلة الجانبية المنبثقة -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-header">
    <h3 style="margin:0;color:var(--accent);">سلة الشراء</h3>
    <button onclick="toggleCart()" style="background:none;border:0;color:var(--mu);font-size:1.2rem;cursor:pointer">✕</button>
  </div>
  <div class="cart-body" id="cartItemsList">
    <p style="text-align:center;color:var(--mu);margin-top:50px;">سلتك فارغة حالياً</p>
  </div>
  <div class="cart-footer">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px;font-weight:bold;">
      <span>المجموع الإجمالي:</span>
      <span id="cartTotal" style="color:var(--accent);">0 دج</span>
    </div>
    <button class="btn" onclick="openCheckout()">إتمام الطلب الآن 🚀</button>
  </div>
</div>

<!-- نافذة إتمام الطلب الشاملة -->
<div class="modal" id="checkoutModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeCheckout()">✕</button>
    <h3 style="color:var(--accent);margin-top:0;">إتمام الطلب (الدفع عند الاستلام)</h3>
    <div class="form-group">
      <label>الاسم واللقب:</label>
      <input type="text" id="clientName" class="form-control" placeholder="الاسم الكامل">
    </div>
    <div class="form-group">
      <label>رقم الهاتف النقال:</label>
      <input type="tel" id="clientPhone" class="form-control" placeholder="05 / 06 / 07 ...">
    </div>
    <div class="form-group">
      <label>الولاية:</label>
      <select id="clientWilaya" class="form-control">
        <option value="">اختر ولايتك...</option>
        <option value="01 أدرار">01 - أدرار</option>
        <option value="02 الشلف">02 - الشلف</option>
        <option value="03 الأغواط">03 - الأغواط</option>
        <option value="04 أم البواقي">04 - أم البواقي</option>
        <option value="05 باتنة">05 - باتنة</option>
        <option value="06 بجاية">06 - بجاية</option>
        <option value="07 بسكرة">07 - بسكرة</option>
        <option value="08 بشار">08 - بشار</option>
        <option value="09 البليدة">09 - البليدة</option>
        <option value="10 البويرة">10 - البويرة</option>
        <option value="16 الجزائر">16 - الجزائر العاصمة</option>
        <option value="31 وهران">31 - وهران</option>
        <option value="أخرى">ولاية أخرى (تحديد في العنوان)</option>
      </select>
    </div>
    <div class="form-group">
      <label>عنوان التوصيل المفصل (البلدية والحي):</label>
      <input type="text" id="clientAddress" class="form-control" placeholder="العنوان بالتفصيل">
    </div>
    <button class="btn" onclick="submitOrder()">تأكيد الطلب نهائياً 📦</button>
  </div>
</div>

<script>
const DB = {
  getProducts: function() {
    let saved = localStorage.getItem("store_products");
    if(saved) {
      return JSON.parse(saved);
    } else {
      let defaults = [
        {id: 1, name: "ساعة ذكية Ultra Series", price: 4500, category: "إلكترونيات", desc: "شاشة عالية الدقة، تدعم المكالمات والرياضة."},
        {id: 2, name: "سماعات بلوتوث لاسلكية Pro", price: 2800, category: "إلكترونيات", desc: "صوت نقي ستيريو مع بطارية تدوم طويلاً."},
        {id: 3, name: "حامل هاتف للسيارة ذكي", price: 1600, category: "إكسسوارات", desc: "ثبات قوي وقابل للتعديل بسهولة."},
        {id: 4, name: "منظم مطبخ ابتكاري", price: 2200, category: "منزل", desc: "توفير مساحة أنيق وعملي للمطبخ."}
      ];
      localStorage.setItem("store_products", JSON.stringify(defaults));
      return defaults;
    }
  },
  saveOrder: function(order) {
    let orders = JSON.parse(localStorage.getItem("store_orders")) || [];
    order.id = Date.now();
    order.date = new Date().toLocaleString('ar-DZ');
    order.status = "جديد";
    orders.push(order);
    localStorage.setItem("store_orders", JSON.stringify(orders));
  }
};

let cart = JSON.parse(localStorage.getItem("store_cart")) || [];
let currentCategory = "الكل";

function renderStore(productsToRender) {
  let products = productsToRender || DB.getProducts();
  let grid = document.getElementById("storeGrid");
  
  if(products.length === 0) {
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--mu);padding:40px;">لا توجد منتجات مطابقة للبحث.</p>`;
    return;
  }

  let html = "";
  products.forEach(p => {
    html += `
      <div class="card">
        <div>
          <span class="badge">${p.category || 'عام'}</span>
          <h3>${p.name}</h3>
          <p class="desc">${p.desc || ''}</p>
        </div>
        <div>
          <div class="price-row">
            <span class="price">${Number(p.price).toLocaleString()} دج</span>
          </div>
          <button class="btn" onclick="addToCart(${p.id})">أضف للسلة 🛒</button>
        </div>
      </div>
    `;
  });
  grid.innerHTML = html;
  updateCartUI();
}

function filterCategory(cat, btn) {
  currentCategory = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterProducts();
}

function filterProducts() {
  let query = document.getElementById("searchInput").value.toLowerCase();
  let products = DB.getProducts();
  
  let filtered = products.filter(p => {
    let matchCat = (currentCategory === "الكل" || p.category === currentCategory);
    let matchQuery = p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query));
    return matchCat && matchQuery;
  });
  
  renderStore(filtered);
}

function addToCart(productId) {
  let products = DB.getProducts();
  let product = products.find(p => p.id === productId);
  if(!product) return;

  let existing = cart.find(item => item.id === productId);
  if(existing) {
    existing.qty += 1;
  } else {
    cart.push({...product, qty: 1});
  }
  saveCart();
  toggleCart();
}

function changeQty(productId, delta) {
  let item = cart.find(i => i.id === productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0) {
    cart = cart.filter(i => i.id !== productId);
  }
  saveCart();
  updateCartUI();
}

function saveCart() {
  localStorage.setItem("store_cart", JSON.stringify(cart));
  updateCartUI();
}

function updateCartUI() {
  let totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
  document.getElementById("cartCount").innerText = totalCount;

  let listEl = document.getElementById("cartItemsList");
  let totalEl = document.getElementById("cartTotal");

  if(cart.length === 0) {
    listEl.innerHTML = `<p style="text-align:center;color:var(--mu);margin-top:50px;">سلتك فارغة حالياً</p>`;
    totalEl.innerText = "0 دج";
    return;
  }

  let html = "";
  let totalSum = 0;
  cart.forEach(item => {
    totalSum += (item.price * item.qty);
    html += `
      <div class="cart-item">
        <div>
          <b>${item.name}</b><br>
          <span style="color:var(--accent);">${item.price.toLocaleString()} دج</span>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
          </div>
        </div>
        <div><b>${(item.price * item.qty).toLocaleString()} دج</b></div>
      </div>
    `;
  });
  listEl.innerHTML = html;
  totalEl.innerText = totalSum.toLocaleString() + " دج";
}

function toggleCart() {
  let drawer = document.getElementById("cartDrawer");
  let overlay = document.getElementById("overlay");
  let isOpen = drawer.classList.contains("open");
  if(isOpen) {
    drawer.classList.remove("open");
    overlay.style.display = "none";
  } else {
    drawer.classList.add("open");
    overlay.style.display = "block";
  }
}

function openCheckout() {
  if(cart.length === 0) {
    alert("السلة فارغة!");
    return;
  }
  toggleCart();
  document.getElementById("checkoutModal").style.display = "flex";
}

function closeCheckout() {
  document.getElementById("checkoutModal").style.display = "none";
}

function submitOrder() {
  let name = document.getElementById("clientName").value.trim();
  let phone = document.getElementById("clientPhone").value.trim();
  let wilaya = document.getElementById("clientWilaya").value;
  let address = document.getElementById("clientAddress").value.trim();

  if(!name || !phone || !wilaya || !address) {
    alert("الرجاء ملء كافة معلومات التوصيل بدقة!");
    return;
  }

  let totalAmount = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  let productsSummary = cart.map(i => `${i.name} (×${i.qty})`).join(", ");

  DB.saveOrder({
    client: name,
    phone: phone,
    wilaya: wilaya,
    address: address,
    product: productsSummary,
    price: totalAmount
  });

  alert(`مبروك يا ${name}! تم إرسال طلبك بنجاح وسيتصل بك فريقنا للتأكيد قريباً.`);
  cart = [];
  saveCart();
  closeCheckout();
}

renderStore();
</script>

</body>
</html>
