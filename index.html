<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="pageTitle">متجر الجزائر السحابي - المنصة الاحترافية</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-area h1 { margin: 0; font-size: 22px; }
        .logo-area p { margin: 5px 0 0 0; color: #94a3b8; font-size: 12px; }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-lang, .btn-admin, .btn-cart {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn-lang:hover, .btn-admin:hover, .btn-cart:hover {
            background: rgba(255,255,255,0.2);
        }

        .filter-section {
            background: white;
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .search-bar {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            box-sizing: border-box;
        }

        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .cat-chip {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .cat-chip.active, .cat-chip:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .product-card:hover { transform: translateY(-4px); }

        .media-container {
            width: 100%;
            height: 200px;
            background: #000;
            position: relative;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info { padding: 15px; display: flex; flex-direction: column; flex-grow: 1; }
        .product-title { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; }
        .product-desc { font-size: 12px; color: var(--text-muted); margin: 0 0 10px 0; line-height: 1.4; flex-grow: 1; }
        
        .price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .price { color: var(--danger); font-weight: bold; font-size: 17px; }
        .stock-badge { font-size: 11px; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .stock-normal { background: #d1fae5; color: var(--success); }
        .stock-low { background: #fee2e2; color: var(--danger); }

        .card-buttons { display: flex; gap: 8px; }
        .btn-main { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-sec { background: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; padding: 8px; border-radius: 6px; font-size: 13px; cursor: pointer; }

        #single-product-view { display: none; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .single-layout { display: flex; flex-wrap: wrap; gap: 30px; }
        .single-media { flex: 1; min-width: 280px; }
        .single-details { flex: 1.5; min-width: 280px; }

        .cart-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .cart-box { background: white; width: 90%; max-width: 500px; padding: 20px; border-radius: 12px; max-height: 80vh; overflow-y: auto; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .no-content { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <h1 id="txt-store-name">🛍️ متجر الجزائر السحابي</h1>
            <p id="txt-store-sub">توصيل لجميع ولايات الوطن 🇩🇿 والدفع عند الاستلام</p>
        </div>
        <div class="header-actions">
            <button class="btn-lang" onclick="toggleLanguage()">🌐 <span id="lang-lbl">Français</span></button>
            <button class="btn-cart" onclick="toggleCartModal()">🛒 سلة (<span id="cart-count">0</span>)</button>
            <a href="admin.html" class="btn-admin" id="txt-admin-btn">🔐 دخول الفريق</a>
        </div>
    </header>

    <div id="main-shop-view">
        <div class="filter-section">
            <input type="text" id="searchInput" class="search-bar" placeholder="🔍 ابحث عن أي منتج..." onkeyup="filterProducts()">
            <div class="categories-scroll" id="categories-container"></div>
        </div>
        <div class="container">
            <div class="products-grid" id="products-container">
                <div class="no-content">جاري تحميل المنتجات...</div>
            </div>
        </div>
    </div>

    <div class="container" id="single-product-view">
        <button class="btn-sec" onclick="backToHome()" style="margin-bottom: 20px;">⬅️ العودة إلى الصفحة الرئيسية</button>
        <div class="single-layout" id="single-product-content"></div>
    </div>

    <div class="cart-modal" id="cartModal">
        <div class="cart-box">
            <h3 id="cart-title">سلة المشتريات 🛒</h3>
            <div id="cart-items-list">السلة فارغة</div>
            <div style="margin-top: 15px; font-weight: bold; text-align: left;" id="cart-total">المجموع: 0 دج</div>
            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button class="btn-main" onclick="checkout()">إتمام الطلب 🚀</button>
                <button class="btn-sec" onclick="toggleCartModal()">إغلاق</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, getDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];
        let cart = [];
        let currentLang = 'ar';
        let selectedCategory = 'all';

        window.translations = {
            ar: {
                title: "متجر الجزائر السحابي - المنصة الاحترافية",
                sub: "توصيل لجميع ولايات الوطن 🇩🇿 والدفع عند الاستلام",
                search: "🔍 ابحث عن أي منتج...",
                all: "الكل",
                admin: "🔐 دخول الفريق",
                cart: "🛒 سلة",
                orderNow: "اطلب الآن 🛒",
                addCart: "أضف للسلة ➕",
                stockOk: "✅ متوفر",
                stockLow: "⚠️ كمية قليلة",
                outStock: "❌ نفذت الكمية"
            },
            fr: {
                title: "Boutique Cloud Algérie - Pro",
                sub: "Livraison 58 Wilayas 🇩🇿 & Paiement à la livraison",
                search: "🔍 Rechercher un produit...",
                all: "Tout",
                admin: "🔐 Staff",
                cart: "🛒 Panier",
                orderNow: "Commander 🛒",
                addCart: "Ajouter ➕",
                stockOk: "✅ En stock",
                stockLow: "⚠️ Stock faible",
                outStock: "❌ Épuisé"
            }
        };

        window.toggleLanguage = function() {
            currentLang = currentLang === 'ar' ? 'fr' : 'ar';
            document.getElementById('htmlRoot').setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('htmlRoot').setAttribute('lang', currentLang);
            document.getElementById('lang-lbl').innerText = currentLang === 'ar' ? 'Français' : 'العربية';
            
            const t = translations[currentLang];
            document.getElementById('pageTitle').innerText = t.title;
            document.getElementById('txt-store-name').innerText = t.title;
            document.getElementById('txt-store-sub').innerText = t.sub;
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('txt-admin-btn').innerText = t.admin;
            
            renderProducts(allProducts);
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if(productId) loadSingleProduct(productId);
        }

        async function initStore() {
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                let categoriesSet = new Set();

                querySnapshot.forEach((docItem) => {
                    const data = { id: docItem.id, ...docItem.data() };
                    allProducts.push(data);
                    if(data.category) categoriesSet.add(data.category);
                });

                renderCategories(Array.from(categoriesSet));

                const urlParams = new URLSearchParams(window.location.search);
                const productId = urlParams.get('id');

                if(productId) {
                    document.getElementById('main-shop-view').style.display = 'none';
                    document.getElementById('single-product-view').style.display = 'block';
                    loadSingleProduct(productId);
                } else {
                    renderProducts(allProducts);
                }
            } catch(e) { console.error(e); }
        }

        function renderCategories(cats) {
            const container = document.getElementById('categories-container');
            const t = translations[currentLang];
            let html = `<div class="cat-chip active" onclick="filterByCategory('all', this)">${t.all}</div>`;
            cats.forEach(cat => {
                html += `<div class="cat-chip" onclick="filterByCategory('${cat}', this)">${cat}</div>`;
            });
            container.innerHTML = html;
        }

        window.filterByCategory = function(cat, element) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            applyFilters();
        }

        window.filterProducts = function() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesQuery = p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query));
                const matchesCat = selectedCategory === 'all' || p.category === selectedCategory;
                return matchesQuery && matchesCat;
            });
            renderProducts(filtered);
        }

        window.renderProducts = function(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            const t = translations[currentLang];

            if(products.length === 0) {
                container.innerHTML = `<div class="no-content">لا توجد منتجات مطابقة.</div>`;
                return;
            }

            products.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = (e) => {
                    if(e.target.tagName !== 'BUTTON') {
                        window.location.href = `?id=${prod.id}`;
                    }
                };

                let imgUrl = (prod.imageUrls && prod.imageUrls.length > 0) ? prod.imageUrls[0] : 'https://via.placeholder.com/250';
                const stockVal = prod.stock !== undefined ? prod.stock : 10;
                
                let stockHtml = `<span class="stock-badge stock-normal">${t.stockOk}</span>`;
                if(stockVal <= 0) stockHtml = `<span class="stock-badge stock-low">${t.outStock}</span>`;
                else if(stockVal <= 5) stockHtml = `<span class="stock-badge stock-low">${t.stockLow}</span>`;

                card.innerHTML = `
                    <div class="media-container"><img src="${imgUrl}"></div>
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-desc">${prod.desc || ''}</p>
                        <div class="price-row">
                            <span class="price">${prod.price} دج</span>
                            ${stockHtml}
                        </div>
                        <div class="card-buttons">
                            <button class="btn-main" onclick="window.location.href='?id=${prod.id}'">${t.orderNow}</button>
                            <button class="btn-sec" onclick="addToCart('${prod.id}', 1)">➕</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function loadSingleProduct(id) {
            const container = document.getElementById('single-product-content');
            const t = translations[currentLang];
            try {
                const docSnap = await getDoc(doc(db, "products", id));
                if(!docSnap.exists()) {
                    container.innerHTML = '<h3>المنتج غير موجود أو تم حذفه.</h3>';
                    return;
                }
                const prod = docSnap.data();
                const stockVal = prod.stock !== undefined ? prod.stock : 10;
                let imgUrl = (prod.imageUrls && prod.imageUrls.length > 0) ? prod.imageUrls[0] : 'https://via.placeholder.com/300';

                container.innerHTML = `
                    <div class="single-media">
                        <img src="${imgUrl}" style="width:100%; height:350px; object-fit:cover; border-radius:10px;">
                    </div>
                    <div class="single-details">
                        <h2>${prod.name}</h2>
                        <p style="color:var(--text-muted);">${prod.desc || ''}</p>
                        <h3 style="color:var(--danger); font-size:24px;">${prod.price} دج</h3>
                        <p><b>التصنيف:</b> ${prod.category || 'عام'}</p>
                        <div style="margin: 20px 0;">
                            <label>الكمية المطلوبة:</label>
                            <input type="number" id="single-qty" value="1" min="1" max="${stockVal}" style="width:80px; padding:8px; margin-right:10px;">
                        </div>
                        <button class="btn-main" style="padding:12px; font-size:16px;" onclick="addSingleToCart('${id}', '${prod.name}', ${prod.price}, ${stockVal})">${t.orderNow}</button>
                    </div>
                `;
            } catch(e) {
                container.innerHTML = '<h3>خطأ في تحميل تفاصيل المنتج.</h3>';
            }
        }

        window.backToHome = function() {
            window.location.href = window.location.pathname;
        }

        window.addToCart = function(id, qty) {
            const prod = allProducts.find(p => p.id === id);
            if(!prod) return;
            cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: qty });
            updateCartCount();
            alert('تمت إضافة المنتج إلى السلة بنجاح! 🛒');
        }

        window.addSingleToCart = function(id, name, price, maxStock) {
            const qty = Number(document.getElementById('single-qty').value);
            if(qty > maxStock) {
                alert(`عذراً، الكمية المتوفرة لا تكفي (${maxStock} حبات فقط)!`);
                return;
            }
            cart.push({ id, name, price, qty });
            updateCartCount();
            toggleCartModal();
        }

        window.updateCartCount = function() {
            document.getElementById('cart-count').innerText = cart.length;
            const list = document.getElementById('cart-items-list');
            let total = 0;
            if(cart.length === 0) {
                list.innerHTML = 'السلة فارغة';
                document.getElementById('cart-total').innerText = 'المجموع: 0 دج';
                return;
            }
            let html = '';
            cart.forEach((item, idx) => {
                total += item.price * item.qty;
                html += `<div class="cart-item"><span>${item.name} (x${item.qty})</span> <b>${item.price * item.qty} دج</b></div>`;
            });
            list.innerHTML = html;
            document.getElementById('cart-total').innerText = `المجموع: ${total} دج`;
        }

        window.toggleCartModal = function() {
            const modal = document.getElementById('cartModal');
            modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
        }

        window.checkout = async function() {
            if(cart.length === 0) { alert('السلة فارغة!'); return; }
            const fullName = prompt('الاسم الكامل:');
            if(!fullName) return;
            const phone = prompt('رقم الهاتف:');
            if(!phone) return;
            const wilaya = prompt('الولاية (مثلاً: الشلف، الجزائر...):');
            if(!wilaya) return;

            try {
                for(let item of cart) {
                    await addDoc(collection(db, "orders"), {
                        productName: item.name,
                        price: item.price,
                        quantity: item.qty,
                        fullName, phone, wilaya,
                        status: 'قيد الانتظار ⏳',
                        createdAt: new Date()
                    });
                }
                alert('تم إرسال طلبك بنجاح! سيتم الاتصال بك لتأكيد الطلب قريباً. 🎉');
                cart = [];
                updateCartCount();
                toggleCartModal();
            } catch(e) {
                alert('حدث خطأ أثناء إرسال الطلب.');
            }
        }

        initStore();
    </script>
</body>
</html>
