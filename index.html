<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>متجري العالمي - Amazon Style</title>
    <style>
        :root { --primary: #131921; --secondary: #232f3e; --accent: #febd69; --accent-hover: #f3a847; --success: #007600; --danger: #b12704; --bg: #eaeded; --card-bg: #ffffff; --border: #d5d9d9; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); margin: 0; padding: 0; color: #0f1111; }
        
        /* ترويسة أمازون العالمية */
        header { background: var(--primary); color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; flex-wrap: wrap; gap: 10px; }
        .logo { font-size: 22px; font-weight: bold; cursor: pointer; color: white; display: flex; align-items: center; gap: 5px; }
        .logo span { color: var(--accent); }
        
        .header-search-bar { flex: 2; display: flex; max-width: 650px; background: white; border-radius: 8px; overflow: hidden; border: 2px solid transparent; transition: 0.2s; }
        .header-search-bar:focus-within { border-color: var(--accent); }
        .header-search-bar select { background: #f3f3f3; border: none; padding: 10px; font-size: 13px; color: #555; outline: none; border-left: 1px solid var(--border); cursor: pointer; }
        .header-search-bar input { flex: 1; padding: 10px 15px; border: none; font-size: 14px; outline: none; }
        .header-search-btn { background: var(--accent); border: none; padding: 0 20px; cursor: pointer; font-size: 16px; font-weight: bold; color: #111; }

        .header-actions { display: flex; gap: 15px; align-items: center; }
        .cart-btn { background: transparent; color: white; border: 1px solid rgba(255,255,255,0.3); padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 14px; transition: 0.2s; }
        .cart-btn:hover { border-color: white; }
        .admin-btn { background: #f59e0b; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 14px; font-weight: bold; }

        /* شريط الفلاتر المتقدمة */
        .store-sub-nav { background: var(--secondary); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; color: white; font-size: 14px; }
        .categories-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
        .cat-chip { background: rgba(255,255,255,0.1); border: 1px solid transparent; padding: 5px 12px; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: 0.2s; color: white; }
        .cat-chip.active, .cat-chip:hover { background: var(--accent); color: #111; font-weight: bold; }

        .filter-sort-group { display: flex; gap: 10px; align-items: center; }
        .filter-sort-group select { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 13px; background: white; outline: none; cursor: pointer; }

        .container { max-width: 1250px; margin: auto; padding: 25px 15px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        
        .product-card { background: var(--card-bg); border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; position: relative; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.12); }
        .product-img-wrap { width: 100%; height: 200px; background: #fff; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
        .product-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 15px; font-weight: 600; margin: 0 0 6px 0; color: #0f1111; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-category { font-size: 12px; color: #565959; margin-bottom: 6px; }
        
        .stars-row { color: #ffa41c; font-size: 13px; margin-bottom: 6px; }
        .price-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
        .old-price { text-decoration: line-through; color: #565959; font-size: 12px; }
        .new-price { color: var(--danger); font-weight: bold; font-size: 18px; }
        
        .qty-selector { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; background: #f0f2f2; padding: 4px; border-radius: 6px; border: 1px solid #d5d9d9; }
        .qty-btn { background: white; border: 1px solid #d5d9d9; width: 26px; height: 26px; border-radius: 4px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        .qty-input { width: 35px; text-align: center; border: none; background: transparent; font-weight: bold; font-size: 13px; outline: none; }

        .card-actions { display: flex; gap: 8px; margin-top: auto; }
        .btn-cart { background: #ffd814; border: 1px solid #fcd200; padding: 8px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 13px; color: #0f1111; transition: 0.2s; }
        .btn-cart:hover { background: #f7ca00; }
        .btn-buy { background: #ffa41c; border: 1px solid #ff8f00; color: #0f1111; padding: 8px; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .btn-buy:hover { background: #fa9900; }

        /* صفحة تفاصيل المنتج الكاملة (Amazon Style Detail View) */
        #product-detail-view { display: none; background: white; padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .detail-grid { display: grid; grid-template-columns: 1fr 1.2fr 350px; gap: 30px; align-items: start; }
        @media(max-width: 900px) { .detail-grid { grid-template-columns: 1fr; } }
        
        .detail-img-container { text-align: center; background: #f8f9fa; padding: 20px; border-radius: 10px; border: 1px solid var(--border); }
        .detail-main-img { max-width: 100%; height: 350px; object-fit: contain; }
        .detail-thumbnails { display: flex; gap: 10px; justify-content: center; margin-top: 15px; overflow-x: auto; }
        .detail-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; border: 2px solid var(--border); cursor: pointer; transition: 0.2s; }
        .detail-thumb:hover, .detail-thumb.active { border-color: var(--accent); }

        .detail-info h1 { margin: 0 0 10px 0; font-size: 24px; color: #0f1111; }
        .detail-price { font-size: 26px; color: var(--danger); font-weight: bold; margin: 15px 0; }
        .detail-desc { font-size: 15px; line-height: 1.8; color: #333; background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 20px; }

        .buybox-card { background: #f8f9fa; border: 1px solid var(--border); padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); }

        /* سلة المشتريات الجانبية */
        .cart-drawer { position: fixed; top: 0; left: -400px; width: 380px; height: 100%; background: white; z-index: 3000; box-shadow: 5px 0 25px rgba(0,0,0,0.15); transition: left 0.3s ease; display: flex; flex-direction: column; }
        .cart-drawer.open { left: 0; }
        .cart-header { padding: 20px; background: var(--primary); color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-body { padding: 20px; flex: 1; overflow-y: auto; }
        .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: #f8fafc; }
        .cart-item { display: flex; gap: 12px; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .cart-item img { width: 55px; height: 55px; border-radius: 8px; object-fit: cover; }

        .review-card { background: #f8fafc; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; border: 1px solid var(--border); }
        .related-products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-top: 15px; }
        .related-card { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 10px; text-align: center; cursor: pointer; transition: 0.2s; }
        .related-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .related-card img { width: 100%; height: 120px; object-fit: contain; border-radius: 6px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 4000; padding: 15px; box-sizing: border-box; backdrop-filter: blur(3px); }
        .modal-card { background: white; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 13px; color: #333; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(254,189,105,0.3); }
    </style>
</head>

            "49": { home: 1500, desk: 800 }, "50": { home: 1600, desk: 1000 }, "51": { home: 900, desk: 550 },
            "52": { home: 1100, desk: 750 }, "53": { home: 1900, desk: 1300 }, "54": { home: 2000, desk: 1400 },
            "55": { home: 900, desk: 650 }, "56": { home: 1900, desk: 1200 }, "57": { home: 950, desk: 650 }, "58": { home: 1100, desk: 700 }
        };

        let allProducts = [];
        let filteredProducts = [];
        let cart = [];
        let activeCategory = 'الكل';
        let detailCurrentQty = 1;
        let selectedProductForDetail = null;
        let checkoutType = 'single';

        window.addEventListener('DOMContentLoaded', () => {
            loadStoreData();
        });

        async function loadStoreData() {
            const grid = document.getElementById('store-products-grid');
            const catContainer = document.getElementById('categories-container');
            const searchCatSelect = document.getElementById('search-category-select');
            try {
                const snap = await getDocs(collection(db, "products"));
                allProducts = [];
                let categoriesSet = new Set(['الكل']);

                snap.forEach(d => {
                    const p = { id: d.id, ...d.data() };
                    allProducts.push(p);
                    if(p.category) categoriesSet.add(p.category);
                });

                filteredProducts = [...allProducts];

                catContainer.innerHTML = '';
                searchCatSelect.innerHTML = '<option value="الكل">كل الأقسام</option>';
                
                categoriesSet.forEach(cat => {
                    let activeClass = cat === 'الكل' ? 'active' : '';
                    catContainer.innerHTML += `<div class="cat-chip ${activeClass}" onclick="filterByCategory('${cat}', this)">${cat}</div>`;
                    if(cat !== 'الكل') {
                        searchCatSelect.innerHTML += `<option value="${cat}">${cat}</option>`;
                    }
                });

                renderProducts(filteredProducts);
            } catch(e) {
                grid.innerHTML = '<p style="text-align:center; color:red; grid-column:1/-1;">خطأ في جلب المنتجات.</p>';
            }
        }

        window.renderProducts = function(products) {
            const grid = document.getElementById('store-products-grid');
            grid.innerHTML = '';

            if(products.length === 0) {
                grid.innerHTML = '<p style="text-align:center; grid-column:1/-1; color:#565959; padding:40px;">لم يتم العثور على أي منتجات مطابقة لبحثك.</p>';
                return;
            }

            products.forEach(p => {
                let img = (p.imageUrls && p.imageUrls.length > 0) ? p.imageUrls[0] : 'https://via.placeholder.com/200';
                
                // حساب متوسط التييمات
                let avgRating = 5;
                if(p.reviews && p.reviews.length > 0) {
                    let sum = p.reviews.reduce((acc, r) => acc + Number(r.rating), 0);
                    avgRating = (sum / p.reviews.length).toFixed(1);
                }
                let starsHtml = '⭐'.repeat(Math.round(avgRating));

                grid.innerHTML += `
                    <div class="product-card" onclick="openProductDetail('${p.id}')">
                        <div class="product-img-wrap"><img src="${img}" class="product-img"></div>
                        <div class="product-body">
                            <span class="product-category">${p.category || 'عام'}</span>
                            <h3 class="product-title">${p.name}</h3>
                            <div class="stars-row">${starsHtml} <span style="color:#007185; font-size:12px;">(${p.reviews ? p.reviews.length : 0})</span></div>
                            <div class="price-row">
                                <span class="new-price">${p.price} دج</span>
                            </div>
                            
                            <div class="qty-selector" onclick="event.stopPropagation()">
                                <button class="qty-btn" onclick="changeCardQty('${p.id}', -1)">-</button>
                                <input type="text" id="card-qty-${p.id}" class="qty-input" value="1" readonly>
                                <button class="qty-btn" onclick="changeCardQty('${p.id}', 1)">+</button>
                            </div>

                            <div class="card-actions" onclick="event.stopPropagation()">
                                <button class="btn-cart" onclick="addCardToCart('${p.id}')">إضافة للسلة 🛒</button>
                                <button class="btn-buy" onclick="buyNowDirect('${p.id}')">شراء فوراً ⚡</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        window.changeCardQty = function(id, delta) {
            let input = document.getElementById(`card-qty-${id}`);
            let val = Number(input.value) + delta;
            if(val < 1) val = 1;
            input.value = val;
        }

        window.addCardToCart = function(id) {
            let product = allProducts.find(p => p.id === id);
            let qty = Number(document.getElementById(`card-qty-${id}`).value) || 1;
            if(!product) return;

            let existing = cart.find(item => item.id === id);
            if(existing) {
                existing.qty += qty;
            } else {
                cart.push({ ...product, qty });
            }
            updateCartUI();
            alert(`تمت إضافة (${qty}) من "${product.name}" إلى السلة بنجاح!`);
        }

        // أداة البحث المتطورة الشاملة (تبحث في كل شيء)
        window.triggerAdvancedSearch = function() {
            let query = document.getElementById('global-search-input').value.toLowerCase().trim();
            let selectedSearchCat = document.getElementById('search-category-select').value;

            filteredProducts = allProducts.filter(p => {
                let matchesCategory = (selectedSearchCat === 'الكل' || p.category === selectedSearchCat);
                if(activeCategory !== 'الكل' && p.category !== activeCategory) matchesCategory = false;

                if(!matchesCategory) return false;
                if(!query) return true;

                let nameMatch = p.name && p.name.toLowerCase().includes(query);
                let catMatch = p.category && p.category.toLowerCase().includes(query);
                let descMatch = p.description && p.description.toLowerCase().includes(query);
                let priceMatch = p.price && p.price.toString().includes(query);

                return nameMatch || catMatch || descMatch || priceMatch;
            });

            sortProductsList(false);
        }

        window.filterByCategory = function(category, element) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            element.classList.add('active');
            activeCategory = category;
            document.getElementById('search-category-select').value = category;
            triggerAdvancedSearch();
        }

        window.sortProductsList = function(reRender = true) {
            let sortBy = document.getElementById('sort-products-select').value;

            if(sortBy === 'price-low') {
                filteredProducts.sort((a, b) => a.price - b.price);
            } else if(sortBy === 'price-high') {
                filteredProducts.sort((a, b) => b.price - a.price);
            } else if(sortBy === 'rating') {
                filteredProducts.sort((a, b) => {
                    let rA = a.reviews && a.reviews.length > 0 ? (a.reviews.reduce((s, r)=>s+Number(r.rating),0)/a.reviews.length) : 0;
                    let rB = b.reviews && b.reviews.length > 0 ? (b.reviews.reduce((s, r)=>s+Number(r.rating),0)/b.reviews.length) : 0;
                    return rB - rA;
                });
            }

            if(reRender) renderProducts(filteredProducts);
        }

        // الانتقال لصفحة تفاصيل المنتج الكاملة (Amazon Detail Page View)
        window.openProductDetail = async function(id) {
            let docSnap = await getDoc(doc(db, "products", id));
            if(!docSnap.exists()) return;
            selectedProductForDetail = { id: docSnap.id, ...docSnap.data() };
            let p = selectedProductForDetail;
            detailCurrentQty = 1;

            let images = (p.imageUrls && p.imageUrls.length > 0) ? p.imageUrls : ['https://via.placeholder.com/350'];
            let mainImg = images[0];

            let thumbsHtml = '';
            images.forEach((imgUrl, idx) => {
                let activeCls = idx === 0 ? 'active' : '';
                thumbsHtml += `<img src="${imgUrl}" class="detail-thumb ${activeCls}" onclick="changeMainImage('${imgUrl}', this)">`;
            });

            let reviewsHtml = '';
            if(p.reviews && p.reviews.length > 0) {
                p.reviews.forEach(r => {
                    reviewsHtml += `<div class="review-card"><b>👤 ${r.name}</b> (${'⭐'.repeat(r.rating)})<br>${r.comment}</div>`;
                });
            } else {
                reviewsHtml = '<p style="color:#565959; font-size:14px;">لا توجد تقييمات لهذا المنتج بعد. كن اول من يقييم!</p>';
            }

            // المنتجات المشابهة من نفس الصنف
            let related = allProducts.filter(item => item.category === p.category && item.id !== p.id);
            let relatedHtml = '';
            if(related.length > 0) {
                related.forEach(rel => {
                    let relImg = (rel.imageUrls && rel.imageUrls.length > 0) ? rel.imageUrls[0] : 'https://via.placeholder.com/120';
                    relatedHtml += `
                        <div class="related-card" onclick="openProductDetail('${rel.id}')">
                            <img src="${relImg}">
                            <h5 style="margin:6px 0 4px 0; font-size:13px; color:#0f1111;">${rel.name}</h5>
                            <span style="color:var(--danger); font-weight:bold; font-size:13px;">${rel.price} دج</span>
                        </div>
                    `;
                });
            } else {
                relatedHtml = '<p style="font-size:13px; color:#565959;">لا توجد منتجات مشابهة حالياً.</p>';
            }

            let detailHtml = `
                <div class="detail-grid">
                    <div>
                        <div class="detail-img-container">
                            <img src="${mainImg}" id="main-detail-img" class="detail-main-img">
                        </div>
                        <div class="detail-thumbnails">${thumbsHtml}</div>
                    </div>

                    <div class="detail-info">
                        <h1>${p.name}</h1>
                        <p style="color:#007185; font-size:14px; margin-bottom:10px;">التصنيف: <b>${p.category || 'عام'}</b></p>
                        <div class="detail-price">${p.price} دج</div>
                        
                        <h4 style="margin:15px 0 5px 0;">📄 وصف المنتج والمميزات:</h4>
                        <div class="detail-desc">${p.description || 'منتج أصلي عالي الجودة متوفر حصرياً عبر متجرنا العالمي مع ضمان التوصيل السريع لـ 58 ولاية والدفع عند الاستلام.'}</div>

                        <h4 style="margin:20px 0 10px 0;">💬 تقييمات العملاء:</h4>
                        ${reviewsHtml}
                    </div>

                    <div>
                        <div class="buybox-card">
                            <div style="font-size:22px; color:var(--danger); font-weight:bold; margin-bottom:15px;">${p.price} دج</div>
                            <p style="color:var(--success); font-weight:bold; font-size:13px; margin-bottom:15px;">✔️ متوفر في المخزون (توصيل سريع)</p>
                            
                            <div class="qty-selector" style="margin-bottom:15px;">
                                <button class="qty-btn" onclick="changeDetailQty(-1)">-</button>
                                <input type="text" id="detail-qty-input" class="qty-input" value="1" readonly>
                                <button class="qty-btn" onclick="changeDetailQty(1)">+</button>
                            </div>

                            <button onclick="addDetailItemToCart()" style="background:#ffd814; border:1px solid #fcd200; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; margin-bottom:10px; font-size:14px;">إضافة إلى السلة 🛒</button>
                            <button onclick="buyNowFromDetail()" style="background:#ffa41c; border:1px solid #ff8f00; width:100%; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:14px;">شراء الآن ⚡</button>
                        </div>
                    </div>
                </div>

                <hr style="border:0; border-top:1px solid var(--border); margin:40px 0 20px 0;">
                <h3 style="margin:0 0 15px 0; color:#0f1111;">📦 منتجات أخرى من نفس الصنف:</h3>
                <div class="related-products-grid">${relatedHtml}</div>
            `;

            document.getElementById('detail-content-area').innerHTML = detailHtml;
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('product-detail-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.changeMainImage = function(url, thumbElement) {
            document.getElementById('main-detail-img').src = url;
            document.querySelectorAll('.detail-thumb').forEach(t => t.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        window.backToHome = function() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.getElementById('home-view').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.changeDetailQty = function(delta) {
            detailCurrentQty += delta;
            if(detailCurrentQty < 1) detailCurrentQty = 1;
            document.getElementById('detail-qty-input').value = detailCurrentQty;
        }

        window.addDetailItemToCart = function() {
            if(!selectedProductForDetail) return;
            let existing = cart.find(item => item.id === selectedProductForDetail.id);
            if(existing) {
                existing.qty += detailCurrentQty;
            } else {
                cart.push({ ...selectedProductForDetail, qty: detailCurrentQty });
            }
            updateCartUI();
            alert(`تمت إضافة (${detailCurrentQty}) من "${selectedProductForDetail.name}" إلى السلة بنجاح!`);
        }

        window.buyNowDirect = function(id) {
            let p = allProducts.find(item => item.id === id);
            if(!p) return;
            selectedProductForDetail = p;
            detailCurrentQty = Number(document.getElementById(`card-qty-${id}`).value) || 1;
            checkoutType = 'single';
            openCheckoutModal();
        }

        window.buyNowFromDetail = function() {
            if(!selectedProductForDetail) return;
            checkoutType = 'single';
            openCheckoutModal();
        }

        window.openCheckoutFromCart = function() {
            if(cart.length === 0) { alert('سلة المشتريات فارغة!'); return; }
            checkoutType = 'cart';
            toggleCartDrawer();
            openCheckoutModal();
        }

        window.toggleCartDrawer = function() {
            document.getElementById('cartDrawer').classList.toggle('open');
        }

        function updateCartUI() {
            document.getElementById('cart-count').innerText = cart.reduce((sum, item) => sum + item.qty, 0);
            let listDiv = document.getElementById('cart-items-list');
            let total = 0;
            listDiv.innerHTML = '';

            if(cart.length === 0) {
                listDiv.innerHTML = '<p style="color:#565959; text-align:center;">سلة المشتريات فارغة.</p>';
                document.getElementById('cart-total-price').innerText = '0 دج';
                return;
            }

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                total += itemTotal;
                let img = (item.imageUrls && item.imageUrls.length > 0) ? item.imageUrls[0] : 'https://via.placeholder.com/55';
                listDiv.innerHTML += `
                    <div class="cart-item">
                        <img src="${img}">
                        <div style="flex:1;">
                            <h4 style="margin:0 0 4px 0; font-size:13px;">${item.name}</h4>
                            <div style="display:flex; align-items:center; gap:5px; margin-top:5px;">
                                <button onclick="changeCartItemQty(${index}, -1)" style="width:22px; height:22px; background:#eee; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">-</button>
                                <span style="font-size:13px; font-weight:bold;">${item.qty}</span>
                                <button onclick="changeCartItemQty(${index}, 1)" style="width:22px; height:22px; background:#eee; border:none; border-radius:4px; font-weight:bold; cursor:pointer;">+</button>
                            </div>
                        </div>
                        <div style="text-align:left;">
                            <span style="font-size:13px; color:var(--danger); font-weight:bold;">${itemTotal} دج</span><br>
                            <button onclick="removeFromCart(${index})" style="background:none; border:none; color:#007185; cursor:pointer; font-size:12px; margin-top:4px;">حذف</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('cart-total-price').innerText = total + ' دج';
        }

        window.changeCartItemQty = function(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty < 1) cart[index].qty = 1;
            updateCartUI();
        }

        window.removeFromCart = function(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        window.openCheckoutModal = function() {
            updateShippingFees();
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        window.updateShippingFees = function() {
            let wilayaSelect = document.getElementById('order-wilaya').value;
            let wilayaCode = wilayaSelect.split('|')[0];
            let deliveryType = document.getElementById('order-delivery-type').value;

            let rates = shippingRates[wilayaCode] || { home: 800, desk: 500 };
            let shippingFee = (deliveryType === 'home') ? rates.home : rates.desk;

            let subtotal = 0;
            if(checkoutType === 'single' && selectedProductForDetail) {
                subtotal = selectedProductForDetail.price * detailCurrentQty;
            } else if(checkoutType === 'cart') {
                subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            }

            let finalTotal = subtotal + shippingFee;

            document.getElementById('subtotal-display').innerText = subtotal + ' دج';
            document.getElementById('shipping-display').innerText = shippingFee + ' دج';
            document.getElementById('checkout-final-total').innerText = finalTotal;
        }

        window.submitOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilayaFull = document.getElementById('order-wilaya').value.split('|')[1];
            let commune = document.getElementById('order-commune').value.trim();
            let deliveryTypeVal = document.getElementById('order-delivery-type').value;
            let deliveryTypeText = (deliveryTypeVal === 'home') ? 'توصيل للمنزل 🏠' : 'توصيل للمكتب (Stop-Desk) 🏢';
            let finalTotal = Number(document.getElementById('checkout-final-total').innerText);
            let rating = Number(document.getElementById('order-rating').value);
            let comment = document.getElementById('order-comment').value.trim();

            if(!fullName || !phone || !commune) {
                alert('الرجاء إدخال كامل معلومات التوصيل والبلدية!');
                return;
            }

            let orderData = {
                fullName, phone, wilaya: wilayaFull, commune, deliveryType: deliveryTypeText, finalTotal, rating, comment,
                status: 'جديد ⏳',
                createdAt: new Date()
            };

            if(checkoutType === 'single' && selectedProductForDetail) {
                orderData.productName = selectedProductForDetail.name;
                orderData.quantity = detailCurrentQty;
            } else {
                orderData.productName = cart.map(i => `${i.name} (×${i.qty})`).join(', ');
                orderData.quantity = cart.reduce((sum, i) => sum + i.qty, 0);
            }

            try {
                await addDoc(collection(db, "orders"), orderData);

                if(checkoutType === 'single' && selectedProductForDetail && comment) {
                    let pRef = doc(db, "products", selectedProductForDetail.id);
                    let pSnap = await getDoc(pRef);
                    if(pSnap.exists()) {
                        let existingReviews = pSnap.data().reviews || [];
                        existingReviews.push({ name: fullName, rating, comment });
                        await updateDoc(pRef, { reviews: existingReviews });
                    }
                }

                cart = [];
                updateCartUI();

                let successHtml = `
                    <div style="text-align: center; padding: 20px 0;">
                        <div style="font-size: 60px; margin-bottom: 10px;">🎉</div>
                        <h2 style="color: var(--success); margin-bottom: 10px;">تم إرسال طلبك بنجاح!</h2>
                        <p style="color: #565959; font-size: 15px; line-height: 1.6; margin-bottom: 25px;">
                            شكراً لتسوقك معنا. سنتصل بك قريباً عبر الهاتف لتأكيد تفاصيل الطلب والتوصيل.
                        </p>
                        <button onclick="document.getElementById('checkoutModal').style.display='none'; backToHome();" style="background: #ffd814; border:1px solid #fcd200; color: #0f1111; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 15px; margin-bottom: 10px;">تسوق من جديد 🛍️</button>
                        <button onclick="document.getElementById('checkoutModal').style.display='none'" style="background: #64748b; color: white; border: none; width: 100%; padding: 10px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px;">إغلاق النافذة ❌</button>
                    </div>
                `;
                document.getElementById('checkout-modal-body').innerHTML = successHtml;

            } catch(e) {
                alert('فشل في إرسال الطلب، يرجى المحاولة لاحقاً.');
            }
        }
    </script>
</body>
</html>
