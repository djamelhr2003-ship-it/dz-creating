<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجري الجزائري - فيديوهات 1080p</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f9f9f9; margin: 0; padding: 10px; color: #333; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; border-radius: 8px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 15px; margin-top: 20px; }
        .product-card { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .media-container { width: 100%; height: 220px; background: #000; border-radius: 5px; overflow: hidden; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; }
        .media-container img, .media-container video { width: 100%; height: 100%; object-fit: contain; display: none; background: #000; }
        .media-container img.active, .media-container video.active { display: block; }
        .thumbs-container { display: flex; gap: 5px; overflow-x: auto; margin-bottom: 10px; padding-bottom: 5px; }
        .thumb-item { width: 50px; height: 50px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; background: #ddd; flex-shrink: 0; }
        .thumb-item.active { border-color: #27ae60; }
        .thumb-video { display: flex; align-items: center; justify-content: center; background: #222; color: #fff; font-size: 10px; font-weight: bold; text-align: center; }
        .price { color: #e74c3c; font-weight: bold; font-size: 18px; margin: 10px 0; text-align: center; }
        button { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background: #219653; }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ متجر الجزائر السحابي</h1>
        <p>توصيل متوفر لجميع ولايات الوطن 🇩🇿 والدفع عند الاستلام</p>
    </header>

    <div class="products-grid" id="products-container">
        <p style="text-align: center; grid-column: 1 / -1;">جاري تحميل المنتجات...</p>
    </div>

    <!-- جلب وعرض الوسائط بدقة عالية -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                if(querySnapshot.empty) {
                    container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1;">لا توجد منتجات مضافة حالياً.</p>';
                    return;
                }

                querySnapshot.forEach((docItem) => {
                    const prod = docItem.data();
                    const card = document.createElement('div');
                    card.className = 'product-card';

                    let images = prod.imageUrls || (prod.imageUrl ? [prod.imageUrl] : []);
                    let videoUrl = prod.videoUrl || '';
                    const cardId = docItem.id;

                    let mediaHtml = '';
                    let thumbsHtml = '';

                    images.forEach((imgUrl, index) => {
                        const activeClass = (index === 0 && !videoUrl) ? 'active' : '';
                        mediaHtml += `<img id="img-${cardId}-${index}" src="${imgUrl}" class="${activeClass}">`;
                        thumbsHtml += `<img src="${imgUrl}" class="thumb-item ${activeClass}" onclick="switchMedia('${cardId}', 'img', ${index}, this)">`;
                    });

                    if(videoUrl) {
                        const activeClass = images.length === 0 ? 'active' : '';
                        // إضافة خصائص التشغيل السلس والحفاظ على الدقة
                        mediaHtml += `<video id="vid-${cardId}" src="${videoUrl}" controls playsinline preload="metadata" class="${activeClass}"></video>`;
                        thumbsHtml += `<div class="thumb-item thumb-video ${activeClass}" onclick="switchMedia('${cardId}', 'vid', 0, this)">1080p ▶️</div>`;
                    }

                    if(images.length === 0 && !videoUrl) {
                        mediaHtml = `<img src="https://via.placeholder.com/150" class="active">`;
                    }

                    card.innerHTML = `
                        <div class="media-container" id="container-${cardId}">
                            ${mediaHtml}
                        </div>
                        <div class="thumbs-container">
                            ${thumbsHtml}
                        </div>
                        <h3>${prod.name}</h3>
                        <p>${prod.desc || ''}</p>
                        <div class="price">${prod.price} دج</div>
                        <button onclick="orderProduct('${prod.name}', ${prod.price})">اطلب الآن 🛒</button>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(error);
                container.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: red;">فشل في تحميل المنتجات.</p>';
            }
        }

        window.switchMedia = function(cardId, type, index, thumbElement) {
            const container = document.getElementById('container-' + cardId);
            container.querySelectorAll('img, video').forEach(el => el.classList.remove('active'));

            if(type === 'img') {
                document.getElementById(`img-${cardId}-${index}`).classList.add('active');
            } else {
                document.getElementById(`vid-${cardId}`).classList.add('active');
            }

            const parent = thumbElement.parentElement;
            parent.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        window.orderProduct = async function(productName, price) {
            const phone = prompt('أدخل رقم هاتفك لتأكيد الطلب:');
            if(!phone) return;
            const wilaya = prompt('أدخل ولايتك (مثلا: الشلف، الجزائر، البويرة...):');
            if(!wilaya) return;
            const fullName = prompt('الاسم الكامل:');
            if(!fullName) return;

            try {
                await addDoc(collection(db, "orders"), {
                    productName, price, phone, wilaya, fullName, createdAt: new Date()
                });
                alert('تم إرسال طلبك بنجاح! سنتصل بك قريباً لتأكيد الطلب. 🎉');
            } catch(e) {
                alert('حدث خطأ أثناء إرسال الطلب.');
            }
        }

        loadProducts();
    </script>
</body>
</html>
