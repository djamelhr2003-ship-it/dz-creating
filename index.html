<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LAVENDER_store.dz - المتجر الرئيسي</title>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 10px; color: #333; animation: fadeIn 0.4s ease-in-out; }
        .container { max-width: 1150px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 15px; }
        h2, h3 { color: #2c3e50; text-align: center; margin-top: 5px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 12px; }
        input, textarea, select { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; transition: 0.2s; font-size: 13px; }
        input:focus, textarea:focus, select:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
        button { background: #27ae60; color: white; border: none; padding: 8px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background: #219653; transform: translateY(-1px); }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: #232f3e; color: white; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; }
        .golden-banner { background: #fef9c3; border: 2px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        
        .products-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .product-card { background: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .product-thumb { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; background: #eee; margin-bottom: 8px; cursor: pointer; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 3000; animation: fadeIn 0.2s ease; }
        .modal-card { background: white; padding: 20px; border-radius: 12px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <!-- رأس المتجر -->
    <div class="container header-bar">
        <h3 style="margin: 0; color: white;">🛍️ LAVENDER_store.dz</h3>
        <div style="display: flex; gap: 8px;">
            <a href="admin.html" style="background:#374151; color:white; padding:6px 12px; border-radius:6px; text-decoration:none; font-size:12px;">⚙️ لوحة البائع</a>
            <button onclick="openCartModal()" style="background:#f59e0b; padding:6px 12px; font-size:12px;">🛒 سلة الشراء (<span id="cart-count">0</span>)</button>
        </div>
    </div>

    <!-- إعلان المتجر -->
    <div id="store-announcement" class="container" style="display:none; background:#e0f2fe; border:1px solid #7dd3fc; color:#0369a1; text-align:center; padding:8px; font-size:13px; font-weight:bold;"></div>

    <!-- العرض الذهبي الرئيسي -->
    <div id="main-golden-banner-container"></div>

    <!-- قائمة المنتجات -->
    <div class="container">
        <h2>منتجات المتجر</h2>
        <div id="products-container" class="products-grid">جاري تحميل المنتجات...</div>
    </div>

    <!-- نافذة تفاصيل المنتج -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-card">
            <h3 id="modal-prod-name" style="margin-top:0; color:#1e293b;"></h3>
            <img id="modal-prod-img" src="" style="width:100%; height:200px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
            <p id="modal-prod-desc" style="font-size:13px; color:#475569; line-height:1.6;"></p>
            
            <!-- مربع العرض الذهبي المصغر والمتناسق داخل صفحة المنتج -->
            <div id="product-golden-offer-box" style="display: none; background: #fef9c3; border: 1.5px solid #f59e0b; padding: 10px 12px; border-radius: 8px; margin: 10px 0; align-items: center; gap: 10px;">
                <span style="font-size: 18px;">⭐</span>
                <div style="flex: 1;">
                    <div style="font-size: 11px; font-weight: bold; color: #b45309; margin-bottom: 2px;" id="offer-box-title">عرض ذهبي محدود!</div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 12px; color: #94a3b8; text-decoration: line-through;" id="offer-box-old-price">0 دج</span>
                        <span style="font-size: 15px; font-weight: bold; color: #e11d48;" id="offer-box-new-price">0 دج</span>
                    </div>
                </div>
            </div>

            <div style="font-size:16px; font-weight:bold; color:#e11d48; margin: 10px 0;">السعر: <span id="modal-prod-price">0</span> دج</div>
            
            <div style="display:flex; gap:8px; margin-top:15px;">
                <button onclick="addToCartFromModal()" style="flex:1; background:#27ae60;">إضافة إلى السلة 🛒</button>
                <button onclick="closeProductModal()" style="flex:1; background:#64748b;">إغلاق ❌</button>
            </div>
        </div>
    </div>

    <!-- نافذة سلة الشراء وإتمام الطلب -->
    <div class="modal-overlay" id="cartModal">
        <div class="modal-card">
            <h3 style="margin-top:0; color:#1e293b;">🛒 سلة الشراء وإتمام الطلب</h3>
            <div id="cart-items-list" style="margin-bottom:12px; max-height:150px; overflow-y:auto;"></div>
            <div class="form-group"><label>الاسم الكامل:</label><input type="text" id="order-fullname"></div>
            <div class="form-group"><label>رقم الهاتف:</label><input type="tel" id="order-phone"></div>
            <div class="form-group"><label>الولاية:</label><input type="text" id="order-wilaya"></div>
            <div class="form-group"><label>البلدية:</label><input type="text" id="order-commune"></div>
            <div class="form-group"><label>نوع التوصيل:</label>
                <select id="order-delivery-type">
                    <option value="توصيل للمنزل 🏠">توصيل للمنزل 🏠</option>
                    <option value="توصيل للمكتب 🏢">توصيل للمكتب 🏢</option>
                </select>
            </div>
            <div class="form-group"><label>ملاحظات إضافية:</label><textarea id="order-notes"></textarea></div>
            <button onclick="submitOrder()" style="width:100%; background:#27ae60; padding:10px;">تأكيد وإرسال الطلب 🚀</button>
            <button onclick="closeCartModal()" style="width:100%; background:#64748b; margin-top:6px;">إغلاق ❌</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DOMKh7zTJs_Ve3d4Xp1YBdMYI",
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.firebasestorage.app",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:22c5f6f220ea809efb8480",
            measurementId: "G-MR5XLYXV0Q"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let productsCache = [], cart = [], currentSelectedProduct = null;

        window.addEventListener('DOMContentLoaded', async () => {
            loadAnnouncement();
            loadGoldenOffersBanner();
            await loadStoreProducts();
        });

        function loadAnnouncement() {
            let ad = JSON.parse(localStorage.getItem('dz_store_announcement')) || {};
            let el = document.getElementById('store-announcement');
            if(ad.visible && ad.text) {
                el.innerText = ad.text;
                el.style.display = 'block';
            }
        }

        function loadGoldenOffersBanner() {
            let container = document.getElementById('main-golden-banner-container');
            let offers = JSON.parse(localStorage.getItem('dz_golden_offers')) || [];
            let activeOffer = offers.find(o => o.visible);
            if(activeOffer) {
                container.innerHTML = `
                    <div class="container golden-banner">
                        <h3 style="margin:0 0 5px 0; color:#b45309;">⭐ عرض ذهبي خاص</h3>
                        <p style="margin:0 0 8px 0; font-size:13px; color:#78350f;">${activeOffer.details || activeOffer.productName}</p>
                        <div>
                            <span style="font-size:13px; color:#94a3b8; text-decoration:line-through; margin-left:8px;">${activeOffer.oldPrice} دج</span>
                            <span style="font-size:18px; font-weight:bold; color:#e11d48;">${activeOffer.newPrice} دج</span>
                        </div>
                    </div>
                `;
            }
        }

        async function loadStoreProducts() {
            try {
                const snap = await getDocs(collection(db, "products"));
                productsCache = [];
                snap.forEach(d => { productsCache.push({ id: d.id, ...d.data() }); });

                let container = document.getElementById('products-container');
                container.innerHTML = '';
                
                if(productsCache.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#64748b;">لا توجد منتجات معروضة حالياً.</p>';
                    return;
                }

                productsCache.forEach(p => {
                    let thumb = p.imageUrls?.[0] || 'https://via.placeholder.com/150';
                    container.innerHTML += `
                        <div class="product-card">
                            <img src="${thumb}" class="product-thumb" onclick="openProductModal('${p.id}')">
                            <h4 style="margin:0 0 5px 0; font-size:13px; color:#1e293b; cursor:pointer;" onclick="openProductModal('${p.id}')">${p.name}</h4>
                            <div style="font-weight:bold; color:#e11d48; margin-bottom:8px; font-size:14px;">${p.price} دج</div>
                            <button onclick="openProductModal('${p.id}')" style="width:100%; font-size:11px; padding:6px;">عرض التفاصيل 👁️</button>
                        </div>
                    `;
                });
            } catch(e) {
                console.error(e);
            }
        }

        window.openProductModal = function(id) {
            let p = productsCache.find(item => item.id === id);
            if(!p) return;
            currentSelectedProduct = p;

            document.getElementById('modal-prod-name').innerText = p.name;
            document.getElementById('modal-prod-img').src = p.imageUrls?.[0] || 'https://via.placeholder.com/150';
            document.getElementById('modal-prod-desc').innerText = p.description || 'لا يوجد وصف للمنتج.';
            document.getElementById('modal-prod-price').innerText = p.price;

            // استدعاء دالة التحقق وإظهار العرض الذهبي المصغر والمتناسق داخل صفحة المنتج
            checkAndShowProductOffer(p.name);

            document.getElementById('productModal').style.display = 'flex';
        }

        window.closeProductModal = function() {
            document.getElementById('productModal').style.display = 'none';
        }

        // دالة إظهار العرض الذهبي المصغر والمتناسق داخل تفاصيل المنتج
        function checkAndShowProductOffer(productName) {
            let offerBox = document.getElementById('product-golden-offer-box');
            if(!offerBox) return;

            let goldenOffers = JSON.parse(localStorage.getItem('dz_golden_offers')) || [];
            let currentOffer = goldenOffers.find(o => o.productName === productName && o.visible);

            if(currentOffer) {
                document.getElementById('offer-box-title').innerText = currentOffer.details || 'عرض ذهبي خاص!';
                document.getElementById('offer-box-old-price').innerText = currentOffer.oldPrice + ' دج';
                document.getElementById('offer-box-new-price').innerText = currentOffer.newPrice + ' دج';
                offerBox.style.display = 'flex';
            } else {
                offerBox.style.display = 'none';
            }
        }

        window.addToCartFromModal = function() {
            if(!currentSelectedProduct) return;
            cart.push({
                productName: currentSelectedProduct.name,
                price: currentSelectedProduct.price,
                imageUrl: currentSelectedProduct.imageUrls?.[0] || '',
                quantity: 1
            });
            document.getElementById('cart-count').innerText = cart.length;
            closeProductModal();
            alert('تمت إضافة المنتج إلى السلة بنجاح! 🛒');
        }

        window.openCartModal = function() {
            let list = document.getElementById('cart-items-list');
            list.innerHTML = '';
            if(cart.length === 0) {
                list.innerHTML = '<p style="font-size:12px; color:#64748b;">سلة الشراء فارغة.</p>';
            } else {
                cart.forEach((item, idx) => {
                    list.innerHTML += `<div style="display:flex; justify-content:space-between; font-size:12px; padding:4px 0; border-bottom:1px solid #eee;"><span>${item.productName} (${item.price} دج)</span><button onclick="cart.splice(${idx},1); openCartModal(); document.getElementById('cart-count').innerText=cart.length;" style="background:#dc2626; padding:2px 6px; font-size:10px;">حذف</button></div>`;
                });
            }
            document.getElementById('cartModal').style.display = 'flex';
        }

        window.closeCartModal = function() {
            document.getElementById('cartModal').style.display = 'none';
        }

        window.submitOrder = async function() {
            let fullName = document.getElementById('order-fullname').value.trim();
            let phone = document.getElementById('order-phone').value.trim();
            let wilaya = document.getElementById('order-wilaya').value.trim();
            let commune = document.getElementById('order-commune').value.trim();
            let deliveryType = document.getElementById('order-delivery-type').value;
            let notes = document.getElementById('order-notes').value.trim();

            if(!fullName || !phone || !wilaya || cart.length === 0) {
                alert('يرجى تعبئة الاسم، الهاتف، الولاية والتأكد من وجود منتجات في السلة!');
                return;
            }

            let finalTotal = cart.reduce((sum, item) => sum + (Number(item.price) || 0), 0);
            let productNameSummary = cart.map(i => i.productName).join(' + ');

            await addDoc(collection(db, "orders"), {
                fullName, phone, wilaya, commune, deliveryType, notes,
                cartItems: cart, finalTotal, productName: productNameSummary,
                status: 'جديد ⏳', createdAt: new Date()
            });

            alert('تم إرسال طلبك بنجاح! شكراً لتسوقك معنا 🚀');
            cart = [];
            document.getElementById('cart-count').innerText = 0;
            closeCartModal();
        }
    </script>
</body>
</html>
