<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر الجزائر السحابي - المتجر العصري</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #f59e0b;
            --danger: #ef4444;
            --success: #10b981;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
            color: var(--text-main);
        }

        /* الهيدر العصري */
        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            letter-spacing: 0.5px;
        }

        header p {
            margin: 0;
            color: #94a3b8;
            font-size: 14px;
        }

        /* قسم تعريف المتجر (Hero Section) */
        .hero-banner {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px;
            text-align: center;
        }

        .hero-banner h3 {
            margin: 0 0 8px 0;
            color: var(--primary);
            font-size: 18px;
        }

        .hero-banner p {
            margin: 0;
            color: var(--text-muted);
            font-size: 13px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        /* شريط البحث */
        .search-container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 30px;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            background: #fff;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* حاوية المنتجات */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* بطاقة المنتج العصرية */
        .product-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid #e2e8f0;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .media-container {
            width: 100%;
            height: 220px;
            background: #000;
            position: relative;
            overflow: hidden;
        }

        .media-container img, .media-container video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .media-container img.active, .media-container video.active {
            display: block;
        }

        .thumbs-container {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding: 8px;
            background: #f1f5f9;
        }

        .thumb-item {
            width: 45px;
            height: 45px;
            object-fit: cover;
            border-radius: 6px;
            border: 2px solid transparent;
            cursor: pointer;
            background: #cbd5e1;
            flex-shrink: 0;
            transition: border-color 0.2s;
        }

        .thumb-item.active {
            border-color: var(--primary);
        }

        .thumb-video {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #334155;
            color: #fff;
            font-size: 11px;
            font-weight: bold;
        }

        .product-info {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-title {
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin: 0 0 12px 0;
            line-height: 1.4;
            flex-grow: 1;
        }

        .price-stock-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .price {
            color: var(--danger);
            font-weight: 800;
            font-size: 18px;
        }

        .stock-badge {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 6px;
        }

        .stock-normal {
            color: var(--success);
            background: #d1fae5;
        }

        .stock-low {
            color: var(--danger);
            background: #fee2e2;
        }

        .order-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .order-btn:hover {
            background: var(--primary-dark);
        }

        .no-products {
            text-align: center;
            grid-column: 1 / -1;
            padding: 40px;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🛍️ متجر الجزائر السحابي</h1>
        <p>وجهتك الأولى للتسوق الذكي عبر الإنترنت في الجزائر 🇩🇿</p>
    </header>

    <!-- قسم تعريف المتجر العصري -->
    <section class="hero-banner">
        <h3>✨ جودة عالية وتوصيل سريع لجميع ولايات الوطن</h3>
        <p>نقدم لك أحدث المنتجات المختارة بعناية فائقة مع ضمان الجودة، وخاصية الدفع عند الاستلام بكل أمان وراحة.</p>
    </section>

    <!-- شريط البحث الفوري -->
    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن أي منتج تريده هنا..." onkeyup="filterProducts()">
    </div>

    <div class="container">
        <div class="products-grid" id="products-container">
            <div class="no-products">جاري تحميل المنتجات السحابية...</div>
        </div>
    </div>

    <!-- جلب البيانات وعرض المتجر -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDdJY7mI1DON...", 
            authDomain: "creater-ecom.firebaseapp.com",
            projectId: "creater-ecom",
            storageBucket: "creater-ecom.appspot.com",
            messagingSenderId: "893449950593",
            appId: "1:893449950593:web:..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allProducts = [];

        async function loadProducts() {
            const container = document.getElementById('products-container');
            
            try {
                const querySnapshot = await getDocs(collection(db, "products"));
                allProducts = [];
                
                querySnapshot.forEach((docItem) => {
                    allProducts.push({ id: docItem.id, ...docItem.data() });
                });

                renderProducts(allProducts);
            } catch (error) {
                console.error("خطأ في الاتصال بقاعدة البيانات:", error);
                container.innerHTML = `<div class="no-products" style="color: var(--danger);">عذراً، تحقق من تفعيل قواعد الأمان في Firebase (Firestore Rules).</div>`;
            }
        }

        window.renderProducts = function(products) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if(products.length === 0) {
                container.innerHTML = '<div class="no-products">لا توجد منتجات مطابقة للبحث أو مضافة حالياً.</div>';
                return;
            }

            products.forEach((prod) => {
                const card = document.createElement('div');
                card.className = 'product-card';

                let images = prod.imageUrls || (prod.imageUrl ? [prod.imageUrl] : []);
                let videoUrl = prod.videoUrl || '';
                const cardId = prod.id;
                const stockVal = prod.stock !== undefined ? prod.stock : 10;

                let mediaHtml = '';
                let thumbsHtml = '';

                images.forEach((imgUrl, index) => {
                    const activeClass = (index === 0 && !videoUrl) ? 'active' : '';
                    mediaHtml += `<img id="img-${cardId}-${index}" src="${imgUrl}" class="${activeClass}">`;
                    thumbsHtml += `<img src="${imgUrl}" class="thumb-item ${activeClass}" onclick="switchMedia('${cardId}', 'img', ${index}, this)">`;
                });

                if(videoUrl) {
                    const activeClass = images.length === 0 ? 'active' : '';
                    mediaHtml += `<video id="vid-${cardId}" src="${videoUrl}" controls playsinline preload="metadata" class="${activeClass}"></video>`;
                    thumbsHtml += `<div class="thumb-item thumb-video ${activeClass}" onclick="switchMedia('${cardId}', 'vid', 0, this)">1080p ▶️</div>`;
                }

                if(images.length === 0 && !videoUrl) {
                    mediaHtml = `<img src="https://via.placeholder.com/300?text=No+Image" class="active">`;
                }

                let stockHtml = '';
                if(stockVal <= 0) {
                    stockHtml = `<span class="stock-badge stock-low">❌ نفذت الكمية</span>`;
                } else if(stockVal <= 5) {
                    stockHtml = `<span class="stock-badge stock-low">⚠️ كمية قليلة</span>`;
                } else {
                    stockHtml = `<span class="stock-badge stock-normal">✅ متوفر</span>`;
                }

                card.innerHTML = `
                    <div class="media-container" id="container-${cardId}">
                        ${mediaHtml}
                    </div>
                    <div class="thumbs-container">
                        ${thumbsHtml}
                    </div>
                    <div class="product-info">
                        <h3 class="product-title">${prod.name}</h3>
                        <p class="product-desc">${prod.desc || 'لا يوجد وصف متاح للمنتج حالياً.'}</p>
                        <div class="price-stock-row">
                            <span class="price">${prod.price} دج</span>
                            ${stockHtml}
                        </div>
                        <button class="order-btn" onclick="orderProduct('${prod.name}', ${prod.price}, ${stockVal})">اطلب الآن 🛒</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // دالة البحث الفوري
        window.filterProducts = function() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query) || (p.desc && p.desc.toLowerCase().includes(query)));
            renderProducts(filtered);
        }

        window.switchMedia = function(cardId, type, index, thumbElement) {
            const container = document.getElementById('container-' + cardId);
            container.querySelectorAll('img, video').forEach(el => el.classList.remove('active'));

            if(type === 'img') {
                document.getElementById(`img-${cardId}-${index}`).classList.add('active');
            } else {
                document.getElementById(`vid-${cardId}`).classList.add('active');
            }

            const parent = thumbElement.parentElement;
            parent.querySelectorAll('.thumb-item').forEach(el => el.classList.remove('active'));
            thumbElement.classList.add('active');
        }

        window.orderProduct = async function(productName, price, maxStock) {
            if(maxStock <= 0) {
                alert('عذراً، المنتج نفد من المخزون ولا يمكن طلبه حالياً.');
                return;
            }

            const quantityInput = prompt('أدخل عدد الحبات التي تريد طلبها:', '1');
            if(!quantityInput) return;
            const quantity = Number(quantityInput);

            if(isNaN(quantity) || quantity <= 0) {
                alert('الرجاء إدخال رقم صحيح للكمية!');
                return;
            }

            if(quantity > maxStock) {
                alert(`عذراً، الكمية المتوفرة حالياً لا تكفي لطلبك (${quantity} حبات)!`);
                return;
            }

            const phone = prompt('أدخل رقم هاتفك لتأكيد الطلب:');
            if(!phone) return;
            const wilaya = prompt('أدخل ولايتك (مثلا: الشلف، الجزائر، البويرة...):');
            if(!wilaya) return;
            const fullName = prompt('الاسم الكامل:');
            if(!fullName) return;

            try {
                await addDoc(collection(db, "orders"), {
                    productName, 
                    price, 
                    quantity, 
                    phone, 
                    wilaya, 
                    fullName, 
                    status: 'قيد الانتظار ⏳', 
                    createdAt: new Date()
                });
                alert(`تم إرسال طلبك (${quantity} حبات) بنجاح! سيقوم فريقنا بالاتصال بك قريباً للتأكيد. 🎉`);
            } catch(e) {
                alert('حدث خطأ أثناء إرسال الطلب.');
            }
        }

        loadProducts();
    </script>
</body>
</html>
